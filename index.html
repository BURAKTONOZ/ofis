<html lang="tr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TONOZ AI COMPANY · Otonom Multi-Agent Şirket Sistemi</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b11;
  --card:rgba(15,19,30,.94);
  --card-2:#141927;
  --card-3:#1c2336;
  --tx:#f1f5f9;
  --mut:#94a3b8;
  --ln:rgba(148,163,184,.18);
  --acc:#6366f1;
  --acc-h:#4f46e5;
  --acc-glow:rgba(99,102,241,.38);
  --ok:#10b981;
  --warn:#f59e0b;
  --err:#ef4444;
  --cyan:#06b6d4;
  --code-bg:#06080d;
  --code-tx:#e2e8f0;
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--tx);
  font:13.5px/1.55 'Plus Jakarta Sans',sans-serif;
  user-select:none;
}

/* TAM EKRAN 2.5D KANVAS */
#cv{
  position:fixed;inset:0;width:100vw;height:100vh;
  display:block;cursor:grab;z-index:1;
}
#cv:active{cursor:grabbing}

/* ÜST YÜZEN MENÜ (SAĞA VE SOLA DENGELİ DAĞITILMIŞ) */
.topbar{
  position:fixed;top:14px;left:18px;right:18px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  pointer-events:none;flex-wrap:wrap;
}
.top-left,.top-center,.top-right{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  pointer-events:auto;
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--ln);border-radius:16px;
  padding:8px 14px;box-shadow:0 12px 34px rgba(0,0,0,.45);
}
.logo-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  display:grid;place-items:center;font:800 16px 'Space Grotesk',sans-serif;
  color:#fff;box-shadow:0 4px 14px var(--acc-glow);
}
.brand-title h1{
  font:700 16px/1.1 'Space Grotesk',sans-serif;margin:0;letter-spacing:.4px;color:#fff;
}
.brand-title span{font-size:11px;color:var(--mut);font-weight:600;display:block}

#ext-header-menu,#ext-top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ext-floating-widget{position:fixed;left:18px;bottom:94px;z-index:25;display:flex;flex-direction:column;gap:8px}

.badge{
  font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--ln);color:var(--mut);
  display:inline-flex;align-items:center;gap:6px;
}
.badge.live{border-color:rgba(16,185,129,.45);color:#34d399;background:rgba(16,185,129,.12)}
.badge.wait{border-color:rgba(245,158,11,.45);color:#fbbf24;background:rgba(245,158,11,.12)}

button,select,input,textarea{font:inherit;color:var(--tx)}
button{
  font-weight:700;font-size:12.5px;border:1px solid var(--ln);
  background:var(--card-2);border-radius:11px;padding:7px 13px;
  cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:6px;
}
button:hover{border-color:var(--acc);background:var(--card-3);transform:translateY(-1px)}
button.active-win{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 14px var(--acc-glow)}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc-h));border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--acc-glow)}
button.p:hover{filter:brightness(1.08)}
button.ok{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.45);color:#34d399}
button.warn{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.45);color:#fbbf24}
button.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#f87171}
button.sm{padding:4px 8px;font-size:11px;border-radius:8px}

input,select,textarea{
  border:1px solid var(--ln);border-radius:11px;padding:8px 12px;
  background:#0c101b;width:100%;transition:.15s;user-select:text;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.chip{font-size:10.5px;font-weight:700;border-radius:999px;padding:1.5px 7px;background:#0b0e17;color:var(--mut);border:1px solid var(--ln)}
.note{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}

/* ALT YÜZEN GÖREV KOMUT ÇUBUĞU VE İKİ SATIRLI PERSONEL SEÇİCİ */
#cmdDock{
  display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:min(1180px,calc(100vw - 36px));z-index:20;
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--ln);border-radius:18px;padding:10px 14px;
  box-shadow:0 16px 48px rgba(0,0,0,.65);
  grid-template-columns:270px 1fr auto;gap:10px;align-items:center;
}
#cmdDock.on{display:grid}
@media(max-width:920px){#cmdDock.on{grid-template-columns:1fr}}

.staff-picker-wrap{position:relative;width:100%}
.staff-picker-btn{
  width:100%;text-align:left;padding:7px 12px;border-radius:12px;
  background:#0c101b;border:1px solid var(--ln);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.staff-picker-btn:hover{border-color:var(--acc);background:var(--card-2)}
.sp-info{display:flex;flex-direction:column;overflow:hidden;line-height:1.25}
.sp-name{font-weight:700;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sp-role{font-size:11px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.staff-picker-menu{
  display:none;position:absolute;bottom:calc(100% + 10px);left:0;width:340px;max-height:340px;
  overflow-y:auto;background:var(--card);backdrop-filter:blur(18px);
  border:1px solid var(--acc);border-radius:16px;padding:8px;
  box-shadow:0 20px 50px rgba(0,0,0,.8);z-index:60;
}
.staff-picker-menu.open{display:block}
.sp-item{
  padding:9px 11px;border-radius:11px;cursor:pointer;transition:.14s;
  border:1px solid transparent;margin-bottom:4px;
}
.sp-item:hover,.sp-item.active{background:var(--card-3);border-color:var(--acc)}
.sp-item-top{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;color:#fff}
.sp-item-sub{font-size:11px;color:#cbd5e1;margin-top:2px;font-weight:600}
.sp-item-skills{font-size:10.5px;color:var(--mut);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* SAĞ ÜST BİLDİRİM / ONAY UYARI KARTI */
#ap{
  display:none;position:fixed;top:76px;right:18px;z-index:24;
  width:min(460px,calc(100vw - 36px));
  background:var(--card);backdrop-filter:blur(16px);
  border:1.5px solid var(--acc);border-radius:18px;padding:14px 16px;
  box-shadow:0 16px 45px rgba(0,0,0,.65);
}

/* SOL ALT KARAKTER BİLGİ KARTI (HOVER HUD) */
#hoverHud{
  display:none;position:fixed;bottom:92px;left:18px;z-index:18;
  background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--acc);border-radius:14px;padding:10px 14px;
  pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:350px;
}

/* SAĞ ALT KAMERA YAKINLAŞTIRMA KONTROLLERİ */
.cam-controls{
  position:fixed;right:18px;bottom:92px;z-index:18;
  display:flex;flex-direction:column;gap:6px;
}
.cam-controls button{
  width:36px;height:36px;padding:0;justify-content:center;
  border-radius:11px;background:var(--card);font-size:15px;
}

/* AÇILIR PENCERE (MODAL WINDOW) SİSTEMİ */
.win-backdrop{
  display:none;position:fixed;inset:0;z-index:40;
  background:rgba(5,7,12,.58);backdrop-filter:blur(6px);
  place-items:center;padding:20px;
}
.win-backdrop.open{display:grid}
.win-box{
  width:min(1220px,96vw);max-height:86vh;
  background:var(--card);border:1px solid var(--ln);border-radius:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.78);
  display:flex;flex-direction:column;overflow:hidden;
  user-select:text;
}
.win-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--ln);background:var(--card-2);
}
.win-head h2{font:700 17px 'Space Grotesk',sans-serif;margin:0;display:flex;align-items:center;gap:8px}
.win-body{padding:18px 20px;overflow-y:auto;flex:1}

table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:10px 11px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:rgba(15,23,42,.4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex-shrink:0}
.bar{height:7px;border-radius:99px;background:#090c14;margin:4px 0;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--cyan));transition:width .35s}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mail-grid{display:grid;grid-template-columns:360px 1fr;gap:16px}

.mail-item:hover,.mail-item.active{border-color:var(--acc);background:var(--card-3)}
.mail-item.unread{border-left:4px solid var(--acc)}

#card{

function shortName(fullName) {
  if (!fullName) return 'Ajan';
  return String(fullName)
    .replace(/\b(Hanım|Bey|Uzmanı|Yöneticisi|Müdürü|Dr\.|Prof\.)\b/gi, '')
    .trim()
    .split(/\s+/)[0] || fullName;
}
function shortRole(role) {
  if (!role) return 'UZMAN';
  const r = role.toLowerCase();
  if (r.includes('seo') || r.includes('strateji')) return 'STRATEJİ';
  if (r.includes('plan')) return 'PLANLAMA';
  if (r.includes('ik') || r.includes('insan') || r.includes('hr')) return 'İK & KOTA';

  if (r.includes('kalite') || r.includes('denetim') || r.includes('qa')) return 'KALİTE';
  return role.slice(0, 10).toUpperCase();
}

const cv = $('#cv'), cx = cv.getContext('2d');
const NX = 20, NY = 14, TW = 32, TH = 16, WL = 96;
let camX = 0, camY = 0, camZoom = 1, isDragging = false, dragMoved = false, dragStartX = 0, dragStartY = 0;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  resetCamera();
}
function resetCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  camZoom = Math.min(w / 1180, h / 680) * 0.96;
  camX = w * 0.44;
  camY = h * 0.17;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

cv.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved = false;
  dragStartX = e.clientX - camX;
  dragStartY = e.clientY - camY;
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const nx = e.clientX - dragStartX, ny = e.clientY - dragStartY;
  if (Math.hypot(nx - camX, ny - camY) > 4) dragMoved = true;
  camX = nx;
  camY = ny;
});
window.addEventListener('mouseup', () => { isDragging = false; });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.08 : 0.92;
  camZoom = Math.max(0.55, Math.min(2.2, camZoom * factor));
}, { passive: false });

const P = (x, y, z = 0) => [ (x - y) * TW, (x + y) * TH - z ];
const screenToWorld = (sx, sy) => [ (sx - camX) / camZoom, (sy - camY) / camZoom ];
const hs = (c, d) => 'hsl(' + c[0] + ' ' + c[1] + '% ' + Math.max(4, Math.min(96, c[2] + d)) + '%)';

function poly(p, f, s, lw = 1) {
  cx.beginPath();
  p.forEach((q, i) => i ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]));
  cx.closePath();
  cx.fillStyle = f; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = lw; cx.stroke(); }
}
function box(x, y, w, d, h, z, c, g) {
  const t = z + h;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], g || hs(c, -8));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], hs(c, -18));
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], hs(c, 8));
}
function glass(x, y, w, d, h) {
  const t = h;
  poly([P(x, y + d, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(148,163,184,.15)', 'rgba(148,163,184,.36)');
  poly([P(x + w, y, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x + w, y, t)], 'rgba(148,163,184,.21)', 'rgba(148,163,184,.36)');
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(226,232,240,.34)');
}
const disc = (x, y, r, c) => { cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fillStyle = c; cx.fill(); };
const el = (x, y, a, b, c) => { cx.beginPath(); cx.ellipse(x, y, a, b, 0, 0, 7); cx.fillStyle = c; cx.fill(); };
const rr = (x, y, w, h, r, c, s) => {
  cx.beginPath(); cx.roundRect(x, y, w, h, r);
  cx.fillStyle = c; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = 1.2; cx.stroke(); }
};

function bfs(s, t) {
  const q = [s], pr = {}; pr[s] = 1;
  while (q.length) {
    const c = q.shift();
    if (c[0] == t[0] && c[1] == t[1]) break;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c[0] + d[0], y = c[1] + d[1];
      if (x < 0 || y < 0 || x >= NX || y >= NY || BL[y][x] || pr[[x, y]]) continue;
      pr[[x, y]] = c; q.push([x, y]);
    }
  }
  const p = []; if (!pr[t]) return p;
  let c = t;
  while (!(c[0] == s[0] && c[1] == s[1])) { p.unshift([c[0] + .5, c[1] + .5]); c = pr[c]; }
  return p;
}
function walk(a, x, y) {
  a.path = bfs([Math.floor(a.ax), Math.floor(a.ay)], [x, y]);
  return new Promise(r => { a.res = r; if (!a.path.length) r(); });
}
const door = a => { const r = RM[a.room] || RM[0]; return [r.x, r.top ? 4 : 8]; };
const seat = a => { const r = RM[a.room] || RM[0]; return [r.sx, r.sy]; };
const goHome = a => walk(a, ...seat(a));
const say = (a, i, t) => { a.bi = i; a.bt = t; a.on = 1; };
const hush = a => { a.on = 0; };

function upd(dt) {
  store.staff.forEach(a => {
    a.mv = 0;
    if (a.path.length) {
      const p = a.path[0], dx = p[0] - a.ax, dy = p[1] - a.ay, d = Math.hypot(dx, dy), s = 2.8 * dt;
      a.mv = 1;
      if (d <= s) {
        a.ax = p[0]; a.ay = p[1]; a.path.shift();
        if (!a.path.length && a.res) { const r = a.res; a.res = 0; r(); }
      } else { a.ax += dx / d * s; a.ay += dy / d * s; }
    }
  });
}

function drawSignboard25D(gx, gy, gz, title, sub, icon, accentHex) {
  const q = P(gx, gy, gz);
  const x = q[0], y = q[1];

  cx.lineWidth = 2;

  cx.moveTo(x - 28, y - h - 9); cx.lineTo(x - 28, y - h + 2);
  cx.moveTo(x + 28, y - h - 9); cx.lineTo(x + 28, y - h + 2);
  cx.stroke();
  disc(x - 28, y - h - 9, 2.5, '#94a3b8');
  disc(x + 28, y - h - 9, 2.5, '#94a3b8');

  rr(x - w / 2 + 2, y - h + 3, w, h, 6, 'rgba(0,0,0,.55)');
  rr(x - w / 2, y - h, w, h, 6, '#131826', accentHex);

  rr(x - w / 2 + 3, y - h + 3, 22, h - 6, 4, accentHex);
  cx.font = '12px sans-serif';
  cx.textAlign = 'center';
  cx.fillStyle = '#fff';
  cx.fillText(icon, x - w / 2 + 14, y - h / 2 + 4);

  cx.textAlign = 'left';

  cx.font = '600 8px "Plus Jakarta Sans",sans-serif';

}

    prevScene.forEach(ps => {
      if (!ps || !ps.drawJs) return;
      const idx = merged.findIndex(x => x.id === ps.id);
      if (idx >= 0) merged[idx] = ps;
      else merged.push(ps);
    });
  }
  return merged;
}

const compiledDrawCache = new Map();
function collectDynamicSceneObjects() {
  const mods = getActiveSceneMods();
  const dyn = [];
  mods.forEach((m, idx) => {
    if (!m || !m.drawJs || m.hidden) return;
    const depth = Number(m.depth) ?? 12;
    let fn = compiledDrawCache.get(m.drawJs);
    if (!fn) {
      try {
        fn = new Function('api', `const {box,disc,el,rr,poly,glass,P,hs,RM,T,cx,drawSignboard25D,drawRoomPlaque,staff,filesCount,WOOD,DK,WT,COR,GRN,BLU,YEL,PNK,CH}=api;\n` + m.drawJs);
        compiledDrawCache.set(m.drawJs, fn);
      } catch (e) {
        return;
      }
    }
    dyn.push({
      k: depth + idx * 0.005,
      f: () => {
        try {
          fn({
            box, disc, el, rr, poly, glass, P, hs, RM, T, cx,
            drawSignboard25D, drawRoomPlaque,
            staff: store.staff, filesCount: store.files.length,
            WOOD, DK, WT, COR, GRN, BLU, YEL, PNK, CH
          });
        } catch (err) {}
      }
    });
  });
  return dyn;
}

function floor() {
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++)
    poly([P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)], (i + j) % 2 ? '#131828' : '#0f1320');
  RM.forEach(r => poly([P(r.x, r.top ? 0 : 10), P(r.x + r.w, r.top ? 0 : 10), P(r.x + r.w, r.top ? 3 : 14), P(r.x, r.top ? 3 : 14)], 'hsla(' + r.hue + ',55%,22%,.36)'));
  poly([P(0, NY), P(NX, NY), P(NX, NY, -14), P(0, NY, -14)], '#192036');
  poly([P(NX, 0), P(NX, NY), P(NX, NY, -14), P(NX, 0, -14)], '#111626');
}

function dAg(a) {
  const q = P(a.ax, a.ay, 0), sit = !a.mv && Math.hypot(a.ax - seat(a)[0] - .5, a.ay - seat(a)[1] - .5) < .06,
        b = a.mv ? Math.abs(Math.sin(T * 12 + a.ph)) * 2.5 : 0, x = q[0], y = q[1] + (sit ? -5 : 0) - b;
  el(q[0], q[1] + 1, 11, 5, 'rgba(0,0,0,.4)');
  if (!sit) { cx.fillStyle = '#1e293b'; cx.fillRect(x - 6, y - 9, 4, 9); cx.fillRect(x + 2, y - 9, 4, 9); }
  rr(x - 8, y - 26, 16, 19, 6, a.c); rr(x - 11, y - 24, 4, 12, 2, a.c); rr(x + 7, y - 24, 4, 12, 2, a.c);
  disc(x, y - 34, 10.5, '#fde68a'); cx.fillStyle = a.h; cx.beginPath(); cx.arc(x, y - 35, 11, Math.PI, 0); cx.fill();
  const bl = (T + a.ph) % 4 < .12 ? .5 : 2.2;
  el(x - 4, y - 33, 1.7, bl, '#0f172a'); el(x + 4, y - 33, 1.7, bl, '#0f172a');
}

function drawAllAgentTagsAndBubbles() {
  const placed = [];
  store.staff.forEach(a => {
    const q = P(a.ax, a.ay, 0);
    let tx = q[0], ty = q[1] - 56;
    placed.forEach(p => {
      if (Math.abs(tx - p.x) < 48 && Math.abs(ty - p.y) < 18) ty = p.y - 19;
    });
    placed.push({ x: tx, y: ty });

    const sName = shortName(a.name);
    cx.font = '700 10px "Plus Jakarta Sans",sans-serif';
    const w = cx.measureText(sName).width + 22;
    const isWorking = a.mon || a.st === 'Çalışıyor';
    const dotCol = isWorking ? '#10b981' : (a.mv ? '#f59e0b' : a.c);

    rr(tx - w / 2, ty - 11, w, 17, 8.5, 'rgba(11,13,20,.92)', isWorking ? '#10b981' : 'rgba(148,163,184,.35)');
    disc(tx - w / 2 + 8, ty - 2.5, 3, dotCol);
    cx.textAlign = 'left';
    cx.fillStyle = '#f8fafc';
    cx.fillText(sName, tx - w / 2 + 14, ty + 1);

    if (a.on && a.bt) {
      const bt = a.bt.slice(0, 28);
      cx.font = '700 9.5px "Plus Jakarta Sans",sans-serif';
      const bw = cx.measureText(bt).width + 26;
      const bx = tx, by = ty - 24;
      rr(bx - bw / 2, by - 9, bw, 18, 9, '#1e1b4b', '#6366f1');
      ic(a.bi, bx - bw / 2 + 11, by);
      cx.fillStyle = '#e0e7ff';
      cx.fillText(bt, bx - bw / 2 + 21, by + 3);
    }
  });
}

function ic(t, x, y) {
  cx.strokeStyle = cx.fillStyle = '#818cf8'; cx.lineWidth = 1.4; cx.beginPath();
  if (t == 'mail') { cx.rect(x - 5, y - 3.5, 10, 7); cx.moveTo(x - 5, y - 3.5); cx.lineTo(x, y + 1); cx.lineTo(x + 5, y - 3.5); cx.stroke(); }
  else if (t == 'cup') { cx.rect(x - 4, y - 3, 7, 6); cx.moveTo(x + 3, y - 1); cx.arc(x + 3.5, y + 1, 1.8, -1.6, 1.6); cx.stroke(); }
  else if (t == 'doc') { cx.rect(x - 3.5, y - 4.5, 7, 9); cx.moveTo(x - 1.5, y - 1); cx.lineTo(x + 1.5, y - 1); cx.stroke(); }
  else for (let i = -1; i < 2; i++) { cx.beginPath(); cx.arc(x + i * 4, y, 1.4, 0, 7); cx.fill(); }
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  cx.translate(camX, camY);
  cx.scale(camZoom, camZoom);

  floor();
  const dynObjs = collectDynamicSceneObjects();
  dynObjs
    .concat(store.staff.map(a => ({ k: a.ax + a.ay + .02, f: () => dAg(a) })))
    .sort((p, q) => p.k - q.k)
    .forEach(o => o.f());
  drawAllAgentTagsAndBubbles();
}

let lt = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lt) / 1000 || 0); lt = ts; T = ts / 1000;
  upd(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

async function life(a) {
  await sleep(rnd(1200, 3800));
  while (a.alive) {
    if (busy || halt || a.act) { await sleep(900); continue; }
    a.act = true;
    const r = Math.random();
    if (r < .58) {
      a.st = 'Masasında'; a.mon = 1; say(a, 'type', 'Veri inceliyor');
      await sleep(rnd(6500, 11000)); a.mon = 0;
    } else if (r < .82) {
      const k = ['yemek', 'mola', 'toplanti'][Math.floor(Math.random() * 3)];
      const sp = SP[k][Math.floor(Math.random() * SP[k].length)];
      a.st = k == 'yemek' ? 'Yemekhanede' : k == 'mola' ? 'Kahve Molasında' : 'Toplantı Odasında';
      hush(a); await walk(a, sp[0], sp[1]);
      say(a, k == 'toplanti' ? 'type' : 'cup', a.st);
      await sleep(rnd(5500, 9000)); hush(a);
    } else {
      a.st = 'Ortak Arşivde'; hush(a);
      const sp = SP.arsiv[Math.floor(Math.random() * SP.arsiv.length)];
      await walk(a, sp[0], sp[1]); say(a, 'doc', 'Arşivi tarıyor');
      await sleep(3200);
    }
    hush(a); a.st = 'Odasına dönüyor'; await goHome(a); a.st = 'Odasında'; a.act = false;
    await sleep(rnd(4000, 7000));
  }
}

  const a = mkAgent({ ...o, room, id: (CONN && OWN) ? db.collection('staff').doc().id : undefined });
  fbSaveStaff(a);
  updateTargetSelect();
  return a;
}

function syncStaff(list) {
  const ids = new Set(list.map(x => x.id));
  store.staff.filter(a => !ids.has(a.id)).forEach(a => { a.alive = false; });
  store.staff = store.staff.filter(a => ids.has(a.id));
  list.forEach(x => {
    const room = x.room != null && x.room >= 0 && x.room < RM.length ? x.room : 0;
    let a = store.staff.find(s => s.id === x.id);
    if (!a) a = mkAgent({ ...x, room });
    else {
      const rc = a.room !== room;
      Object.assign(a, {
        name: x.name,
        role: x.role,
        model: x.model || a.model,
        backup: x.backup || a.backup,
        skills: x.skills || '',
        used: x.usedToday || a.used,
        room
      });
      if (rc) { a.act = true; goHome(a).then(() => a.act = false); }
    }
    a.saved = true;
  });
  updateTargetSelect();
}

let activeUIIntervals = [];
function renderActiveUIMods() {
  activeUIIntervals.forEach(id => clearInterval(id));
  activeUIIntervals = [];

  const topSlot = $('#ext-top-right');
  const menuSlot = $('#ext-header-menu');
  const floatSlot = $('#ext-floating-widget');
  const cssSlot = $('#ext-custom-css');
  if (!topSlot || !menuSlot || !floatSlot || !cssSlot) return;

  topSlot.innerHTML = '';
  menuSlot.innerHTML = '';
  floatSlot.innerHTML = '';
  cssSlot.textContent = '';

  const baseUI = (store.officeMods && Array.isArray(store.officeMods.uiMods)) ? store.officeMods.uiMods : [];
  const prevUI = (store.previewMods && Array.isArray(store.previewMods.uiMods)) ? store.previewMods.uiMods : [];
  const allUI = [...baseUI, ...prevUI];

  let combinedCSS = '';
  allUI.forEach((mod, i) => {
    if (mod.css) combinedCSS += `\n/* Mod: ${mod.title || i} */\n` + mod.css;
    const wrapper = document.createElement('div');
    wrapper.className = 'ext-widget-item';
    wrapper.style.display = 'inline-flex';
    wrapper.style.alignItems = 'center';
    wrapper.innerHTML = mod.html || '';

    const slot = String(mod.slot || 'top-right').toLowerCase();
    if (slot.includes('menu') || slot.includes('header')) menuSlot.appendChild(wrapper);
    else if (slot.includes('float')) floatSlot.appendChild(wrapper);
    else topSlot.appendChild(wrapper);

    if (mod.js) {
      try {
        const registerInterval = (fn, ms) => { const id = setInterval(fn, ms); activeUIIntervals.push(id); return id; };
        const fn = new Function('setInterval', mod.js);
        fn(registerInterval);
      } catch (err) {}
    }
  });
  cssSlot.textContent = combinedCSS;
}

async function saveOfficeModsToFirestore() {
  if (!CONN || !OWN) return;

    });

async function applyApprovalToOffice(approvalId) {
  const ap = store.approvals.find(x => x.id === approvalId);
  if (!ap) return;

  const remIds = Array.isArray(ap.removeSceneIds) ? ap.removeSceneIds : [];
  const newScene = Array.isArray(ap.sceneMods) ? ap.sceneMods : [];
  const newUI = Array.isArray(ap.uiMods) ? ap.uiMods : [];

  let mergedScene = [...(store.officeMods.sceneMods || DEFAULT_SCENE_ITEMS)];
  if (remIds.length) {
    mergedScene = mergedScene.filter(item => !remIds.includes(item.id));
  }
  newScene.forEach(ns => {
    if (!ns || !ns.drawJs) return;
    const id = ns.id || ('sc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5));
    const idx = mergedScene.findIndex(x => x.id === id);
    if (idx >= 0) mergedScene[idx] = { ...ns, id };
    else mergedScene.push({ ...ns, id });
  });

  const mergedUI = [...(store.officeMods.uiMods || [])];
  newUI.forEach(nu => {
    if (!nu || (!nu.html && !nu.css && !nu.js)) return;
    const id = nu.id || ('ui_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5));
    const idx = mergedUI.findIndex(x => x.id === id);
    if (idx >= 0) mergedUI[idx] = { ...nu, id };
    else mergedUI.push({ ...nu, id });
  });

  store.officeMods = {
    version: (store.officeMods.version || 1) + 1,
    initializedLayout: true,
    sceneMods: mergedScene,
    uiMods: mergedUI
  };
  store.previewMods = null;
  ap.status = 'approved';

  renderActiveUIMods();
  await saveOfficeModsToFirestore();

  if (CONN && OWN) {
    await db.collection('approvals').doc(ap.id).set({
      status: 'approved',
      approvedAt: FV().serverTimestamp()
    }, { merge: true }).catch(() => {});
  }

  lg(`✅ Onaylandı ve ofis tasarımı Firestore'da güncellendi: ${ap.title}`);
  renderApprovalBanner();
  renderAll();
}

async function deleteSingleApproval(approvalId) {
  store.approvals = store.approvals.filter(x => x.id !== approvalId);
  if (store.previewMods && store.previewMods._apId === approvalId) {

    'Gemini 2.5 Flash',
    'Gemma 4 31B',
    'Gemma 4 26B'
  ];
  fallbackOrder.forEach(fn => {
    const fm = MODELS.find(m => m.n === fn);
    if (fm && !list.includes(fm)) list.push(fm);
  });

  const unique = [];
  list.forEach(m => {
    if (m && m.active && m.u < m.l && m.hu < m.rph && !unique.some(u => u.n === m.n)) {
      unique.push(m);
    }
  });
  return unique;
}

async function incrementModelQuota(modelObj, agent, tokensUsed = 1200) {
  modelObj.u++;
  modelObj.hu++;
  modelObj.tu = (modelObj.tu || 0) + tokensUsed;
  agent.used = (agent.used || 0) + 1;

  if (CONN && OWN) {
    const dayRef = db.collection('usage').doc(todayKey());
    const hKey = currentHourKey();
    const poolsUpdate = {}, hourlyUpdate = {}, tokensUpdate = {};
    MODELS.forEach(m => {
      if (m.u > 0) poolsUpdate[m.n] = m.u;
      if (m.hu > 0) hourlyUpdate[`${m.n}_${hKey}`] = m.hu;
      if (m.tu > 0) tokensUpdate[m.n] = m.tu;
    });
    await dayRef.set({
      updatedAt: FV().serverTimestamp(),
      pools: poolsUpdate,
      hourly: hourlyUpdate,
      tokens: tokensUpdate
    }, { merge: true }).catch(() => {});
    await fbSaveStaff(agent);
  }
}

function findStaffSmart(query) {
  if (!query) return null;
  const tr = s => String(s || '').toLocaleLowerCase('tr-TR').trim();
  const q = tr(query);
  if (!q) return null;

  let found = store.staff.find(s => s.id === query || tr(s.id) === q);
  if (found) return found;

  found = store.staff.find(s => tr(s.name) === q || tr(s.role) === q || tr(shortName(s.name)) === q);
  if (found) return found;

  if (q.length >= 2) {
    found = store.staff.find(s => tr(s.name).includes(q) || q.includes(tr(shortName(s.name))));
    if (found) return found;
  }

  if (q.length >= 3) {
    found = store.staff.find(s => tr(s.role).includes(q) || q.includes(tr(s.role)));
    if (found) return found;
  }

  const words = q.split(/\s+/).filter(w => w.length >= 3);
  if (words.length) {
    let best = null, bestScore = 0;
    for (const s of store.staff) {
      const hay = tr(s.name + ' ' + s.role + ' ' + (s.skills || ''));
      let score = 0;
      for (const w of words) {
        if (tr(s.name).includes(w) || tr(s.role).includes(w)) score += 3;
        else if (hay.includes(w)) score += 1;
      }
      if (score > bestScore) { bestScore = score; best = s; }
    }
    if (bestScore >= 2) return best;
  }
  return null;
}

function parseJsonSafe(rawText) {
  if (!rawText) return {};
  let cleaned = String(rawText).trim();
  cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  if (firstBrace >= 0 && lastBrace > firstBrace) {
    cleaned = cleaned.slice(firstBrace, lastBrace + 1);
  }
  return JSON.parse(cleaned);
}

async function fetchWithTimeout(url, options, timeoutMs = 25000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: ctrl.signal });
  } finally {
    clearTimeout(id);
  }
}

  ).join('\n---\n');

  // Mesajda adı geçen dosyaya öncelik ver ve tüm ortak klasör dosyalarını ajana sun
  const msgLower = ((incomingMail.subj || '') + ' ' + (incomingMail.body || '')).toLocaleLowerCase('tr-TR');
  const sortedFiles = [...relatedFiles]
    .filter(f => !String(f.path || '').startsWith('onaylanan-yama-') && !String(f.path || '').startsWith('yama-'))
    .sort((a, b) => {

      const bMatch = msgLower.includes(String(b.path || '').toLocaleLowerCase('tr-TR')) ? 1 : 0;
      return bMatch - aMatch;
    });

  const filesOverview = sortedFiles.slice(0, 8).map((f, idx) =>
    `Dosya ID: "${f.id}" | Dosya Adı: "${f.path}" (Yazan: ${f.owner})\nİçerik:\n${(f.content || '').slice(0, idx === 0 ? 12000 : 3500)}`
  ).join('\n===\n') || 'Ortak klasör boş.';

  const systemInstruction = `Sen "TONOZ AI COMPANY" şirketinde çalışan "${agent.name}", unvanın "${agent.role}".
Senin Uzmanlığın: ${agent.skills || ''}

1) CANLI FIRESTORE VERİTABANI - PERSONEL KADROSU ("staff" koleksiyonu):
${companyDirectory}
- Şirket Sahibi / Yönetici ID: "owner" (Burak Bey).

2) CANLI FIRESTORE VERİTABANI - 2.5D OFİS EŞYALARI VE MİMARİ ENVANTERİ ("settings/office_mods.sceneMods"):
${sceneInventoryText}

3) CANLI GEMINI API MODEL VE KOTA SINIRLARI:
${quotaTableText}
Mevcut Güvenli Mola Süresi: ${store.cooldownSec} saniye.

KURALLAR VE YETKİLER:
1. Kurumsal İstanbul Türkçesi (Bey/Hanım) kullan.
2. ORTAK ARŞİV / KOD DOSYASI ANALİZİ:
   - Burak Bey senden Ortak Arşivdeki (Ortak Klasördeki) bir dosyaya veya örnek koda bakmanı, yorumlamanı, SEO analizini yapmanı ya da geliştirmeni istediğinde aşağıda verilen "ORTAK KLASÖR DOSYALARI" bölümündeki dosya içeriğini satır satır incele ve cevabını/kodunu buna göre üret.
3. PERSONEL VE VERİTABANI GÜNCELLEME YETKİSİ ("hrUpdates"):
   - Burak Bey açıkça bir personelin adını ("name"), uzmanlık/yeteneklerini ("skills"), unvanını ("role") veya modelini ("model"/"backup") güncellemeni istediğinde "hrUpdates.staffUpdates" dizisini doldur (ASLA ".json" dosyası olarak "fileToSave" içine kaydetme!).
4. 2.5D OFİS EŞYASI KALDIRMA, DEĞİŞTİRME VEYA YENİ EŞYA/MENÜ EKLEME ("officePatch"):

   - Burak Bey ofisteki mevcut bir eşyayı KALDIRMAK istediğinde: "officePatch.hasPatch": true yap ve kaldırılacak eşyanın ID'sini "officePatch.removeSceneIds" dizisine yaz (örn: ["odalar_bitki"] veya ["pencereler"]).
   - Burak Bey mevcut bir eşyayı DEĞİŞTİRMEK istediğinde: "officePatch.hasPatch": true yap ve "officePatch.sceneMods" içine aynı Eşya ID'si ile yeni "drawJs" çizim kodunu yaz.
   - Burak Bey YENİ bir eşya veya sağ üst/üst menü özelliği istediğinde: "officePatch.hasPatch": true yap ve "sceneMods" veya "uiMods" içine ekle.
   - Bu tasarım değişiklikleri Burak Bey'e ONAY PAKETİ olarak sunulur; Burak Bey onayladığında Firestore'daki mevcut tasarım değişir!
   - 2.5D Sahne Çizim API'si ("sceneMods[].drawJs"):
     * Koordinatlar: x (0..20), y (0..14), z (0..90). Odalar: RM (10 oda: r.x, r.y, r.w, r.top, r.dx, r.dy, r.sx, r.sy). Zaman: T.
     * Fonksiyonlar: box(x,y,w,d,h,z,[H,S,L],optHex), P(x,y,z)->[px,py], disc(px,py,r,color), el(px,py,rx,ry,color), rr(px,py,w,h,rad,fill,stroke), glass(x,y,w,d,h), drawSignboard25D(x,y,z,title,sub,icon,hex).
5. SADECE aşağıdaki geçerli JSON formatında yanıt ver:
{
  "canvasBubble": "Kısa durum",
  "hrUpdates": {
    "cooldownSec": 0,
    "staffUpdates": [
      {
        "action": "update | create | delete",
        "agentId": "Personel ID veya mevcut adı/unvanı",
        "name": "Yeni adı",
        "role": "Yeni unvanı",
        "skills": "Güncellenmiş tam uzmanlık metni",
        "model": "",
        "backup": "",
        "room": -1
      }
    ]
  },
  "outgoingMails": [
    { "toAgentId": "Alıcı ID veya owner", "subject": "", "body": "", "type": "görev | rapor | onay" }
  ],
  "fileToSave": { "path": "", "kind": "md | code", "content": "" },
  "officePatch": {
    "hasPatch": false,
    "title": "",
    "summary": "",
    "removeSceneIds": [],
    "sceneMods": [ { "id": "", "label": "", "depth": 12, "drawJs": "" } ],
    "uiMods": [ { "id": "", "slot": "top-right", "title": "", "html": "", "css": "", "js": "" } ]
  }
}`;

  const userPrompt = `GÖREV / MESAJ:
Gönderen: ${incomingMail.f} (${incomingMail.fRole || 'Yönetici'})
Konu: ${incomingMail.subj}
İçerik: ${incomingMail.body}

ÖNCEKİ YAZIŞMALAR:
${historyText}

ORTAK KLASÖR DOSYALARI ("files" koleksiyonu - Arşivdeki Kod ve Belgeler):
${filesOverview}`;

  let lastErr = null;
  for (const modelObj of candidates) {
    for (const apiId of modelObj.apis) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${apiId}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const isGemma = apiId.startsWith('gemma');
        const payload = isGemma
          ? {
              contents: [{ role: 'user', parts: [{ text: systemInstruction + '\n\n' + userPrompt }] }],
              generationConfig: { temperature: 0.3 }
            }
          : {
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
              generationConfig: { temperature: 0.3, responseMimeType: 'application/json' }
            };

        const res = await fetchWithTimeout(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }, 25000);

        if (!res.ok) {
          const errTxt = await res.text();

      }
    }

  throw lastErr || new Error('Gemini API yanıt vermedi.');

async function applyDatabaseAndHrUpdates(decision, actingAgent) {
  const summaryLines = [];
  const hr = decision.hrUpdates || decision.dbActions || {};

  let extraStaffUpdates = [];
  if (Array.isArray(decision.staffUpdates)) extraStaffUpdates.push(...decision.staffUpdates);
  if (decision.fileToSave && decision.fileToSave.content) {
    const fPath = String(decision.fileToSave.path || '').toLowerCase();
    const fContent = String(decision.fileToSave.content || '').trim();
    if (fPath.endsWith('.json') || decision.fileToSave.kind === 'json' || (fContent.startsWith('{') && fContent.endsWith('}'))) {
      try {
        const parsed = JSON.parse(fContent);
        if (parsed && typeof parsed === 'object') {
          if (Array.isArray(parsed.staffUpdates)) {
            extraStaffUpdates.push(...parsed.staffUpdates);
            decision.fileToSave = null;
          } else if (parsed.hrUpdates && Array.isArray(parsed.hrUpdates.staffUpdates)) {
            extraStaffUpdates.push(...parsed.hrUpdates.staffUpdates);
            decision.fileToSave = null;
          } else if (parsed.agentId || parsed.newName || (parsed.skills && (parsed.name || parsed.role))) {
            extraStaffUpdates.push(parsed);
            decision.fileToSave = null;
          }
        }
      } catch (e) {}
    }
  }

  const newCool = Number(hr.cooldownSec || decision.cooldownSec || 0);
  if (newCool >= 10 && newCool <= 3600 && newCool !== store.cooldownSec) {
    store.cooldownSec = newCool;
    if (CONN && OWN) {
      await db.doc('settings/guard').set({ cooldownSec: store.cooldownSec }, { merge: true }).catch(() => {});
    }
    const msg = `Güvenli mola süresi ${store.cooldownSec} sn olarak Firestore'a işlendi.`;
    summaryLines.push(msg);
    lg(`⚖️ ${msg}`);
  }

  const allStaffUpdates = [
    ...(Array.isArray(hr.staffUpdates) ? hr.staffUpdates : []),
    ...extraStaffUpdates
  ];

  for (const su of allStaffUpdates) {
    if (!su || typeof su !== 'object') continue;
    const action = String(su.action || 'update').toLowerCase();

    if (action === 'create' || action === 'add') {
      const newName = String(su.name || su.newName || '').trim().slice(0, 48);
      const newRole = String(su.role || su.newRole || 'Uzman').trim().slice(0, 75);
      if (!newName) continue;
      const created = addStaff({
        name: newName,
        role: newRole,
        room: (su.room != null && su.room >= 0 && su.room < RM.length) ? Number(su.room) : undefined,
        model: su.model || 'Gemini 3.5 Flash Lite',
        backup: su.backup || 'Gemma 4 31B',
        skills: su.skills || ''
      });
      if (created) {
        await fbSaveStaff(created);
        const msg = `Yeni personel Firestore'a eklendi: ${created.name} (${created.role})`;
        summaryLines.push(msg);
        lg(`➕ ${msg}`);
      }
      continue;
    }

    const lookupKey = su.agentId || su.id || su.target || su.currentName || su.oldName || su.targetRole || su.role || su.name;
    const stf = findStaffSmart(lookupKey);
    if (!stf) continue;

    if (action === 'delete' || action === 'remove') {
      const oldName = stf.name;
      stf.alive = false;
      store.staff = store.staff.filter(s => s !== stf);
      await fbDelStaff(stf.id);
      updateTargetSelect();
      const msg = `${oldName} Firestore kadrosundan silindi.`;
      summaryLines.push(msg);
      lg(`🗑️ ${msg}`);
      continue;
    }

    if (actingAgent && actingAgent.id !== stf.id) {
      const d = door(stf);
      actingAgent.st = `${shortName(stf.name)} kaydını güncelliyor`;
      await walk(actingAgent, d[0], d[1]);
      say(actingAgent, 'doc', `${shortName(stf.name)} güncelleniyor`);
    }

    const oldName = stf.name;
    const changes = [];

    const candidateName = su.newName || su.name;
    if (candidateName && String(candidateName).trim()) {
      const cleanName = String(candidateName).trim().slice(0, 48);
      if (cleanName !== stf.name && cleanName.toLocaleLowerCase('tr-TR') !== String(stf.role).toLocaleLowerCase('tr-TR')) {
        stf.name = cleanName;
        changes.push(`Adı: "${oldName}" → "${stf.name}"`);
      }
    }

    const candidateRole = su.newRole || su.role;
    if (candidateRole && String(candidateRole).trim()) {
      const cleanRole = String(candidateRole).trim().slice(0, 75);
      if (cleanRole !== stf.role) {
        stf.role = cleanRole;
        changes.push(`Unvanı: "${stf.role}"`);
      }
    }

    const candidateSkills = su.newSkills || su.skills || su.appendSkills;
    if (candidateSkills && String(candidateSkills).trim()) {
      const cleanSkills = String(candidateSkills).trim();
      if (su.appendSkills || su.skillsMode === 'append') {
        if (!stf.skills.includes(cleanSkills)) {
          stf.skills = (stf.skills ? stf.skills.replace(/\.?\s*$/, '. ') : '') + cleanSkills;
        }
      } else {
        stf.skills = cleanSkills;
      }
      changes.push(`Uzmanlık (Skills) güncellendi`);
    }

    if (su.model && ACTIVE_TEXT_MODELS.some(m => m.n === su.model) && su.model !== stf.model) {
      stf.model = su.model;
      changes.push(`Ana Model: ${stf.model}`);
    }
    if (su.backup && ACTIVE_TEXT_MODELS.some(m => m.n === su.backup) && su.backup !== stf.backup) {
      stf.backup = su.backup;
      changes.push(`Yedek Model: ${stf.backup}`);
    }

    if (su.room != null && Number(su.room) >= 0 && Number(su.room) < RM.length && Number(su.room) !== stf.room) {
      stf.room = Math.floor(Number(su.room));
      stf.act = true;
      goHome(stf).then(() => stf.act = false);
      changes.push(`Oda: ${stf.room + 1}`);
    }

    await fbSaveStaff(stf);
    updateTargetSelect();
    renderAll();

    const changeDesc = changes.length ? changes.join(' | ') : 'Bilgileri Firestore üzerinde güncellendi';
    summaryLines.push(`${oldName}: ${changeDesc}`);
    lg(`✅ Firestore Güncellendi (${stf.name}): ${changeDesc}`);
    await sleep(900);
  }

  return summaryLines;
}

async function processNextPendingMail(forceNow = false) {
  if (forceNow) {
    if (halt) {
      halt = false;
      $('#stop').textContent = '⏸ Duraklat';
    }
    if (busy) {
      lg('ℹ️ Mevcut işlem zaten çalışıyor, lütfen birkaç saniye bekleyin...');
      return;
    }
  }
  if (busy || halt) return;
  if (!store.geminiKey) {
    if (forceNow) alert('Firestore settings/secret içinde apiKey bulunamadı.');
    return;
  }

  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) {
    if (forceNow) lg('ℹ️ Kuyrukta bekleyen işlenmemiş görev bulunmuyor.');
    return;
  }

  const agent = findStaffSmart(pending.toId) || findStaffSmart(pending.t);
  if (!agent) { await markMailProcessed(pending.id); return; }

  const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
  if (threadMails.length >= store.maxChainDepth) {
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  updateEngineBadges(`⚡ Çalışıyor: ${shortName(agent.name)}`);

  try {
    agent.act = true;
    await goHome(agent);
    agent.mon = 1;
    agent.st = 'Çalışıyor';
    say(agent, 'think', 'Analiz ediyor...');
    renderAll();

    const decision = await callGeminiAgent(agent, pending, threadMails, store.files);
    if (decision.canvasBubble) say(agent, 'type', decision.canvasBubble);

    const dbChanges = await applyDatabaseAndHrUpdates(decision, agent);

    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      const sp = SP.arsiv[0];
      agent.st = 'Arşive dosya yüklüyor';
      await walk(agent, sp[0], sp[1]);
      say(agent, 'doc', decision.fileToSave.path);
      await saveSharedFile(
        decision.fileToSave.path,
        decision.fileToSave.content,
        decision.fileToSave.kind || 'md',
        `${agent.name} (${shortRole(agent.role)})`
      );
      lg(`📁 ${shortName(agent.name)} ortak klasöre kaydetti: ${decision.fileToSave.path}`);
      await sleep(900);
    }

    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    if (dbChanges.length && !outList.some(o => o.toAgentId === 'owner')) {
      outList.push({
        toAgentId: 'owner',
        subject: 'Firestore Veritabanı Güncelleme Raporu',
        body: `Sayın Burak Bey,\n\nTalimatınız doğrultusunda Firestore veritabanında aşağıdaki güncellemeler uygulanmıştır:\n- ${dbChanges.join('\n- ')}`,
        type: 'rapor'
      });
    }

    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = (out.toAgentId === 'owner' || String(out.toAgentId).toLowerCase().includes('burak'))
        ? { id: 'owner', name: 'Burak Bey (Yönetici)', role: 'Şirket Sahibi' }
        : findStaffSmart(out.toAgentId);

      if (!target) continue;

      if (target.id !== 'owner') {
        const d = door(target);
        agent.st = shortName(target.name) + ' ile görüşüyor';
        await walk(agent, d[0], d[1]);
        say(agent, 'mail', shortName(target.name) + ' ile görüşüyor');
      } else {
        say(agent, 'doc', 'Rapor sunuyor');
      }

      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id, fromName: agent.name, fromRole: agent.role,
        toId: target.id, toName: target.name,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });
      lg(`✉️ ${shortName(agent.name)} → ${shortName(target.name)}: ${out.subject}`);
      await sleep(900);
    }

    // SADECE gerçek bir 2.5D ofis veya arayüz değişikliği (officePatch) varsa onay kutusuna sun (Otomatik yama.json spam'i yapma!)
    const op = decision.officePatch || {};
    const hasSceneOrUiChanges = (Array.isArray(op.sceneMods) && op.sceneMods.some(s => s && s.drawJs))
      || (Array.isArray(op.uiMods) && op.uiMods.some(u => u && (u.html || u.css || u.js)))
      || (Array.isArray(op.removeSceneIds) && op.removeSceneIds.length > 0);

    if (op.hasPatch && hasSceneOrUiChanges) {
      await createApprovalItem({
        title: op.title || pending.subj,
        summary: op.summary || 'Ekip istediğiniz ofis/arayüz değişikliğini hazırladı ve onayınıza sunar.',
        createdBy: `${agent.name} (${shortRole(agent.role)})`,
        hasPatch: true,
        removeSceneIds: Array.isArray(op.removeSceneIds) ? op.removeSceneIds : [],
        sceneMods: Array.isArray(op.sceneMods) ? op.sceneMods.filter(s => s && s.drawJs) : [],
        uiMods: Array.isArray(op.uiMods) ? op.uiMods.filter(u => u && (u.html || u.css || u.js)) : [],
        threadId: pending.threadId || pending.id
      });
    }

    await markMailProcessed(pending.id);
    agent.mon = 0; hush(agent);
    await goHome(agent);
    agent.st = 'Odasında';
    agent.act = false;

    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    lg(`❌ Hata (${shortName(agent.name)}): ${err.message}`);
    agent.mon = 0; agent.act = false; hush(agent);
    nextAllowedCallTime = Date.now() + 15000;
  } finally {
    busy = false;
    renderAll();
  }
}

async function createInternalMail({ fromId, fromName, fromRole, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  const cleanSubj = String(subject || 'Görev').slice(0, 290);
  const cleanBody = String(body || '').slice(0, 39000);
  const cleanType = ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(type) ? type : 'görev';
  const thId = threadId || ('th_' + Date.now());
  const nbMs = notBeforeMs || Date.now();

  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const tid = db.collection('tasks').doc().id;
    if (toId !== 'owner') {
      await db.collection('tasks').doc(tid).set({
        title: cleanSubj,
        description: cleanBody.slice(0, 1500),
        owner: toId,
        createdBy: fromId,
        status: 'bekliyor',
        priority: 1,
        createdAt: ts,
        updatedAt: ts
      }).catch(() => {});
    }
    await db.collection('mails').add({
      from: fromId,
      to: toId,
      subject: cleanSubj,
      body: cleanBody,
      type: cleanType,
      taskId: tid,
      threadId: thId,
      processed: toId === 'owner',
      notBefore: firebase.firestore.Timestamp.fromMillis(nbMs),
      createdAt: ts
    });
  } else {
    store.mails.unshift({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      fromId, toId, f: fromName, fRole: fromRole || 'Uzman', t: toName,
      subj: cleanSubj, body: cleanBody, type: cleanType,
      threadId: thId, processed: toId === 'owner', notBeforeMs: nbMs, time: hhmm()
    });
    renderAll();
  }
}

async function saveSharedFile(path, content, kind, ownerName) {
  const cleanPath = String(path || 'dosya.md').trim().slice(0, 240);
  const cleanContent = String(content || '').slice(0, 900000);
  const existing = store.files.find(f => f.path === cleanPath);
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const docId = existing ? existing.id : db.collection('files').doc().id;
    const ver = existing ? (existing.version || 1) + 1 : 1;
    await db.collection('files').doc(docId).set({
      path: cleanPath, content: cleanContent, owner: ownerName, kind: kind || ' code',
      version: ver, createdAt: ts, updatedAt: ts
    }, { merge: true });
    store.selectedFileId = docId;
  } else {
    if (existing) {
      existing.content = cleanContent; existing.version++; existing.owner = ownerName; existing.time = hhmm();
      store.selectedFileId = existing.id;
    } else {
      const nid = 'f_' + Date.now();
      store.files.unshift({ id: nid, path: cleanPath, content: cleanContent, kind, owner: ownerName, version: 1, time: hhmm() });
      store.selectedFileId = nid;
    }
  }
}

function downloadFile(fileId) {
  const f = store.files.find(x => x.id === fileId);
  if (!f) return;
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.path;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function saveAgentData(id) {
  const name = $('#modalName').value.trim().slice(0, 48);
  const role = $('#modalRole').value.trim().slice(0, 75);
  if (!name || !role) return alert('İsim ve unvan zorunludur.');
  const room = +$('#modalRoom').value;
  const model = $('#modalModel').value;
  const backup = $('#modalBackup').value;
  const skills = $('#modalSkills').value.trim();

  if (id) {
    const a = store.staff.find(s => s.id == id);
    Object.assign(a, { name, role, model, backup, skills });
    if (room !== a.room) { a.room = room; a.act = true; goHome(a).then(() => a.act = false); }
    fbSaveStaff(a);
  } else {
    const a = addStaff({ name, role, room, model, backup, skills });
    if (a) lg('Yeni personel kadroya katıldı: ' + name);
  }
  $('#card').style.display = 'none';
  updateTargetSelect();
  renderAll();
}

function delAgent(id) {
  const a = store.staff.find(s => s.id == id);
  if (!a || !confirm(a.name + ' kadrodan çıkarılsın mı?')) return;
  a.alive = false;
  store.staff = store.staff.filter(s => s !== a);
  fbDelStaff(id);
  $('#card').style.display = 'none';
  updateTargetSelect();
  renderAll();
}

function stfData(a) {
  const roomInt = Number.isFinite(Number(a.room)) ? Math.max(0, Math.min(15, Math.floor(Number(a.room)))) : 0;
  const o = {
    name: String(a.name || 'Ajan').trim().slice(0, 48),
    role: String(a.role || 'Uzman').trim().slice(0, 75),
    room: roomInt,
    model: a.model || 'Gemini 3.5 Flash Lite',
    backup: a.backup || 'Gemma 4 31B',
    skills: String(a.skills || ''),
    color: a.c || '#6366f1',
    hair: a.h || '#312e81',
    active: true,
    status: a.st || 'Odasında',
    usedToday: a.used || 0,
    createdBy: a.by || 'owner',
    updatedAt: FV().serverTimestamp()
  };
  if (!a.saved) o.createdAt = FV().serverTimestamp();
  return o;
}

async function startOwnerListeners() {
  clearInterval(vt);
  stopOwnerListeners();
  sendBrowserHeartbeat();
  hbTimer = setInterval(sendBrowserHeartbeat, 45000);

  try {
    const secretDoc = await db.doc('settings/secret').get();
    if (secretDoc.exists && secretDoc.data().apiKey) {
      store.geminiKey = secretDoc.data().apiKey;
    }
  } catch (e) {}

  un.push(db.doc('settings/guard').onSnapshot(doc => {
    if (doc.exists && doc.data().cooldownSec) {
      store.cooldownSec = doc.data().cooldownSec;
      renderAll();
    }
  }));

  // Tüm 2.5D ofis eşyalarını Firestore settings/office_mods üzerinden canlı dinle (ilk kez açılıyorsa varsayılan eşyaları kaydet)
  un.push(db.doc('settings/office_mods').onSnapshot(async doc => {
    if (doc.exists) {
      const d = doc.data();
      if (!d.initializedLayout) {
        const existingCustom = Array.isArray(d.sceneMods) ? d.sceneMods : [];
        const merged = [...DEFAULT_SCENE_ITEMS];
        existingCustom.forEach(cs => {
          if (!cs || !cs.drawJs) return;
          const idx = merged.findIndex(x => x.id === cs.id);
          if (idx >= 0) merged[idx] = cs;
          else merged.push(cs);
        });
        store.officeMods = {
          version: (d.version || 1) + 1,
          initializedLayout: true,
          sceneMods: merged,
          uiMods: Array.isArray(d.uiMods) ? d.uiMods : []
        };
        await saveOfficeModsToFirestore();
      } else {
        store.officeMods = {
          version: d.version || 1,
          initializedLayout: true,
          sceneMods: Array.isArray(d.sceneMods) ? d.sceneMods : [...DEFAULT_SCENE_ITEMS],
          uiMods: Array.isArray(d.uiMods) ? d.uiMods : []
        };
      }
      compiledDrawCache.clear();
      renderActiveUIMods();
      renderAll();
    } else {
      store.officeMods = {
        version: 1,
        initializedLayout: true,
        sceneMods: [...DEFAULT_SCENE_ITEMS],
        uiMods: []
      };
      await saveOfficeModsToFirestore();
    }
  }));

  un.push(db.collection('usage').doc(todayKey()).onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      const pools = d.pools || {};
      const hourly = d.hourly || {};
      const tokens = d.tokens || {};
      const hKey = currentHourKey();
      MODELS.forEach(m => {
        m.u = pools[m.n] || 0;
        m.hu = hourly[`${m.n}_${hKey}`] || 0;
        m.tu = tokens[m.n] || 0;
      });
      renderAll();
    }
  }));

  un.push(db.collection('staff').onSnapshot(q => {
    syncStaff(q.docs.map(d => ({ ...d.data(), id: d.id })));
    renderAll();
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id, fromId: m.from, toId: m.to,
        f: nm(m.from), fRole: m.fromRole || 'Uzman', t: nm(m.to),
        subj: m.subject, body: m.body, type: m.type || 'görev',
        threadId: m.threadId || d.id, processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    renderAll();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(60).onSnapshot(q => {
    store.files = q.docs.map(d => ({ ...d.data(), id: d.id, time: tm(d.updatedAt) }));
    renderAll();
  }));

  // DİKKAT: id: d.id en sonda yazılarak belge içindeki eski 'ap_...' id alanının gerçek Firestore ID'sini ezmesi engellendi!
  un.push(db.collection('approvals').orderBy('createdAt', 'desc').limit(30).onSnapshot(q => {
    store.approvals = q.docs.map(d => ({ ...d.data(), id: d.id, time: tm(d.createdAt) }));
    renderApprovalBanner();
    renderAll();
  }));
}

    subject: subj, body: rawTxt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  lg(`🚀 Görev başlatıldı → ${shortName(target.name)}: ${subj}`);
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => processNextPendingMail(true);
$('#resetProj').onclick = resetProject;

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? '▶️ Devam Et' : '⏸ Duraklat';
  if (CONN && OWN) {
    db.doc('settings/guard').set({ paused: halt }, { merge: true }).catch(() => {});
  }
  updateEngineBadges();
};

async function fbLoad() {
  try {
    for (const u of ['app', 'auth', 'firestore']) {
      await new Promise((r, j) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
        s.onload = r; s.onerror = j; document.head.appendChild(s);
      });
    }
    firebase.initializeApp(FB);
    db = firebase.firestore(); auth = firebase.auth(); CONN = true;
    auth.onAuthStateChanged(async u => {
      if (!u) { setOwner(false); pollPublic(); vt = setInterval(pollPublic, 30000); return; }
      try {
        await db.doc('settings/guard').get();
        setOwner(true); startOwnerListeners();
      } catch (e) {
        setOwner(false); await auth.signOut();
        alert('Bu hesap yönetici yetkisine sahip değil (buraktonoz@gmail.com gerekli).');
      }
    });
  } catch (e) {
    CONN = false; setOwner(true);
  }
}
fbLoad();
</script>
