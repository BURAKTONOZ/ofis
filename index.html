<style>

body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.6 'Nunito',sans-serif}

h1{font:600 24px 'Fredoka',sans-serif;margin:0;letter-spacing:.3px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:12px;text-transform:uppercase}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}
.bar{height:9px;border-radius:9px;background:var(--bg);margin:4px 0 10px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .3s}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--mut);margin-left:6px;border:1px solid var(--ln)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mail-grid{display:grid;grid-template-columns:360px 1fr;gap:16px}

.mail-list{max-height:520px;overflow-y:auto;border-right:1px solid var(--ln);padding-right:10px}

.mail-item:hover,.mail-item.active{border-color:var(--acc);background:#1f1b33}

.note{font-size:12.5px;color:var(--mut)}
.row{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;align-items:center}

/* ============================================================================

const cv = $('#cv'), cx = cv.getContext('2d');
cx.scale(2, 2);
const TW = 28, TH = 14, OX = 400, OY = 118, N = 14, WL = 90;
const P = (x, y, z = 0) => [OX + (x - y) * TW, OY + (x + y) * TH - z];
const hs = (c, d) => 'hsl(' + c[0] + ' ' + c[1] + '% ' + Math.max(4, Math.min(97, c[2] + d)) + '%)';

function poly(p, f, s) {
  cx.beginPath();
  p.forEach((q, i) => i ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]));
  cx.closePath();
  cx.fillStyle = f; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = 1; cx.stroke(); }
}
function box(x, y, w, d, h, z, c, g) {
  const t = z + h;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], g || hs(c, -8));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], hs(c, -17));
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], hs(c, 7));
}
function glass(x, y, w, d, h) {
  const t = h;
  poly([P(x, y + d, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(255,255,255,.25)', 'rgba(160,140,220,.5)');
  poly([P(x + w, y, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x + w, y, t)], 'rgba(200,190,240,.3)', 'rgba(160,140,220,.5)');
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(255,255,255,.45)');
}
const disc = (x, y, r, c) => { cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fillStyle = c; cx.fill(); };
const el = (x, y, a, b, c) => { cx.beginPath(); cx.ellipse(x, y, a, b, 0, 0, 7); cx.fillStyle = c; cx.fill(); };
const rr = (x, y, w, h, r, c) => { cx.beginPath(); cx.roundRect(x, y, w, h, r); cx.fillStyle = c; cx.fill(); };

const WOOD = [32, 62, 65], DK = [28, 30, 35], WT = [260, 40, 90], COR = [12, 80, 65],
      GRN = [140, 45, 45], BLU = [205, 70, 65], YEL = [45, 85, 65], PNK = [340, 55, 65], CH = [255, 40, 55];

const RM = [
  [0, 0, 3, 1], [4, 0, 3, 1], [8, 0, 3, 1],

}));

const BL = Array.from({ length: N }, () => Array(N).fill(0));
const blk = (x, y, w = 1, d = 1) => { for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) BL[y + j][x + i] = 1; };
RM.forEach(r => {
  blk(r.dx, r.dy, 2, 1);
  for (let x = r.x + 1; x < r.x + r.w; x++) blk(x, r.wy);
  blk(r.x + r.w - 1, r.top ? 2 : 10);
});
[3, 7, 11].forEach(x => { blk(x, 0, 1, 4); blk(x, 9, 1, 5); });
blk(1, 5, 3, 1); blk(1, 7, 3, 1); blk(6, 6, 3, 1); blk(11, 7, 2, 1); blk(13, 4); blk(13, 5, 1, 2);

const SP = {
  yemek: [[4, 6], [0, 6], [1, 6]],
  mola: [[10, 7], [12, 8], [10, 5]],
  toplanti: [[7, 5], [6, 7], [8, 7]],
  arsiv: [[12, 5], [12, 6]]
};

let busy = false, halt = false, OWN = false, T = 0, tbOn = false;

function bfs(s, t) {
  const q = [s], pr = {}; pr[s] = 1;
  while (q.length) {
    const c = q.shift();
    if (c[0] == t[0] && c[1] == t[1]) break;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c[0] + d[0], y = c[1] + d[1];
      if (x < 0 || y < 0 || x >= N || y >= N || BL[y][x] || pr[[x, y]]) continue;
      pr[[x, y]] = c; q.push([x, y]);
    }
  }
  const p = []; if (!pr[t]) return p;
  let c = t;
  while (!(c[0] == s[0] && c[1] == s[1])) { p.unshift([c[0] + .5, c[1] + .5]); c = pr[c]; }
  return p;
}
function walk(a, x, y) {
  a.path = bfs([Math.floor(a.ax), Math.floor(a.ay)], [x, y]);
  return new Promise(r => { a.res = r; if (!a.path.length) r(); });
}
const door = a => { const r = RM[a.room]; return [r.x, r.top ? 4 : 8]; };
const seat = a => { const r = RM[a.room]; return [r.sx, r.sy]; };
const goHome = a => walk(a, ...seat(a));
const say = (a, i, t) => { a.bi = i; a.bt = t; a.on = 1; };

function upd(dt) {
  store.staff.forEach(a => {
    a.mv = 0;
    if (a.path.length) {
      const p = a.path[0], dx = p[0] - a.ax, dy = p[1] - a.ay, d = Math.hypot(dx, dy), s = 2.5 * dt;
      a.mv = 1;
      if (d <= s) {
        a.ax = p[0]; a.ay = p[1]; a.path.shift();
        if (!a.path.length && a.res) { const r = a.res; a.res = 0; r(); }
      } else { a.ax += dx / d * s; a.ay += dy / d * s; }
    }
  });
}

const OB = [], add = (k, f) => OB.push({ k, f });
RM.forEach(r => {

[5, 7].forEach(y => add(2.5 + y + .5, () => {

function floor() {
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    poly([P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)], (i + j) % 2 ? '#1a1626' : '#151221');

  poly([P(5, 4), P(9, 4), P(9, 9), P(5, 9)], 'rgba(59,130,246,.08)');
  poly([P(9, 4), P(14, 4), P(14, 9), P(9, 9)], 'rgba(236,72,153,.08)');

  poly([P(N, 0), P(N, N), P(N, N, -12), P(N, 0, -12)], '#1b1428');

    poly([P(w[0] - .1, 0, 28), P(w[1] + .1, 0, 28), P(w[1] + .1, 0, 76), P(w[0] - .1, 0, 76)], '#2d2440');
    poly([P(w[0], 0, 32), P(w[1], 0, 32), P(w[1], 0, 72), P(w[0], 0, 72)], '#362e4d');
    poly([P(w[0], 0, 32), P(w[1], 0, 32), P(w[1], 0, 48), P(w[0], 0, 48)], '#4a3d6b');

}
function over() {
  RM.forEach(r => { const y = r.wy + .4; glass(r.x + 1, y, r.w - 1, .2, 34); glass(r.x, y, .12, .2, 34); });

  RM.forEach(r => {
    const a = store.staff.find(s => s.room === r.i), t = a ? a.role + ' · ' + a.name : 'Boş Oda ' + (r.i + 1), q = P(r.x + 1.6, r.wy + .7, 24), w = cx.measureText(t).width + 14;
    rr(q[0] - w / 2, q[1] - 9, w, 16, 8, a ? '#252036' : '#181524');
    cx.fillStyle = a ? '#ede8ff' : '#6b618a'; cx.fillText(t, q[0], q[1] + 3);
  });
  cx.font = '700 11px Nunito,sans-serif';
  SIGNS[3][0] = 'Ortak Klasör (' + store.files.length + ')';
  SIGNS.forEach(s => {
    const q = P(s[1], s[2], s[3]), w = cx.measureText(s[0]).width + 16;
    rr(q[0] - w / 2, q[1] - 10, w, 18, 9, 'rgba(124,92,239,.9)');

async function life(a) {
  await sleep(rnd(1000, 4000));
  while (a.alive) {
    if (busy || halt || a.act) { await sleep(800); continue; }
    a.act = true;
    const r = Math.random();
    if (r < .55) {
      a.st = 'Masasında'; a.mon = 1; say(a, 'type', 'Verileri inceliyor');
      await sleep(rnd(7000, 12000)); a.mon = 0;
    } else if (r < .80) {
      const k = ['yemek', 'mola', 'toplanti'][Math.floor(Math.random() * 3)];
      const sp = SP[k][Math.floor(Math.random() * 3)];
      a.st = k == 'yemek' ? 'Yemekhanede' : k == 'mola' ? 'Kahve Molasında' : 'Toplantı Alanında';
      hush(a); await walk(a, sp[0], sp[1]);
      say(a, k == 'toplanti' ? 'type' : 'cup', a.st);
      await sleep(rnd(6000, 10000)); hush(a);
    } else {
      a.st = 'Ortak Klasörde'; hush(a);
      const sp = SP.arsiv[Math.floor(Math.random() * 2)];
      await walk(a, sp[0], sp[1]); say(a, 'doc', 'Arşivi tarıyor');
      await sleep(3500);
    }
    hush(a); a.st = 'Odasına dönüyor'; await goHome(a); a.st = 'Odasında'; a.act = false;

let nextAllowedCallTime = 0;

function selectAvailableModel(agent) {
  const primary = mdl(agent.model);
  if (primary.u < primary.l) return primary;
  const backup = mdl(agent.backup || 'Gemma 4 31B');
  if (backup.u < backup.l) {
    lg(`⚠️ ${agent.name} ana model kotasını doldurdu. Yedek modele (${backup.n}) geçildi.`);
    return backup;
  }
  return null;
}

async function incrementModelQuota(modelObj, agent) {
  modelObj.u++;
  agent.used = (agent.used || 0) + 1;
  if (CONN && OWN) {
    const dayRef = db.collection('usage').doc(todayKey());
    const poolsUpdate = {};
    MODELS.forEach(m => { poolsUpdate[m.n] = m.u; });
    await dayRef.set({ updatedAt: FV().serverTimestamp(), pools: poolsUpdate }, { merge: true }).catch(() => {});
    await db.collection('staff').doc(agent.id).set({ usedToday: agent.used, lastActionAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
  }
}

async function callGeminiAgent(agent, incomingMail, threadMails, relatedFiles) {
  const apiKey = store.geminiKey;
  if (!apiKey) throw new Error('Gemini API Anahtarı bulunamadı! Lütfen Firebase settings/secret belgesine anahtarınızı tanımlayın.');

  const chosenModel = selectAvailableModel(agent);
  if (!chosenModel) throw new Error(`${agent.name} için tüm model günlük kotaları tükendi!`);

  const companyDirectory = store.staff.map(s =>
    `- ID: "${s.id}" | İsim: ${s.name} | Rol: ${s.role} | Uzmanlık: ${s.skills || ''}`
  ).join('\n');

  const historyText = threadMails.slice(-4).map(m =>
    `[${m.f} -> ${m.t} (${m.type})]: ${m.subj}\n${m.body}`
  ).join('\n---\n');

  const filesOverview = relatedFiles.slice(0, 4).map(f =>
    `Dosya: ${f.path} (Sahibi: ${f.owner})\nİçerik:\n${f.content.slice(0, 3000)}`
  ).join('\n===\n') || 'Ortak klasör boş.';

  const systemInstruction = `Sen "Tonoz AI Ofisi" şirketinde çalışan "${agent.name}" (${agent.role}) konumundasın.
Uzmanlığın: ${agent.skills || ''}

ŞİRKET KURALLARI:
1. Kurumsal İstanbul Türkçesi (Bey/Hanım) kullan.
2. İş bölümü yaparken SADECE aşağıdaki personel listesindeki ID'leri ("toAgentId") kullan:
${companyDirectory}
- Genel Müdür ID: "owner" (Burak Bey). Sadece son sunum veya onay aşamasında "owner"a rapor gönder.
3. Token tasarrufu için gereksiz mesajlaşma yapma; işini hemen yapıp ortak klasöre kaydet ve sonraki departmana ilet.
4. Yanıtını SADECE aşağıdaki JSON formatında ver:
{
  "canvasBubble": "Kısa durum (Örn: Kodları yazıyor)",
  "fileToSave": {
    "path": "Dosya adı (Örn: makale.md veya script.js) - dosya yoksa boş ''",
    "kind": "md | code | svg | json",
    "content": "Dosya içeriği"
  },
  "outgoingMails": [
    {
      "toAgentId": "Alıcı ID",
      "subject": "Mesaj konusu",
      "body": "Kurumsal talimat veya rapor",
      "type": "görev | rapor | onay"
    }
  ],
  "submitFinalApproval": {
    "ready": false,
    "summary": "Tüm süreç tamamlandıysa Burak Bey için özet"
  }
}`;

  const userPrompt = `GÖREV / MESAJ:
Gönderen: ${incomingMail.f}
Konu: ${incomingMail.subj}
İçerik: ${incomingMail.body}

ÖNCEKİ YAZIŞMALAR:
${historyText}

ORTAK KLASÖR DOSYALARI:
${filesOverview}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${chosenModel.api}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemInstruction }] },
      contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
      generationConfig: { temperature: 0.4, responseMimeType: 'application/json' }
    })
  });

  if (!res.ok) {
    const errTxt = await res.text();
    throw new Error(`Gemini API Hatası (${res.status}): ${errTxt.slice(0, 250)}`);
  }

  await incrementModelQuota(chosenModel, agent);
  const data = await res.json();
  const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  return JSON.parse(rawText);
}

async function processNextPendingMail(forceNow = false) {
  if (busy || halt) return;
  if (!store.geminiKey) return;

  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) return;

  const agent = store.staff.find(s => s.id === pending.toId || s.name === pending.t);
  if (!agent) { await markMailProcessed(pending.id); return; }

  const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
  if (threadMails.length >= store.maxChainDepth) {
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  updateEngineBadges('Çalışıyor: ' + agent.name);

  try {
    agent.act = true;
    await goHome(agent);
    agent.mon = 1;
    agent.st = 'Çalışıyor';
    say(agent, 'think', 'Analiz ediyor...');
    render();

    const decision = await callGeminiAgent(agent, pending, threadMails, store.files);
    if (decision.canvasBubble) say(agent, 'type', decision.canvasBubble);

    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      const sp = SP.arsiv[0];
      agent.st = 'Arşive dosya yüklüyor';
      await walk(agent, sp[0], sp[1]);
      say(agent, 'doc', decision.fileToSave.path + ' kaydedildi');
      await saveSharedFile(decision.fileToSave.path, decision.fileToSave.content, decision.fileToSave.kind || 'md', agent.name);
      lg(`📁 ${agent.name} dosya kaydetti: ${decision.fileToSave.path}`);
      await sleep(1400);
    }

    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = out.toAgentId === 'owner'
        ? { id: 'owner', name: 'Sen (Burak Bey)' }
        : (store.staff.find(s => s.id === out.toAgentId || s.name === out.toAgentId) || null);

      if (!target) continue;

      if (target.id !== 'owner') {
        const d = door(target);
        agent.st = target.name + ' odasına gidiyor';
        await walk(agent, d[0], d[1]);
        say(agent, 'mail', target.name + ' ile görüşüyor');
      } else {
        say(agent, 'doc', 'Yöneticiye rapor sunuyor');
      }

      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id, fromName: agent.name,
        toId: target.id, toName: target.name,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });
      lg(`✉️ ${agent.name} → ${target.name}: ${out.subject}`);
      await sleep(1500);
    }

    if (decision.submitFinalApproval && decision.submitFinalApproval.ready) {
      showApprovalBox(pending.subj, decision.submitFinalApproval.summary || 'Çalışma tamamlandı.');
    }

    await markMailProcessed(pending.id);
    agent.mon = 0; hush(agent);
    await goHome(agent);
    agent.st = 'Odasında';
    agent.act = false;

    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    lg(`❌ Hata (${agent.name}): ${err.message}`);
    agent.mon = 0; agent.act = false; hush(agent);
    nextAllowedCallTime = Date.now() + 15000;
  } finally {
    busy = false;
    render();
  }
}

async function createInternalMail({ fromId, fromName, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  const mailObj = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    fromId, toId, f: fromName, t: toName,
    subj: subject, body, type: type || 'görev',
    threadId: threadId || ('th_' + Date.now()),
    processed: toId === 'owner',
    notBeforeMs: notBeforeMs || Date.now(),
    time: hhmm()
  };

  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const tid = db.collection('tasks').doc().id;
    if (toId !== 'owner') {
      await db.collection('tasks').doc(tid).set({
        title: subject, description: body.slice(0, 1500),
        owner: toId, createdBy: fromId, status: 'bekliyor',
        priority: 1, createdAt: ts, updatedAt: ts
      }).catch(() => {});
    }
    await db.collection('mails').add({
      from: fromId, to: toId, subject, body, type: mailObj.type,
      taskId: tid, threadId: mailObj.threadId,
      processed: mailObj.processed,
      notBefore: firebase.firestore.Timestamp.fromMillis(mailObj.notBeforeMs),
      createdAt: ts
    });
  } else {
    store.mails.unshift(mailObj);
    render();
  }
}

async function markMailProcessed(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  if (m) m.processed = true;
  if (CONN && OWN && !String(mailId).startsWith('m_')) {
    await db.collection('mails').doc(mailId).update({
      processed: true, readAt: FV().serverTimestamp()
    }).catch(() => {});
  }
}

async function saveSharedFile(path, content, kind, ownerName) {
  const existing = store.files.find(f => f.path === path);
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const docId = existing ? existing.id : db.collection('files').doc().id;
    const ver = existing ? (existing.version || 1) + 1 : 1;
    await db.collection('files').doc(docId).set({
      path, content, owner: ownerName, kind: kind || 'md',
      version: ver, createdAt: ts, updatedAt: ts
    }, { merge: true });
  } else {
    if (existing) {
      existing.content = content; existing.version++; existing.owner = ownerName; existing.time = hhmm();
    } else {
      store.files.unshift({ id: 'f_' + Date.now(), path, content, kind, owner: ownerName, version: 1, time: hhmm() });
    }
  }
}

  $('#okBtn').onclick = () => {
    tbOn = true; blk(9, 4, 2, 1);
    e.innerHTML = '<p class="note" style="margin:0;color:var(--ok)"><b>Onaylandı!</b> Çıktılar ortak klasörde arşivlendi.</p>';
    lg('Burak Bey: Çalışmayı onayladı.');
    pub();
  };
  $('#revBtn').onclick = () => {
    const note = prompt('Revize talebinizi yazın:');
    if (note) { $('#ti').value = 'REVİZE: ' + note; $('#go').click(); }
    e.style.display = 'none';
  };
}

  else if (tab === 'files') {

function replyToMail(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  const txt = $('#replyTxt')?.value.trim();
  if (!m || !txt) return;
  const target = store.staff.find(s => s.id === m.fromId || s.name === m.f) || store.staff[0];
  if (!target) return;
  createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: target.name,
    subject: 'RE: ' + m.subj, body: txt,
    type: 'görev', threadId: m.threadId, notBeforeMs: Date.now()
  });
  lg(`Sen → ${target.name}: ${txt}`);
  $('#replyTxt').value = '';
}

function newFilePrompt() {
  const path = prompt('Dosya adı (örn: kod.js):');
  if (!path) return;
  const content = prompt('İçerik:');
  if (content == null) return;
  saveSharedFile(path.trim(), content, 'md', 'Sen (Burak Bey)');
  render();
}

async function saveSettings() {
  const k = $('#cfgKey').value.trim();
  const c = Math.max(10, Number($('#cfgCool').value || 15));
  store.geminiKey = k;
  store.cooldownSec = c;
  if (CONN && OWN) {
    await db.doc('settings/secret').set({ apiKey: k, updatedAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
    await db.doc('settings/guard').set({ cooldownSec: c, updatedAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
  }
  alert('Ayarlar Firestore kasasına ve sisteme kaydedildi!');
  render();
}

// Çakışmayı önlemek için fonksiyon adı "openAgentModal" yapıldı
function openAgentModal(id) {
  const a = id ? store.staff.find(s => s.id == id) : null, c = $('#card');
  c.style.display = 'block';
  const opt = sel => MODELS.map(m => `<option ${m.n === sel ? 'selected' : ''}>${m.n}</option>`).join('');
  const free = RM.filter(r => !store.staff.some(s => s.room === r.i) || (a && a.room === r.i));
  c.innerHTML = `
    <h3>${a ? 'Personeli Düzenle' : 'Yeni Ajan Ekle'}</h3>
    <label>İsim</label>
    <input id="modalName" value="${esc(a ? a.name : '')}" placeholder="Ahmet Bey">
    <label>Departman / Unvan</label>
    <input id="modalRole" value="${esc(a ? a.role : '')}" placeholder="Kod Uzmanı">
    <label>Oda</label>
    <select id="modalRoom">${free.map(r => `<option value="${r.i}" ${a && a.room === r.i ? 'selected' : ''}>Oda ${r.i + 1}</option>`).join('')}</select>
    <label>Ana Model</label>
    <select id="modalModel">${opt(a ? a.model : 'Gemini 3.5 Flash Lite')}</select>
    <label>Yedek Model</label>
    <select id="modalBackup">${opt(a ? a.backup : 'Gemma 4 31B')}</select>
    <label>Uzmanlık (Skills)</label>
    <textarea id="modalSkills" rows="3">${esc(a ? a.skills : '')}</textarea>
    <div class="row">
      <button class="p" onclick="saveAgentData('${a ? a.id : ''}')">Kaydet</button>
      ${a ? `<button class="danger" onclick="delAgent('${a.id}')">Sil</button>` : ''}
      <button onclick="$('#card').style.display='none'">Kapat</button>
    </div>`;
}

function saveAgentData(id) {
  const name = $('#modalName').value.trim();
  const role = $('#modalRole').value.trim();
  if (!name || !role) return alert('İsim ve rol zorunludur.');
  const room = +$('#modalRoom').value;
  const model = $('#modalModel').value;
  const backup = $('#modalBackup').value;
  const skills = $('#modalSkills').value.trim();

  if (id) {
    const a = store.staff.find(s => s.id == id);
    Object.assign(a, { name, role, model, backup, skills });
    if (room !== a.room) { a.room = room; a.act = true; goHome(a).then(() => a.act = false); }
    fbSaveStaff(a);
  } else {
    const a = addStaff({ name, role, room, model, backup, skills });
    if (a) lg('Yeni personel katıldı: ' + name);
  }
  $('#card').style.display = 'none';
  updateTargetSelect();
  render();
}

function delAgent(id) {
  const a = store.staff.find(s => s.id == id);
  if (!a || !confirm(a.name + ' silinsin mi?')) return;
  a.alive = false;
  store.staff = store.staff.filter(s => s !== a);
  fbDelStaff(id);
  $('#card').style.display = 'none';
  updateTargetSelect();
  render();
}

cv.addEventListener('click', e => {
  if (!OWN) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 800, y = (e.clientY - r.top) / r.height * 530;
  let best = null, bd = 26;
  store.staff.forEach(a => {
    const q = P(a.ax, a.ay, 0), d = Math.hypot(q[0] - x, q[1] - 24 - y);
    if (d < bd) { bd = d; best = a; }
  });
  if (best) openAgentModal(best.id);
});

/* ============================================================================
   7. FIREBASE AUTH VE BAĞLANTILAR
   ============================================================================ */
function stfData(a) {
  const o = {
    name: a.name, role: a.role, room: a.room,
    model: a.model, backup: a.backup, skills: a.skills || '',
    color: a.c, hair: a.h, active: true, status: a.st || 'Odasında',
    usedToday: a.used || 0, createdBy: a.by || 'owner'
  };
  if (!a.saved) o.createdAt = FV().serverTimestamp();
  return o;
}

function fbSaveStaff(a) {
  if (!CONN || !OWN) return;
  db.collection('staff').doc(a.id).set(stfData(a), { merge: true }).then(() => { a.saved = true; pub(); }).catch(() => {});
}

function fbDelStaff(id) {
  if (!CONN || !OWN) return;
  db.collection('staff').doc(id).delete().then(pub).catch(() => {});
}

function pub() {
  if (!CONN || !OWN) return;
  clearTimeout(pt);
  pt = setTimeout(() => db.doc('public/office').set({
    updatedAt: FV().serverTimestamp(), paused: halt,
    items: tbOn ? ['yemek-masasi'] : [],
    staff: store.staff.map(a => ({ id: a.id, name: a.name, role: a.role, room: a.room, color: a.c, hair: a.h, state: 'work' }))
  }).catch(() => {}), 1000);
}

function stopOwnerListeners() { un.forEach(f => f()); un = []; }

async function startOwnerListeners() {
  clearInterval(vt); stopOwnerListeners();

  // Firestore gizli kasasından API anahtarını otomatik çek
  try {
    const secretDoc = await db.doc('settings/secret').get();
    if (secretDoc.exists && secretDoc.data().apiKey) {
      store.geminiKey = secretDoc.data().apiKey;
      lg('Gemini API anahtarı Firestore gizli kasasından yüklendi.');
    }
  } catch (e) {}

  un.push(db.collection('staff').onSnapshot(q => {
    if (q.empty && store.staff.length === 0) { seedDefaultStaff(); return; }
    syncStaff(q.docs.map(d => ({ id: d.id, ...d.data() })));
    render();
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id, fromId: m.from, toId: m.to,
        f: nm(m.from), t: nm(m.to),
        subj: m.subject, body: m.body, type: m.type || 'görev',
        threadId: m.threadId || d.id, processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    render();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(50).onSnapshot(q => {
    store.files = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.updatedAt) }));
    render();
  }));
}

async function pollPublic() {
  try {
    const d = await db.doc('public/office').get(), o = d.exists ? d.data() : {};
    if (o.staff && o.staff.length) syncStaff(o.staff);
    else if (!store.staff.length) seedDefaultStaff();
  } catch (e) {
    if (!store.staff.length) seedDefaultStaff();
  }
}

function setOwner(b) {
  OWN = b;
  $('#panel').classList.toggle('on', b);
  $('#bl').textContent = b ? 'Çıkış Yap' : 'Yönetici Girişi';
  $('#bl').className = b ? '' : 'p';
  updateEngineBadges();
  render();
}

$('#bl').onclick = () => {
  if (CONN && !OWN) return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('Giriş hatası: ' + e.message));
  if (CONN && OWN) return auth.signOut();
  setOwner(!OWN);
};

$('#go').onclick = async () => {
  const txt = $('#ti').value.trim();
  if (!txt) return alert('Lütfen görev konusunu yazın.');
  const targetId = $('#targetAgent').value;
  const target = store.staff.find(s => s.id === targetId) || store.staff[0];
  if (!target) return alert('Önce personel ekleyin.');

  $('#ti').value = '';
  const subj = txt.length > 50 ? txt.slice(0, 50) + '...' : txt;
  await createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: target.name,
    subject: subj, body: txt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  lg(`Sen → ${target.name}: ${subj}`);
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => processNextPendingMail(true);

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? 'Devam Et' : 'Acil Durdur';
  lg(halt ? '⏸ Ajanlar duraklatıldı.' : '▶️ Çalışma devam ediyor.');
  updateEngineBadges();
};

async function fbLoad() {
  try {
    for (const u of ['app', 'auth', 'firestore']) {
      await new Promise((r, j) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
        s.onload = r; s.onerror = j; document.head.appendChild(s);
      });
    }
    firebase.initializeApp(FB);
    db = firebase.firestore(); auth = firebase.auth(); CONN = true;
    auth.onAuthStateChanged(async u => {
      if (!u) { setOwner(false); pollPublic(); vt = setInterval(pollPublic, 30000); return; }
      try {
        await db.doc('settings/guard').get();
        setOwner(true); startOwnerListeners();
      } catch (e) {
        setOwner(false); await auth.signOut();
        alert('Bu hesap yönetici yetkisine sahip değil (buraktonoz@gmail.com gerekli).');
      }
    });
  } catch (e) {
    CONN = false; seedDefaultStaff(); setOwner(true);
  }
}
fbLoad();
