<head>

<style>
:root{
  --bg:#0f0d16;--card:#181523;--tx:#f0ecff;--mut:#8e82b0;--ln:#2c2542;
  --acc:#7c5cef;--acc-h:#6845db;--on:#fff;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;
  --code-bg:#0a0810;--code-tx:#dcd6ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 'Nunito',sans-serif}
.wrap{max-width:1420px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font:600 22px 'Fredoka',sans-serif;margin:0}
h3{font:500 15.5px 'Fredoka',sans-serif;margin:0 0 8px}
.badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--card);border:1.5px solid var(--ln);color:var(--mut)}
.badge.live{border-color:var(--ok);color:var(--ok)}
.badge.wait{border-color:var(--warn);color:var(--warn)}
.badge.err{border-color:var(--err);color:var(--err)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{font-weight:700;border:1.5px solid var(--ln);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--on)}
button.p:hover{background:var(--acc-h)}
button.ok{border-color:var(--ok);color:var(--ok)}
button.danger{border-color:var(--err);color:var(--err)}
input,select,textarea{border:1.5px solid var(--ln);border-radius:10px;padding:8px 11px;background:#13101c;width:100%}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 3px}

/* Ana Sahne ve Tasarım Modu Yan Yana Düzeni */
.stage-grid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.stage-grid.design-active{grid-template-columns:1fr 390px}
@media(max-width:1024px){.stage-grid.design-active{grid-template-columns:1fr}}

canvas{width:100%;height:auto;display:block;border-radius:18px;border:1.5px solid var(--ln);background:#14111f;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.box{background:var(--card);border:1.5px solid var(--ln);border-radius:18px;padding:16px;margin-top:12px}
#panel,#ap,#designSidebar{display:none}
#panel.on,#designSidebar.on{display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.bar{height:8px;border-radius:9px;background:var(--bg);margin:4px 0 9px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .3s}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--mut);margin-left:5px;border:1px solid var(--ln);display:inline-block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.mail-grid{display:grid;grid-template-columns:350px 1fr;gap:14px}
@media(max-width:850px){.mail-grid{grid-template-columns:1fr}}
.mail-list{max-height:480px;overflow-y:auto;border-right:1px solid var(--ln);padding-right:8px}
.mail-item{padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;margin-bottom:7px;background:#13101d}
.mail-item:hover,.mail-item.active{border-color:var(--acc);background:#1d182d}
.mail-item.unread{border-left:4px solid var(--acc)}
. mail-item.stuck{border-left:4px solid var(--err)}
.note{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
pre.code{background:var(--code-bg);color:var(--code-tx);padding:12px;border-radius:12px;overflow-x:auto;font:12.5px/1.55 'JetBrains Mono',monospace;max-height:440px;white-space:pre-wrap;border:1px solid var(--ln)}
#card{display:none;position:fixed;right:16px;bottom:16px;width:min(430px,calc(100vw - 32px));max-height:88vh;overflow:auto;z-index:50;box-shadow:0 15px 45px rgba(0,0,0,.7);border:1.5px solid var(--acc)}
.item-card{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;background:#13101d;border:1px solid var(--ln);margin-bottom:6px;cursor:pointer}
.item-card.selected{border-color:var(--acc);background:#211b36}
footer{text-align:center;font-size:11.5px;color:var(--mut);margin:20px 0 6px}

<script>
/* ============================================================================
   1. FIREBASE YAPILANDIRMASI VE AKILLI MODEL HAVUZU
   ============================================================================ */
const FB = {
  apiKey: 'AIzaSyAoPd-gsCIEzXJ8_TOeZBvcSICNvHvW29Q',
  authDomain: 'ofis-29534.firebaseapp.com',
  projectId: 'ofis-29534',
  storageBucket: 'ofis-29534.firebasestorage.app',
  messagingSenderId: '180162023869',
  appId: '1:180162023869:web:572660067d56af023442d4'
};

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm = () => new Date().toTimeString().slice(0, 5);
const todayKey = () => new Date().toISOString().slice(0, 10);

// Arayüzde seçilen etiketlerin Google API'deki gerçek karşılıkları (Dinamik keşif ile güncellenir)
const MODELS = [
  { n: 'Gemini 3.8 Flash',      pref: ['gemini-2.5-flash', 'gemini-2.0-flash'], l: 20,    u: 0, rpm: 5,  desc: 'Yönetici & Strateji (20/gün)' },
  { n: 'Gemini 3.6 Flash',      pref: ['gemini-2.5-flash', 'gemini-2.0-flash'], l: 20,    u: 0, rpm: 5,  desc: 'Planlama & Analiz (20/gün)' },
  { n: 'Gemini 3 Flash',        pref: ['gemini-2.5-flash', 'gemini-2.0-flash'], l: 20,    u: 0, rpm: 5,  desc: 'Kalite & Denetim (20/gün)' },
  { n: 'Gemini 2.5 Flash',      pref: ['gemini-2.5-flash', 'gemini-2.0-flash'], l: 20,    u: 0, rpm: 5,  desc: 'İK & Koordinasyon (20/gün)' },
  { n: 'Gemini 3.5 Flash Lite', pref: ['gemini-3.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash-lite', 'gemini-2.0-flash'], l: 500, u: 0, rpm: 15, desc: 'Hızlı Üretim (500/gün)' },
  { n: 'Gemini 3.1 Flash Lite', pref: ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash'], l: 500, u: 0, rpm: 15, desc: 'Genel Üretim (500/gün)' },
  { n: 'Gemma 4 31B',           pref: ['gemma-3-27b-it', 'gemini-2.0-flash', 'gemini-2.5-flash'], l: 14400, u: 0, rpm: 30, desc: 'Geniş Yedek Havuz (14.4K/gün)' },
  { n: 'Gemma 4 26B',           pref: ['gemma-3-27b-it', 'gemini-2.0-flash', 'gemini-2.5-flash'], l: 14400, u: 0, rpm: 30, desc: 'Yedek Üretim Havuzu (14.4K/gün)' }
];

const store = {
  staff: [],
  mails: [],
  tasks: [],
  files: [],
  items: [], // Firestore'dan çekilen dinamik ofis eşyaları
  log: [],
  availableApiModels: [], // Google API'den canlı sorgulanan çalışan modeller
  cooldownUntilByModel: {}, // 429 alan modelleri geçici dinlendiren harita
  failCountByMail: {}, // Aynı mailde takılmayı önleyen sayaç
  selectedMailId: null,
  selectedFileId: null,
  selectedItemId: null,
  designMode: false,
  geminiKey: '',
  cooldownSec: 65, // Dakikada 5 istek sınırına (RPM) takılmamak için güvenli mola
  maxChainDepth: 12
};

/* ============================================================================
   2. GOOGLE API CANLI MODEL KEŞFİ (404 HATALARINI KÖKTEN BİTİRİR)
   ============================================================================ */
async function discoverWorkingModels() {
  if (!store.geminiKey) return;
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(store.geminiKey)}`);
    if (!res.ok) return;
    const data = await res.json();
    const valid = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace('models/', ''));
    
    if (valid.length) {
      store.availableApiModels = valid;
      $('#modelBadge').className = 'badge live';
      $('#modelBadge').textContent = `✓ ${valid.length} Aktif API Modeli Hazır`;
      lg(`Google API tarandı: Hesabınızda çalışan ${valid.length} model doğrulandı.`);
    }
  } catch (e) {
    console.warn('Model listesi alınamadı:', e);
  }
}

// Ajanın model ismine göre Google API'de %100 çalışan ve 429 yememiş gerçek modeli bulur
function resolveWorkingApiModel(agent) {
  const now = Date.now();
  const candidates = [agent.model, agent.backup, 'Gemini 3.5 Flash Lite', 'Gemini 2.5 Flash', 'Gemma 4 31B'];
  
  for (const label of candidates) {
    const pool = MODELS.find(m => m.n === label);
    if (!pool || pool.u >= pool.l) continue;

    for (const apiName of pool.pref) {
      // Eğer API'den canlı liste çekildiyse, sadece o listede gerçekten var olan modeli seç (404'ü engeller)
      if (store.availableApiModels.length > 0 && !store.availableApiModels.includes(apiName)) {
        continue;
      }
      // Bu model yakın zamanda 429 (Rate Limit) yediyse dinlenme süresi bitene kadar atla
      if ((store.cooldownUntilByModel[apiName] || 0) > now) {
        continue;
      }
      return { pool, apiName };
    }
  }

  // Eğer listedeki tercihlerin hiçbiri eşleşmediyse, hesabın desteklediği ilk flash/gemma modelini seç
  const fallbackApi = store.availableApiModels.find(m => /flash|gemma/i.test(m) && (store.cooldownUntilByModel[m] || 0) <= now)
                      || 'gemini-2.5-flash';
  return { pool: MODELS[4], apiName: fallbackApi };
}

/* ============================================================================
   3. İZOMETRİK 2.5D OFİS & CANLI EŞYA TASARIM MOTORU
   ============================================================================ */
const cv = $('#cv'), cx = cv.getContext('2d');
cx.scale(2, 2);
const TW = 28, TH = 14, OX = 400, OY = 118, N = 14, WL = 90;
const P = (x, y, z = 0) => [OX + (x - y) * TW, OY + (x + y) * TH - z];
const hs = (c, d) => 'hsl(' + c[0] + ' ' + c[1] + '% ' + Math.max(4, Math.min(97, c[2] + d)) + '%)';

// Ekran koordinatından (Mouse tıklaması) İzometrik Grid (X, Y) koordinatına dönüşüm
function screenToIsoGrid(sx, sy) {
  const dx = (sx - OX) / TW;
  const dy = (sy - OY) / TH;
  const gx = Math.floor((dx + dy) / 2);
  const gy = Math.floor((dy - dx) / 2);
  return [Math.max(0, Math.min(N - 1, gx)), Math.max(0, Math.min(N - 1, gy))];
}

function poly(p, f, s) {
  cx.beginPath();
  p.forEach((q, i) => i ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]));
  cx.closePath();
  cx.fillStyle = f; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = 1; cx.stroke(); }
}
function box(x, y, w, d, h, z, c, g) {
  const t = z + h;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], g || hs(c, -8));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], hs(c, -17));
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], hs(c, 7));
}
function glass(x, y, w, d, h) {
  const t = h;
  poly([P(x, y + d, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(255,255,255,.22)', 'rgba(160,140,220,.45)');
  poly([P(x + w, y, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x + w, y, t)], 'rgba(200,190,240,.28)', 'rgba(160,140,220,.45)');
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(255,255,255,.4)');
}
const disc = (x, y, r, c) => { cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fillStyle = c; cx.fill(); };
const el = (x, y, a, b, c) => { cx.beginPath(); cx.ellipse(x, y, a, b, 0, 0, 7); cx.fillStyle = c; cx.fill(); };
const rr = (x, y, w, h, r, c) => { cx.beginPath(); cx.roundRect(x, y, w, h, r); cx.fillStyle = c; cx.fill(); };

const WOOD = [32, 62, 62], DK = [28, 30, 32], WT = [260, 40, 90], COR = [12, 80, 65],
      GRN = [140, 50, 45], BLU = [205, 70, 62], YEL = [45, 85, 65], PNK = [340, 55, 62], CH = [255, 40, 55];

const RM = [
  [0, 0, 3, 1], [4, 0, 3, 1], [8, 0, 3, 1],
  [0, 10, 3, 0], [4, 10, 3, 0], [8, 10, 3, 0],
  [12, 0, 2, 1], [12, 10, 2, 0]
].map((r, i) => ({
  i, x: r[0], y: r[1], w: r[2], top: r[3], wy: r[3] ? 3 : 9,
  hue: [265, 330, 200, 150, 45, 15, 285, 100][i],
  dx: r[2] == 3 ? r[0] + 1 : r[0], dy: r[3] ? 0 : 12,
  sx: r[2] == 3 ? r[0] + 1 : r[0], sy: r[3] ? 1 : 11
}));

const BL = Array.from({ length: N }, () => Array(N).fill(0));
const blk = (x, y, w = 1, d = 1) => {
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) {
    if (y + j >= 0 && y + j < N && x + i >= 0 && x + i < N) BL[y + j][x + i] = 1;
  }
};
RM.forEach(r => {
  blk(r.dx, r.dy, 2, 1);
  for (let x = r.x + 1; x < r.x + r.w; x++) blk(x, r.wy);
});
[3, 7, 11].forEach(x => { blk(x, 0, 1, 4); blk(x, 9, 1, 5); });

const SP = {
  yemek: [[4, 6], [0, 6], [1, 6]],
  mola: [[10, 7], [12, 8], [10, 5]],
  toplanti: [[7, 5], [6, 7], [8, 7]],
  arsiv: [[12, 5], [12, 6]]
};

let busy = false, halt = false, OWN = false, T = 0;

function bfs(s, t) {
  const q = [s], pr = {}; pr[s] = 1;
  while (q.length) {
    const c = q.shift();
    if (c[0] == t[0] && c[1] == t[1]) break;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c[0] + d[0], y = c[1] + d[1];
      if (x < 0 || y < 0 || x >= N || y >= N || BL[y][x] || pr[[x, y]]) continue;
      pr[[x, y]] = c; q.push([x, y]);
    }
  }
  const p = []; if (!pr[t]) return p;
  let c = t;
  while (!(c[0] == s[0] && c[1] == s[1])) { p.unshift([c[0] + .5, c[1] + .5]); c = pr[c]; }
  return p;
}
function walk(a, x, y) {
  a.path = bfs([Math.floor(a.ax), Math.floor(a.ay)], [x, y]);
  return new Promise(r => { a.res = r; if (!a.path.length) r(); });
}
const door = a => { const r = RM[a.room] || RM[0]; return [r.x, r.top ? 4 : 8]; };
const seat = a => { const r = RM[a.room] || RM[0]; return [r.sx, r.sy]; };
const goHome = a => walk(a, ...seat(a));
const say = (a, i, t) => { a.bi = i; a.bt = t; a.on = 1; };
const hush = a => { a.on = 0; };

function upd(dt) {
  store.staff.forEach(a => {
    a.mv = 0;
    if (a.path.length) {
      const p = a.path[0], dx = p[0] - a.ax, dy = p[1] - a.ay, d = Math.hypot(dx, dy), s = 2.6 * dt;
      a.mv = 1;
      if (d <= s) {
        a.ax = p[0]; a.ay = p[1]; a.path.shift();
        if (!a.path.length && a.res) { const r = a.res; a.res = 0; r(); }
      } else { a.ax += dx / d * s; a.ay += dy / d * s; }
    }
  });
}

// Odaların sabit çalışma masaları
const BASE_OB = [];
RM.forEach(r => {
  BASE_OB.push({
    k: r.dx + r.dy + 1.5,
    f: () => {
      const x = r.dx, y = r.dy, a = store.staff.find(s => s.room === r.i);
      box(x + .06, y + .1, .12, .8, 24, 0, DK);
      box(x + 1.82, y + .1, .12, .8, 24, 0, DK);
      box(x, y, 2, 1, 5, 24, WOOD);
      box(x + .85, y + .22, .3, .25, 4, 29, DK);
      box(x + .55, y + .2, .9, .1, 17, 33, DK, a && a.mon ? '#10b981' : '#3a3358');
      box(x + .6, y + .55, .8, .28, 1.5, 29, WT);
    }
  });
  BASE_OB.push({
    k: r.sx + r.sy + .1,
    f: () => {
      box(r.sx + .2, r.sy + .2, .6, .6, 5, 12, CH);
      box(r.sx + .2, r.sy + .15, .6, .08, 18, 12, CH);
    }
  });
});

// Firestore'dan gelen dinamik eşyaları çizen fonksiyon
function drawCustomItem(item) {
  if (item.hidden) return;
  const x = Number(item.x || 5), y = Number(item.y || 5);
  const h = Number(item.hue ?? 32);
  const col = [h, 65, 58];
  const isSel = store.designMode && store.selectedItemId === item.id;

  // Seçili eşya vurgusu (Tasarım modunda)
  if (isSel) {
    poly([P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)], 'rgba(124,92,239,.45)', '#10b981');
  }

  if (item.type === 'table') {
    box(x, y, 2, 1, 4, 22, col);
    box(x + .1, y + .1, .18, .8, 22, 0, DK);
    box(x + 1.7, y + .1, .18, .8, 22, 0, DK);
    box(x + .5, y + .3, .3, .3, 2, 26, WT);
  } else if (item.type === 'plant') {
    box(x + .25, y + .25, .5, .5, 12, 0, [22, 55, 50]);
    const q = P(x + .5, y + .5, 16);
    [[0, -14, 10], [-8, -8, 8], [8, -8, 8], [0, -23, 7]].forEach(l =>
      disc(q[0] + l[0] + Math.sin(T * 1.5 + x) * 1.5, q[1] + l[1], l[2], hs([h || 140, 55, 45], 6))
    );
  } else if (item.type === 'sofa') {
    box(x, y, 2, 1, 10, 0, col);
    box(x, y + .75, 2, .25, 24, 0, col);
    box(x, y, .25, 1, 16, 0, col);
    box(x + 1.75, y, .25, 1, 16, 0, col);
  } else if (item.type === 'server') {
    box(x + .1, y + .1, .8, .8, 44, 0, DK);
    [12, 24, 36].forEach(z => box(x + .88, y + .2, .06, .6, 3, z, [140, 80, 60]));
  } else if (item.type === 'board') {
    box(x + .1, y + .4, 1.8, .15, 36, 12, WT);
    box(x + .2, y + .4, .1, .1, 12, 0, DK);
    box(x + 1.7, y + .4, .1, .1, 12, 0, DK);
  } else {
    box(x + .2, y + .2, .6, .6, 32, 0, BLU);
    box(x + .25, y + .25, .5, .5, 12, 32, WT);
  }

  // Tasarım modundaysa eşyanın adını üstünde göster
  if (store.designMode) {
    const q = P(x + .5, y + .5, 46);
    cx.font = '700 10px Nunito,sans-serif'; cx.textAlign = 'center';
    const w = cx.measureText(item.name || item.type).width + 10;
    rr(q[0] - w / 2, q[1] - 8, w, 15, 6, isSel ? '#10b981' : 'rgba(0,0,0,.75)');
    cx.fillStyle = '#fff'; cx.fillText(item.name || item.type, q[0], q[1] + 3);
  }
}

function floor() {
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      poly(
        [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)],
        (i + j) % 2 ? '#1a1628' : '#151221',
        store.designMode ? 'rgba(124,92,239,.35)' : null
      );
    }
  }
  RM.forEach(r => poly([P(r.x, r.top ? 0 : 10), P(r.x + r.w, r.top ? 0 : 10), P(r.x + r.w, r.top ? 3 : 14), P(r.x, r.top ? 3 : 14)], 'hsla(' + r.hue + ',45%,22%,.45)'));
  poly([P(0, N), P(N, N), P(N, N, -12), P(0, N, -12)], '#211a33');
  poly([P(N, 0), P(N, N), P(N, N, -12), P(N, 0, -12)], '#1b1428');
}

function walls() {
  poly([P(0, 0), P(0, N), P(0, N, WL), P(0, 0, WL)], '#1e192b');
  poly([P(0, 0), P(N, 0), P(N, 0, WL), P(0, 0, WL)], '#191524');
  poly([P(0, 0), P(0, N), P(0, N, 6), P(0, 0, 6)], '#2a233d');
  poly([P(0, 0), P(N, 0), P(N, 0, 6), P(0, 0, 6)], '#251f35');
}

function over() {
  RM.forEach(r => { const y = r.wy + .4; glass(r.x + 1, y, r.w - 1, .2, 34); glass(r.x, y, .12, .2, 34); });
  [3, 7, 11].forEach(x => { glass(x + .4, 0, .2, 4, 34); glass(x + .4, 9, .2, 5, 34); });
}

function dAg(a) {
  const q = P(a.ax, a.ay, 0), sit = !a.mv && Math.hypot(a.ax - seat(a)[0] - .5, a.ay - seat(a)[1] - .5) < .06,
        b = a.mv ? Math.abs(Math.sin(T * 12 + a.ph)) * 2.5 : 0, x = q[0], y = q[1] + (sit ? -5 : 0) - b;
  el(q[0], q[1] + 1, 11, 5, 'rgba(0,0,0,.4)');
  if (!sit) { cx.fillStyle = '#302845'; cx.fillRect(x - 6, y - 9, 4, 9); cx.fillRect(x + 2, y - 9, 4, 9); }
  rr(x - 8, y - 26, 16, 19, 6, a.c); rr(x - 11, y - 24, 4, 12, 2, a.c); rr(x + 7, y - 24, 4, 12, 2, a.c);
  disc(x, y - 34, 10.5, '#fbcfe8'); cx.fillStyle = a.h; cx.beginPath(); cx.arc(x, y - 35, 11, Math.PI, 0); cx.fill();
  const bl = (T + a.ph) % 4 < .12 ? .5 : 2.4;
  el(x - 4, y - 33, 1.8, bl, '#221a29'); el(x + 4, y - 33, 1.8, bl, '#221a29');
}

// Oda tabelası yok; doğrudan personelin üzerinde İsim ve Unvan yazar
function tag(a) {
  const q = P(a.ax, a.ay, 0); cx.textAlign = 'center';
  const label = `${a.name} · ${a.role}`;
  cx.font = '700 10px Nunito,sans-serif';
  const w = cx.measureText(label).width + 12;
  rr(q[0] - w / 2, q[1] - 66, w, 17, 8, 'rgba(18,14,28,.92)');
  cx.fillStyle = '#f0ecff'; cx.fillText(label, q[0], q[1] - 54);
}

function dBub(a) {
  if (!a.on) return;
  const q = P(a.ax, a.ay, 0), t = a.bt ? a.bt.slice(0, 42) : '';
  cx.font = '700 10.5px Nunito,sans-serif'; cx.textAlign = 'center';
  const w = cx.measureText(t).width + 18, x = Math.max(w / 2 + 4, Math.min(796 - w / 2, q[0])), y = q[1] - 86;
  cx.fillStyle = '#181523'; cx.strokeStyle = '#10b981'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.roundRect(x - w / 2, y - 10, w, 20, 9); cx.fill(); cx.stroke();
  cx.fillStyle = '#10b981'; cx.fillText(t, x, y + 4);
}

function draw() {
  cx.clearRect(0, 0, 800, 530);
  floor(); walls();
  const dynItems = store.items.map(it => ({ k: Number(it.x || 5) + Number(it.y || 5) + 1.2, f: () => drawCustomItem(it) }));
  const agents = store.staff.map(a => ({ k: a.ax + a.ay + .02, f: () => dAg(a) }));
  BASE_OB.concat(dynItems).concat(agents).sort((p, q) => p.k - q.k).forEach(o => o.f());
  over();
  store.staff.forEach(tag);
  store.staff.forEach(dBub);
}
let lt = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lt) / 1000 || 0); lt = ts; T = ts / 1000;
  upd(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const PAL = [
  ['#8b5cf6', '#4c1d95'], ['#ec4899', '#831843'], ['#10b981', '#064e3b'], ['#f59e0b', '#78350f'],
  ['#3b82f6', '#1e3a8a'], ['#6366f1', '#312e81'], ['#14b8a6', '#134e4a'], ['#f43f5e', '#881337']
];
let sid = 0;

function mkAgent(o) {
  const p = PAL[(sid++) % 8], r = RM[o.room] || RM[0];
  const a = {
    id: o.id || ('s' + sid), name: o.name, role: o.role, room: o.room || 0,
    model: o.model || 'Gemini 3.5 Flash Lite', backup: o.backup || 'Gemma 4 31B',
    skills: o.skills || '', used: o.usedToday || 0,
    c: o.color || p[0], h: o.hair || p[1],
    ax: r.sx + .5, ay: r.sy + .5, path: [], mon: 0, act: false,
    bt: '', bi: '', on: 0, st: o.status || 'Görev Bekliyor', ph: Math.random() * 6,
    alive: true, by: o.createdBy || 'owner', saved: true
  };
  store.staff.push(a);
  life(a);
  return a;
}

async function life(a) {
  await sleep(rnd(1200, 4500));
  while (a.alive) {
    if (busy || halt || a.act) { await sleep(900); continue; }
    a.act = true;
    const r = Math.random();
    if (r < .55) {
      a.st = 'Masasında'; a.mon = 1;
      await sleep(rnd(7000, 12000)); a.mon = 0;
    } else if (r < .82) {
      const k = ['yemek', 'mola', 'toplanti'][Math.floor(Math.random() * 3)];
      const sp = SP[k][Math.floor(Math.random() * 3)];
      a.st = k == 'yemek' ? 'Yemekhanede' : k == 'mola' ? 'Kahve Molasında' : 'Toplantı Alanında';
      hush(a); await walk(a, sp[0], sp[1]);
      await sleep(rnd(6000, 10000));
    } else {
      a.st = 'Ortak Klasörde'; hush(a);
      const sp = SP.arsiv[Math.floor(Math.random() * 2)];
      await walk(a, sp[0], sp[1]);
      await sleep(3500);
    }
    hush(a); await goHome(a); a.st = 'Hazır'; a.act = false;
    await sleep(rnd(4000, 8000));
  }
}

function syncStaff(list) {
  const ids = new Set(list.map(x => x.id));
  store.staff.filter(a => !ids.has(a.id)).forEach(a => { a.alive = false; });
  store.staff = store.staff.filter(a => ids.has(a.id));
  list.forEach(x => {
    const room = x.room != null && x.room >= 0 && x.room < RM.length ? x.room : 0;
    let a = store.staff.find(s => s.id === x.id);
    if (!a) a = mkAgent({ ...x, room });
    else {
      const rc = a.room !== room;
      Object.assign(a, {
        name: x.name, role: x.role, model: x.model || a.model,
        backup: x.backup || a.backup, skills: x.skills || '',
        used: x.usedToday || a.used, room
      });
      if (rc) { a.act = true; goHome(a).then(() => a.act = false); }
    }
  });
  updateTargetSelect();
}

function updateTargetSelect() {
  const sel = $('#targetAgent');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = store.staff.map(a => `<option value="${esc(a.id)}">${esc(a.name)} · ${esc(a.role)}</option>`).join('');
  if (cur && store.staff.some(a => a.id === cur)) sel.value = cur;
}

function lg(t) {

   6. GERÇEK GEMINI MOTORU (TAKILMA ÖNLEYİCİ & 429/404 KORUMALI)

let nextAllowedCallTime = 0;

async function incrementModelQuota(poolObj, agent) {
  if (poolObj) poolObj.u++;
  agent.used = (agent.used || 0) + 1;
  if (CONN && OWN) {
    const dayRef = db.collection('usage').doc(todayKey());
    const poolsUpdate = {};
    MODELS.forEach(m => { poolsUpdate[m.n] = m.u; });
    await dayRef.set({ updatedAt: FV().serverTimestamp(), pools: poolsUpdate }, { merge: true }).catch(() => {});
    await db.collection('staff').doc(agent.id).set({ usedToday: agent.used, lastActionAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
  }
}

async function callGeminiAgent(agent, incomingMail, threadMails, relatedFiles) {
  const apiKey = store.geminiKey;
  if (!apiKey) throw new Error('Firestore settings/secret belgesinde apiKey bulunamadı!');

  const { pool, apiName } = resolveWorkingApiModel(agent);

  const companyDirectory = store.staff.map(s =>
    `- ID: "${s.id}" | İsim: ${s.name} (${s.role}) | Uzmanlık: ${s.skills || ''}`
  ).join('\n');

  const historyText = threadMails.slice(-4).map(m =>
    `[${m.f} -> ${m.t} (${m.type})]: ${m.subj}\n${m.body}`
  ).join('\n---\n');

  const filesOverview = relatedFiles.slice(0, 4).map(f =>
    `Dosya: ${f.path} (Yazan: ${f.owner})\nİçerik:\n${(f.content || '').slice(0, 2800)}`
  ).join('\n===\n') || 'Ortak klasör boş.';

  const systemInstruction = `Sen "Tonoz AI Ofisi" şirketinde çalışan "${agent.name}", unvanın "${agent.role}".
Uzmanlığın: ${agent.skills || ''}

KURALLAR:
1. Resmi, kurumsal İstanbul Türkçesi (Bey/Hanım) kullan.
2. Görev atarken SADECE aşağıdaki personel listesindeki ID'leri ("toAgentId") kullan:
${companyDirectory}
- Şirket Sahibi ID: "owner" (Burak Bey). Sadece son sunum/onay aşamasında "owner"a rapor gönder.
3. İşini hemen yap, dosya üretiyorsan "fileToSave" içine tam içeriği yaz ve bir sonraki departmana ilet.
4. SADECE geçerli bir JSON döndür:
{
  "canvasBubble": "Kısa durum (Örn: Kodları yazıyor)",
  "fileToSave": {
    "path": "Dosya adı (Örn: makale.md veya script.js) - yoksa ''",
    "kind": "md | code | svg | json",
    "content": "Dosya içeriği"
  },
  "outgoingMails": [
    {
      "toAgentId": "Alıcı ID",
      "subject": "Mesaj konusu",
      "body": "Kurumsal talimat veya rapor",
      "type": "görev | rapor | onay"
    }
  ],
  "submitFinalApproval": {
    "ready": false,
    "summary": "Tüm süreç bittiyse Burak Bey için özet"
  }
}`;

  const userPrompt = `GELEN GÖREV / MESAJ:
Gönderen: ${incomingMail.f}
Konu: ${incomingMail.subj}
İçerik: ${incomingMail.body}

ÖNCEKİ YAZIŞMALAR:
${historyText}

ORTAK KLASÖR:
${filesOverview}`;

  const isGemma = apiName.startsWith('gemma');
  const bodyPayload = isGemma ? {
    contents: [{ role: 'user', parts: [{ text: systemInstruction + '\n\n' + userPrompt }] }],
    generationConfig: { temperature: 0.4 }
  } : {
    systemInstruction: { parts: [{ text: systemInstruction }] },
    contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
    generationConfig: { temperature: 0.4, responseMimeType: 'application/json' }
  };

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${apiName}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(bodyPayload)
  });

  if (res.status === 429) {
    // Bu model RPM/Kota sınırına takıldı -> 3 dakika dinlendir
    store.cooldownUntilByModel[apiName] = Date.now() + 180000;
    throw new Error(`Model (${apiName}) dakika/günlük kota sınırına ulaştı (429). Yedek modele geçiliyor ve görev 90 sn ertelendi.`);
  }

  if (res.status === 404) {
    // Bu model hesaba kapalı -> listeden çıkar
    store.availableApiModels = store.availableApiModels.filter(m => m !== apiName);
    throw new Error(`Model (${apiName}) bu API anahtarında desteklenmiyor (404). Otomatik devre dışı bırakıldı.`);
  }

  if (!res.ok) {
    const errTxt = await res.text();
    throw new Error(`API Hatası (${res.status}): ${errTxt.slice(0, 180)}`);
  }

  await incrementModelQuota(pool, agent);
  const data = await res.json();
  let rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  rawText = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
  return JSON.parse(rawText);
}

async function processNextPendingMail(forceNow = false) {
  if (busy || halt || !store.geminiKey) return;

  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) return;

  const agent = store.staff.find(s => s.id === pending.toId || s.name === pending.t);
  if (!agent) {
    lg(`⚠️ Alıcı ajan bulunamadı (${pending.t}), mesaj kapatıldı.`);
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  updateEngineBadges(`Çalışıyor: ${agent.name}`);

  try {
    agent.act = true;
    await goHome(agent);
    agent.mon = 1;
    agent.st = 'Çalışıyor';
    say(agent, 'think', 'Görev üzerinde çalışıyor...');
    render();

    const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
    const decision = await callGeminiAgent(agent, pending, threadMails, store.files);

    if (decision.canvasBubble) say(agent, 'type', decision.canvasBubble);

    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      const sp = SP.arsiv[0];
      agent.st = 'Ortak Klasöre dosya yüklüyor';
      await walk(agent, sp[0], sp[1]);
      say(agent, 'doc', decision.fileToSave.path + ' yüklendi');
      await saveSharedFile(decision.fileToSave.path, decision.fileToSave.content, decision.fileToSave.kind || 'md', `${agent.name} · ${agent.role}`);
      lg(`📁 ${agent.name} ortak klasöre dosya kaydetti: ${decision.fileToSave.path}`);
      await sleep(1400);
    }

    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = out.toAgentId === 'owner'
        ? { id: 'owner', name: 'Sen (Burak Bey)', role: 'Şirket Sahibi' }
        : (store.staff.find(s => s.id === out.toAgentId || s.name === out.toAgentId) || null);

      if (!target) continue;

      if (target.id !== 'owner') {
        const d = door(target);
        agent.st = target.name + ' ile görüşüyor';
        await walk(agent, d[0], d[1]);
        say(agent, 'mail', target.name + ' odasında');
      } else {
        say(agent, 'doc', 'Yöneticiye sunuyor');
      }

      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id, fromName: `${agent.name} · ${agent.role}`,
        toId: target.id, toName: `${target.name}${target.role ? ' · ' + target.role : ''}`,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });
      lg(`✉️ ${agent.name} → ${target.name}: ${out.subject}`);
      await sleep(1400);
    }

    if (decision.submitFinalApproval && decision.submitFinalApproval.ready) {
      showApprovalBox(pending.subj, decision.submitFinalApproval.summary || 'Çalışma tamamlandı.');
    }

    await markMailProcessed(pending.id);
    agent.mon = 0; hush(agent);
    await goHome(agent);
    agent.st = 'Hazır';
    agent.act = false;

    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    const fails = (store.failCountByMail[pending.id] || 0) + 1;
    store.failCountByMail[pending.id] = fails;

    lg(`⚠️ ${agent.name} (${fails}/3 deneme): ${err.message}`);

    if (fails >= 3) {
      lg(`🛑 "${pending.subj}" görevi 3 kez hata aldığı için kuyruğu tıkamaması adına kapatıldı.`);
      await markMailProcessed(pending.id);
    } else {
      // Hata alan maili Firestore'da 90 saniye ileri ertele ki anında tekrar çarpıp kotayı bitirmesin
      await postponeMail(pending.id, Date.now() + 90000);
    }

    agent.mon = 0; agent.act = false; hush(agent);
    nextAllowedCallTime = Date.now() + 25000;
  } finally {
    busy = false;
    render();
  }
}

let db = null, auth = null, CONN = false, vt = 0, un = [];
const FV = () => firebase.firestore.FieldValue;

const nm = id => {
  if (id === 'owner') return 'Sen (Burak Bey)';
  const s = store.staff.find(x => x.id === id || x.name === id);
  return s ? `${s.name} · ${s.role}` : id;
};
const tm = t => t && t.toDate ? t.toDate().toTimeString().slice(0, 5) : hhmm();

async function createInternalMail({ fromId, fromName, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const tid = db.collection('tasks').doc().id;
    if (toId !== 'owner') {
      await db.collection('tasks').doc(tid).set({
        title: subject, description: body.slice(0, 1500),
        owner: toId, createdBy: fromId, status: 'bekliyor',
        priority: 1, createdAt: ts, updatedAt: ts
      }).catch(() => {});
    }
    await db.collection('mails').add({
      from: fromId, to: toId, subject, body, type: type || 'görev',
      taskId: tid, threadId: threadId || ('th_' + Date.now()),
      processed: toId === 'owner',
      notBefore: firebase.firestore.Timestamp.fromMillis(notBeforeMs || Date.now()),
      createdAt: ts
    });
  }
}

async function postponeMail(mailId, newTimeMs) {
  const m = store.mails.find(x => x.id === mailId);
  if (m) m.notBeforeMs = newTimeMs;
  if (CONN && OWN && !String(mailId).startsWith('m_')) {
    await db.collection('mails').doc(mailId).update({
      notBefore: firebase.firestore.Timestamp.fromMillis(newTimeMs)
    }).catch(() => {});
  }
}

async function markMailProcessed(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  if (m) m.processed = true;
  if (CONN && OWN && !String(mailId).startsWith('m_')) {
    await db.collection('mails').doc(mailId).update({
      processed: true, readAt: FV().serverTimestamp()
    }).catch(() => {});
  }
}

async function saveSharedFile(path, content, kind, ownerName) {
  const existing = store.files.find(f => f.path === path);
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const docId = existing ? existing.id : db.collection('files').doc().id;
    const ver = existing ? (existing.version || 1) + 1 : 1;
    await db.collection('files').doc(docId).set({
      path, content, owner: ownerName, kind: kind || 'md',
      version: ver, createdAt: ts, updatedAt: ts
    }, { merge: true });
  }
}

function downloadFile(fileId) {
  const f = store.files.find(x => x.id === fileId);
  if (!f) return;
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.path;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function resetProject() {
  if (!confirm('Tüm yazışmalar, görevler ve ortak dosyalar silinecek (Personeller ve ofis eşyaları korunur). Emin misiniz?')) return;
  if (CONN && OWN) {
    const batch = db.batch();
    const mSnap = await db.collection('mails').get();
    mSnap.forEach(d => batch.delete(d.ref));
    const tSnap = await db.collection('tasks').get();
    tSnap.forEach(d => batch.delete(d.ref));
    const fSnap = await db.collection('files').get();
    fSnap.forEach(d => batch.delete(d.ref));
    await batch.commit();
    store.failCountByMail = {};
    lg('🗑️ Proje sıfırlandı: Tüm mesajlar ve dosyalar temizlendi.');
  }
}

  const room = +$('#modalRoom').value;

  store.staff = store.staff.filter(s => s !== a);

  clearInterval(vt); stopOwnerListeners();

  try {
    const secretDoc = await db.doc('settings/secret').get();
    if (secretDoc.exists && secretDoc.data().apiKey) {
      store.geminiKey = secretDoc.data().apiKey;
      await discoverWorkingModels();
    }
  } catch (e) {}

  // Eşyaları Firestore public/office belgesinden canlı dinle
  un.push(db.doc('public/office').onSnapshot(d => {
    if (d.exists && Array.isArray(d.data().items)) {
      store.items = d.data().items.map((it, idx) =>
        typeof it === 'string'
          ? { id: 'it_' + idx, type: 'table', name: it, x: 9, y: 4, hue: 32, hidden: false }
          : it
      );
      renderDesignSidebar();
    }
  }));

  un.push(db.collection('staff').onSnapshot(q => {
    syncStaff(q.docs.map(d => ({ id: d.id, ...d.data() })));
    render();
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id, fromId: m.from, toId: m.to,
        f: nm(m.from), t: nm(m.to),
        subj: m.subject, body: m.body, type: m.type || 'görev',
        threadId: m.threadId || d.id, processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    render();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(50).onSnapshot(q => {
    store.files = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.updatedAt) }));
    render();
  }));

  un.push(db.collection('usage').doc(todayKey()).onSnapshot(d => {
    if (d.exists && d.data().pools) {
      const p = d.data().pools;
      MODELS.forEach(m => { if (p[m.n] != null) m.u = p[m.n]; });
      render();
    }
  }));
}

async function pollPublic() {
  try {
    const d = await db.doc('public/office').get(), o = d.exists ? d.data() : {};
    if (o.staff && o.staff.length) syncStaff(o.staff);
    if (Array.isArray(o.items)) {
      store.items = o.items.map((it, idx) => typeof it === 'string' ? { id: 'it_' + idx, type: 'table', name: it, x: 9, y: 4 } : it);
    }
  } catch (e) {}
}

function setOwner(b) {
  OWN = b;
  $('#panel').classList.toggle('on', b);
  $('#bl').textContent = b ? 'Çıkış Yap' : 'Yönetici Girişi';
  $('#bl').className = b ? '' : 'p';
  updateEngineBadges();
  render();
}

$('#bl').onclick = () => {
  if (CONN && !OWN) return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('Giriş hatası: ' + e.message));
  if (CONN && OWN) return auth.signOut();
};

$('#go').onclick = async () => {
  const txt = $('#ti').value.trim();
  if (!txt) return alert('Lütfen görev konusunu yazın.');
  const targetId = $('#targetAgent').value;
  const target = store.staff.find(s => s.id === targetId) || store.staff[0];
  if (!target) return alert('Firestore\'da personel bulunamadı.');

  $('#ti').value = '';
  const subj = txt.length > 52 ? txt.slice(0, 52) + '...' : txt;
  await createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: `${target.name} · ${target.role}`,
    subject: subj, body: txt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  lg(`Sen → ${target.name}: ${subj}`);
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => processNextPendingMail(true);
$('#unstickBtn').onclick = unstickAllTasks;
$('#resetProj').onclick = resetProject;

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? 'Devam Et' : 'Acil Durdur';
  updateEngineBadges();
};

async function fbLoad() {
  for (const u of ['app', 'auth', 'firestore']) {
    await new Promise((r, j) => {
      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
      s.onload = r; s.onerror = j; document.head.appendChild(s);
    });
  }
  firebase.initializeApp(FB);
  db = firebase.firestore(); auth = firebase.auth(); CONN = true;
  auth.onAuthStateChanged(async u => {
    if (!u) { setOwner(false); pollPublic(); vt = setInterval(pollPublic, 30000); return; }
    try {
      await db.doc('settings/guard').get();
      setOwner(true); startOwnerListeners();
    } catch (e) {
      setOwner(false); await auth.signOut();
      alert('Yönetici yetkisi doğrulanamadı.');
    }
  });
}
fbLoad();
</script>
