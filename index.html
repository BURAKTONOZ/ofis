<script>
/* ============================================================================

const FB = {

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const todayKey = () => new Date().toISOString().slice(0, 10);

/*

*/
const MODELS = [
  {
    n: 'Gemini 3.5 Flash Lite',
    chain: ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3.8-flash'],
    rpm: 15, l: 500, u: 0,

  },
  {

  },

];

const store = {
  staff: [],
  mails: [],
  files: [],
  items: [],
  log: [],
  availableApiModels: [],
  blockedModelsUntil: {},
  failCountByMail: {},
  leftMode: 'staff', // 'staff' | 'design'

  selectedMailId: null,

  cooldownSec: 25 // Lite modellerde 15 RPM hakkı olduğu için 25 sn mola çok akıcı ve güvenlidir
};

let db = null, auth = null, CONN = false, OWN = false, busy = false, halt = false, un = [];
const FV = () => firebase.firestore.FieldValue;

function lg(msg) {
  store.log.unshift(`${hhmm()} · ${msg}`);
  if (store.log.length > 80) store.log.length = 80;
  if (store.rightTab === 'quota') renderRight();

/* ============================================================================
   2. YENİ NESİL FERAH 2.5D İZOMETRİK OFİS MİMARİSİ (CANVAS)
   ============================================================================ */
const cv = $('#cv'), cx = cv.getContext('2d');
const N = 16; // 16x16 geniş ve ferah ofis alanı
const TW = 36, TH = 18, OX = 700, OY = 135;
const P = (x, y, z = 0) => [OX + (x - y) * TW, OY + (x + y) * TH - z];
let T = 0;

function screenToGrid(sx, sy) {
  const dx = (sx - OX) / TW;
  const dy = (sy - OY) / TH;
  const gx = Math.floor((dx + dy) / 2);
  const gy = Math.floor((dy - dx) / 2);
  return [Math.max(0, Math.min(N - 1, gx)), Math.max(0, Math.min(N - 1, gy))];
}

// 8 Ferah Çalışma İstasyonu (Üstte 4, Altta 4 VIP Oda/Bölme)
const STATIONS = [
  { i: 0, x: 1,  y: 1,  sx: 2,  sy: 2,  door: [2, 4],  color: '#6366f1', title: 'İstasyon 1' },
  { i: 1, x: 5,  y: 1,  sx: 6,  sy: 2,  door: [6, 4],  color: '#ec4899', title: 'İstasyon 2' },
  { i: 2, x: 9,  y: 1,  sx: 10, sy: 2,  door: [10, 4], color: '#06b6d4', title: 'İstasyon 3' },
  { i: 3, x: 13, y: 1,  sx: 14, sy: 2,  door: [14, 4], color: '#10b981', title: 'İstasyon 4' },
  { i: 4, x: 1,  y: 12, sx: 2,  sy: 13, door: [2, 11], color: '#f59e0b', title: 'İstasyon 5' },
  { i: 5, x: 5,  y: 12, sx: 6,  sy: 13, door: [6, 11], color: '#8b5cf6', title: 'İstasyon 6' },
  { i: 6, x: 9,  y: 12, sx: 10, sy: 13, door: [10, 11],color: '#3b82f6', title: 'İstasyon 7' },
  { i: 7, x: 13, y: 12, sx: 14, sy: 13, door: [14, 11],color: '#f43f5e', title: 'İstasyon 8' }
];

const ZONES = {
  toplanti: [[7, 7], [8, 7], [7, 8]],
  mola: [[2, 7], [3, 7], [2, 8]],
  arsiv: [[13, 7], [13, 8]]
};

function poly(pts, fill, stroke, lw = 1) {
  cx.beginPath();
  pts.forEach((p, idx) => idx ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]));
  cx.closePath();
  if (fill) { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = lw; cx.stroke(); }
}

function isoBox(x, y, w, d, h, z, topCol, leftCol, rightCol) {
  const t = z + h;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], leftCol);
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], rightCol);
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], topCol);
}

function drawFloorAndWalls() {
  // Ana zemin
  poly([P(0, 0), P(N, 0), P(N, N), P(0, N)], '#131824', '#26304a', 2);
  // Platform kalınlığı
  poly([P(0, N), P(N, N), P(N, N, -14), P(0, N, -14)], '#0d111a');
  poly([P(N, 0), P(N, N), P(N, N, -14), P(N, 0, -14)], '#090c12');

  // Kare ızgara
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const isCorridor = j >= 5 && j <= 10;
      const tileFill = (i + j) % 2 === 0
        ? (isCorridor ? '#161d2b' : '#131926')
        : (isCorridor ? '#182030' : '#151b29');
      poly(
        [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)],
        tileFill,
        store.leftMode === 'design' ? 'rgba(99,102,241,0.28)' : 'rgba(255,255,255,0.02)'
      );
    }
  }

  // Arka duvarlar
  poly([P(0, 0), P(0, N), P(0, N, 75), P(0, 0, 75)], '#171e2e', '#26314a');
  poly([P(0, 0), P(N, 0), P(N, 0, 75), P(0, 0, 75)], '#1b2336', '#26314a');

  // Ortak alan halıları (Kahve Lounge, Merkez Toplantı, Ortak Klasör Sunucu Alanı)
  poly([P(1.5, 6.2), P(4.2, 6.2), P(4.2, 9.2), P(1.5, 9.2)], 'rgba(245,158,11,0.12)', 'rgba(245,158,11,0.35)');
  poly([P(6.0, 6.0), P(10.0, 6.0), P(10.0, 9.5), P(6.0, 9.5)], 'rgba(99,102,241,0.12)', 'rgba(99,102,241,0.35)');
  poly([P(12.2, 6.2), P(14.8, 6.2), P(14.8, 9.2), P(12.2, 9.2)], 'rgba(16,185,129,0.12)', 'rgba(16,185,129,0.35)');

  // İstasyon zemin halıları
  STATIONS.forEach(st => {
    poly([P(st.x, st.y), P(st.x + 2.4, st.y), P(st.x + 2.4, st.y + 2.4), P(st.x, st.y + 2.4)], st.color + '1c', st.color + '66');
  });
}

function drawAgentCharacter(a) {
  const q = P(a.ax, a.ay, 0);
  const bounce = a.mv ? Math.abs(Math.sin(T * 10 + a.ph)) * 3 : 0;
  const x = q[0], y = q[1] - bounce;

  // Gölge
  cx.beginPath(); cx.ellipse(q[0], q[1] + 2, 12, 6, 0, 0, 7);
  cx.fillStyle = 'rgba(0,0,0,0.45)'; cx.fill();

  // Gövde
  cx.beginPath(); cx.roundRect(x - 9, y - 28, 18, 22, 7);
  cx.fillStyle = a.c || '#6366f1'; cx.fill();
  cx.strokeStyle = '#ffffff33'; cx.lineWidth = 1; cx.stroke();

  // Baş
  cx.beginPath(); cx.arc(x, y - 37, 10.5, 0, 7);
  cx.fillStyle = '#fde68a'; cx.fill();

  // Saç
  cx.beginPath(); cx.arc(x, y - 39, 11, Math.PI, 0);
  cx.fillStyle = '#1e293b'; cx.fill();

  // Gözler
  cx.fillStyle = '#0f172a';
  cx.fillRect(x - 4, y - 37, 2.2, 2.8);
  cx.fillRect(x + 2, y - 37, 2.2, 2.8);
}

function drawAgentLabelAndBubble(a) {

function drawZoneSigns() {

  ];

  signs.forEach(([txt, gx, gy, col]) => {
    const q = P(gx, gy, 42);

function updateAgentsMovement(dt) {
  store.staff.forEach(a => {
    a.mv = 0;
    if (a.path && a.path.length) {
      const p = a.path[0], dx = p[0] - a.ax, dy = p[1] - a.ay, d = Math.hypot(dx, dy), s = 2.8 * dt;
      a.mv = 1;
      if (d <= s) {
        a.ax = p[0]; a.ay = p[1]; a.path.shift();
        if (!a.path.length && a.res) { const r = a.res; a.res = null; r(); }
      } else {
        a.ax += (dx / d) * s; a.ay += (dy / d) * s;
      }
    }
  });
}

let lastTs = 0;
function renderCanvasLoop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts; T = ts / 1000;
  updateAgentsMovement(dt);

  cx.clearRect(0, 0, 1400, 920);
  drawFloorAndWalls();

  const renderQueue = [];
  STATIONS.forEach(st => renderQueue.push({ k: st.x + st.y + 1.5, f: () => drawStationDesk(st) }));
  store.items.forEach(it => renderQueue.push({ k: Number(it.x || 7) + Number(it.y || 7) + 1.2, f: () => drawCustomObject(it) }));
  store.staff.forEach(a => renderQueue.push({ k: a.ax + a.ay + 0.1, f: () => drawAgentCharacter(a) }));

  renderQueue.sort((p, q) => p.k - q.k).forEach(o => o.f());
  drawZoneSigns();
  store.staff.forEach(drawAgentLabelAndBubble);

  requestAnimationFrame(renderCanvasLoop);
}
requestAnimationFrame(renderCanvasLoop);

function moveAgentTo(a, tx, ty) {
  a.path = [[tx, ty]];
  return new Promise(r => { a.res = r; });
}
const getStation = a => STATIONS[Number(a.room) % STATIONS.length] || STATIONS[0];
const goHomeDesk = a => { const st = getStation(a); return moveAgentTo(a, st.sx, st.sy); };
const sayBubble = (a, txt) => { a.bt = txt; a.on = 1; };
const clearBubble = a => { a.on = 0; };

/* ============================================================================
   3. KUSURSUZ GEMINI API ÇAĞRISI (OTOMATİK MODEL ZİNCİRİ - FAILOVER)
   ============================================================================ */
let nextAllowedCallTime = 0;

async function callGeminiWithFailover(agent, incomingMail, threadMails, relatedFiles) {
  const apiKey = store.geminiKey;
  if (!apiKey) throw new Error('Firestore settings/secret içinde apiKey bulunamadı!');

  // Ajanın birincil ve yedek modeline göre denenecek gerçek API modellerinin zincirini kur
  const primaryPool = MODELS.find(m => m.n === agent.model) || MODELS[0];
  const backupPool = MODELS.find(m => m.n === agent.backup) || MODELS[1];
  const tryChain = [...new Set([
    ...primaryPool.chain,
    ...backupPool.chain,
    'gemini-3.5-flash-lite',
    'gemini-3.1-flash-lite',
    'gemini-3.8-flash'
  ])];

  const companyDirectory = store.staff.map(s =>
    `- ID: "${s.id}" | İsim: ${s.name} (${s.role}) | Uzmanlık: ${s.skills || ''}`
  ).join('\n');

  const historyText = threadMails.slice(-4).map(m =>
    `[${m.f} -> ${m.t}]: ${m.subj}\n${m.body}`
  ).join('\n---\n');

  const filesOverview = relatedFiles.slice(0, 4).map(f =>
    `Dosya: ${f.path} (Yazan: ${f.owner})\nİçerik:\n${(f.content || '').slice(0, 2600)}`
  ).join('\n===\n') || 'Ortak klasör boş.';

  const systemInstruction = `Sen "Tonoz AI Ofisi" şirketinde çalışan "${agent.name}", unvanın "${agent.role}".
Uzmanlığın: ${agent.skills || ''}

KURALLAR:
1. Resmi, kurumsal İstanbul Türkçesi (Bey/Hanım) kullan.
2. Görev atarken SADECE aşağıdaki personel listesindeki ID'leri ("toAgentId") kullan:
${companyDirectory}
- Şirket Sahibi ID: "owner" (Burak Bey). Sadece son sunum/onay aşamasında "owner"a rapor gönder.
3. İşini hemen yap, dosya üretiyorsan "fileToSave" içine tam içeriği yaz ve bir sonraki departmana ilet.
4. SADECE geçerli bir JSON döndür:
{
  "canvasBubble": "Kısa durum (Örn: Makaleyi yazıyor)",
  "fileToSave": {
    "path": "Dosya adı (Örn: makale.md veya kod.js) - yoksa ''",
    "kind": "md | code | svg | json",
    "content": "Dosya içeriği"
  },
  "outgoingMails": [
    {
      "toAgentId": "Alıcı ID",
      "subject": "Mesaj konusu",
      "body": "Kurumsal talimat veya rapor",
      "type": "görev | rapor | onay"
    }
  ],
  "submitFinalApproval": {
    "ready": false,
    "summary": "Tüm süreç bittiyse Burak Bey için özet"
  }
}`;

  const userPrompt = `GELEN GÖREV / MESAJ:\nGönderen: ${incomingMail.f}\nKonu: ${incomingMail.subj}\nİçerik: ${incomingMail.body}\n\nÖNCEKİ YAZIŞMALAR:\n${historyText}\n\nORTAK KLASÖR:\n${filesOverview}`;

  let lastError = null;
  const now = Date.now();

  // Zincirdeki modelleri sırayla dene: Biri 429 veya 503 verirse ANINDA diğerine geç!
  for (const apiModel of tryChain) {
    if ((store.blockedModelsUntil[apiModel] || 0) > now) continue;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${apiModel}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemInstruction }] },
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          generationConfig: { temperature: 0.4, responseMimeType: 'application/json' }
        })
      });

      if (res.status === 429 || res.status === 503 || res.status === 404) {
        // Bu modeli 2 dakika dinlendir ve HİÇ BEKLEMEDEN sıradaki modele geç!
        store.blockedModelsUntil[apiModel] = Date.now() + 120000;
        lg(`🔄 ${apiModel} yoğun/dolu (${res.status}), anında yedek modele geçiliyor...`);
        lastError = new Error(`${apiModel} (${res.status})`);
        continue;
      }

      if (!res.ok) {
        const errTxt = await res.text();
        lastError = new Error(`HTTP ${res.status}: ${errTxt.slice(0, 120)}`);
        continue;
      }

      const data = await res.json();
      let rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      rawText = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
      const parsed = JSON.parse(rawText);

      // Başarılı olan modelin sayacını artır
      primaryPool.u++;
      agent.used = (agent.used || 0) + 1;
      if (CONN && OWN) {
        const poolsObj = {};
        MODELS.forEach(m => { poolsObj[m.n] = m.u; });
        db.collection('usage').doc(todayKey()).set({ updatedAt: FV().serverTimestamp(), pools: poolsObj }, { merge: true }).catch(() => {});
        db.collection('staff').doc(agent.id).set({ usedToday: agent.used, lastActionAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
      }

      return parsed;
    } catch (e) {
      lastError = e;
    }
  }

  throw lastError || new Error('Tüm modeller denendi ancak yanıt alınamadı.');
}

async function processNextPendingMail(forceNow = false) {
  if (busy || halt || !store.geminiKey) return;
  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) return;

  const agent = store.staff.find(s => s.id === pending.toId || s.name === pending.t);
  if (!agent) {
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  $('#engBadge').className = 'badge ok';
  $('#engBadge').textContent = `⚡ Çalışıyor: ${agent.name}`;

  try {
    agent.act = true;
    await goHomeDesk(agent);
    agent.mon = 1;
    agent.st = 'Çalışıyor';
    sayBubble(agent, 'Görevi işliyor...');
    renderLeft();

    const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
    const decision = await callGeminiWithFailover(agent, pending, threadMails, store.files);

    if (decision.canvasBubble) sayBubble(agent, decision.canvasBubble);

    // Dosya üretildiyse Ortak Klasör alanına yürüsün ve kaydetsin
    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      agent.st = 'Ortak Klasöre yüklüyor';
      await moveAgentTo(agent, ZONES.arsiv[0][0], ZONES.arsiv[0][1]);
      sayBubble(agent, `📄 ${decision.fileToSave.path}`);
      await saveSharedFile(decision.fileToSave.path, decision.fileToSave.content, decision.fileToSave.kind || 'md', `${agent.name} · ${agent.role}`);
      lg(`📁 ${agent.name} ortak klasöre dosya bıraktı: ${decision.fileToSave.path}`);
      await sleep(1200);
    }

    // Giden mesajları sırayla ilgili ajanlara teslim et
    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = out.toAgentId === 'owner'
        ? { id: 'owner', name: 'Sen (Burak Bey)', role: 'Şirket Sahibi' }
        : (store.staff.find(s => s.id === out.toAgentId || s.name === out.toAgentId) || null);

      if (!target) continue;

      if (target.id !== 'owner') {
        const st = getStation(target);
        agent.st = `${target.name} ile görüşüyor`;
        await moveAgentTo(agent, st.door[0], st.door[1]);
        sayBubble(agent, `✉️ → ${target.name}`);
      }

      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id, fromName: `${agent.name} · ${agent.role}`,
        toId: target.id, toName: `${target.name}${target.role ? ' · ' + target.role : ''}`,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });

      lg(`✉️ ${agent.name} → ${target.name}: ${out.subject}`);
      await sleep(1200);
    }

    await markMailProcessed(pending.id);
    agent.mon = 0; clearBubble(agent);
    await goHomeDesk(agent);
    agent.st = 'Hazır';
    agent.act = false;

    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    lg(`⚠️ Hata (${agent.name}): ${err.message}`);
    const fails = (store.failCountByMail[pending.id] || 0) + 1;
    store.failCountByMail[pending.id] = fails;
    if (fails >= 3) await markMailProcessed(pending.id);
    agent.mon = 0; agent.act = false; clearBubble(agent);
    nextAllowedCallTime = Date.now() + 15000;
  } finally {
    busy = false;
    $('#engBadge').textContent = halt ? '⏸ Duraklatıldı' : '🟢 Komuta Merkezi Aktif';
    renderLeft();
    renderRight();
  }
}

setInterval(() => {
  const coolEl = $('#coolBadge');
  const rem = Math.ceil((nextAllowedCallTime - Date.now()) / 1000);
  if (rem > 0 && !busy) {
    coolEl.style.display = 'inline-block';
    coolEl.textContent = `☕ Kota Koruması (${rem} sn)`;
  } else {
    coolEl.style.display = 'none';

  if (!busy && !halt && OWN) processNextPendingMail(false);
}, 2500);

    if (sel) store.selectedMailId = sel.id;

    box.innerHTML = `
      ${sel ? `
        <div style="background:#0d111a;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px">
          <div class="row" style="justify-content:space-between;margin-top:0">
            <b>${esc(sel.subj)}</b>
            <span class="badge ${sel.processed ? 'ok' : 'warn'}">${sel.processed ? '✓ İşlendi' : '⏳ Kuyrukta'}</span>
          </div>
          <div class="note" style="margin:4px 0 8px"><b>${esc(sel.f)}</b> → <b>${esc(sel.t)}</b> · ${esc(sel.time)}</div>
          <div style="white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:210px;overflow-y:auto;padding:8px;background:var(--panel);border-radius:8px">${esc(sel.body)}</div>
          ${OWN ? `
            <div class="row" style="margin-top:8px">
              <input id="replyInput" style="flex:1" placeholder="Bu yazışmaya talimat ekle...">
              <button class="p" onclick="sendReply('${sel.id}')">Gönder</button>
              ${!sel.processed ? `<button class="ok" onclick="forceRunMail('${sel.id}')">⚡ İşlet</button>` : ''}
            </div>
          ` : ''}
        </div>
      ` : ''}
      <div class="note" style="margin-bottom:6px;font-weight:700">TÜM KURUM İÇİ YAZIŞMALAR</div>
      ${store.mails.map(m => `
        <div class="mail-card ${m.id === store.selectedMailId ? 'active' : ''} ${m.processed ? 'done' : 'pending'}" onclick="store.selectedMailId='${m.id}';renderRight()">
          <div class="row" style="justify-content:space-between;margin:0;font-size:11.5px">
            <b>${esc(m.f)} → ${esc(m.t)}</b>
            <span class="note">${esc(m.time)}</span>
          </div>
          <div style="font-weight:600;margin-top:3px">${esc(m.subj)}</div>
        </div>
      `).join('') || '<p class="note">Henüz yazışma yok. Üst bardan bir departmana görev verin.</p>'}
    `;
  }
  else if (store.rightTab === 'files') {
    const sf = store.files.find(f => f.id === store.selectedFileId) || store.files[0];
    if (sf) store.selectedFileId = sf.id;

    box.innerHTML = `
      ${sf ? `
        <div style="margin-bottom:12px">
          <div class="row" style="justify-content:space-between;margin-top:0">
            <div>
              <b>📄 ${esc(sf.path)}</b>
              <div class="note">Üreten: ${esc(sf.owner)} · v${sf.version || 1}</div>
            </div>
            <div class="row" style="margin:0">
              <button class="p" onclick="downloadSharedFile('${sf.id}')">📥 İndir</button>
              <button onclick="navigator.clipboard.writeText(store.files.find(x=>x.id==='${sf.id}').content);alert('Kopyalandı!')">Kopyala</button>
            </div>
          </div>
          <pre class="code">${esc(sf.content)}</pre>
        </div>
      ` : ''}
      <div class="note" style="margin-bottom:6px;font-weight:700">ORTAK KLASÖR DOSYALARI</div>
      ${store.files.map(f => `
        <div class="mail-card ${f.id === store.selectedFileId ? 'active' : ''}" onclick="store.selectedFileId='${f.id}';renderRight()">
          <b>📄 ${esc(f.path)}</b>
          <div class="note">${esc(f.owner)} · v${f.version || 1}</div>
        </div>
      `).join('') || '<p class="note">Ortak klasörde henüz üretilmiş dosya yok.</p>'}
    `;
  }
  else {
    box.innerHTML = `
      <div class="note" style="margin-bottom:8px;font-weight:700">AKTİF MODEL HAVUZLARI VE GÜNLÜK LİMİTLER</div>
      ${MODELS.map(m => {
        const pct = Math.min(100, (m.u / m.l) * 100);
        return `
          <div class="quota-row">
            <div class="row" style="justify-content:space-between;margin:0">
              <b>${esc(m.n)}</b>
              <span><b>${m.u} / ${m.l}</b></span>
            </div>
            <div class="note">${esc(m.desc)}</div>
            <div class="bar"><i style="width:${pct}%"></i></div>
          </div>
        `;
      }).join('')}
      <div class="note" style="margin:14px 0 6px;font-weight:700">CANLI SİSTEM KAYITLARI</div>
      <div class="note" style="background:#07090e;padding:10px;border-radius:10px;border:1px solid var(--border);line-height:1.7">
        ${store.log.map(esc).join('<br>') || 'Sistem hazır.'}
      </div>
    `;
  }
}

/* ============================================================================
   5. EŞYA TASARIMI, PERSONEL MODALI VE KANVAS ETKİLEŞİMİ
   ============================================================================ */
cv.addEventListener('click', e => {
  if (!OWN) return;
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * 1400;
  const sy = (e.clientY - r.top) / r.height * 920;

  if (store.leftMode === 'design' && store.selectedItemId) {
    const [gx, gy] = screenToGrid(sx, sy);
    const it = store.items.find(x => x.id === store.selectedItemId);
    if (it) {
      it.x = gx; it.y = gy;
      saveItemsToFirestore();
      renderLeft();
    }
    return;
  }

  let best = null, bestDist = 36;
  store.staff.forEach(a => {
    const q = P(a.ax, a.ay, 0);
    const d = Math.hypot(q[0] - sx, (q[1] - 25) - sy);
    if (d < bestDist) { bestDist = d; best = a; }
  });
  if (best) openAgentModal(best.id);
});

function addOfficeItem() {
  const type = $('#addItemSelect').value;
  const titles = { table: 'Toplantı Masası', sofa: 'Dinlenme Koltuğu', plant: 'Salon Bitkisi', server: 'Sunucu Kabini', board: 'Sunum Tahtası' };
  const it = { id: 'it_' + Date.now(), type, name: titles[type] || 'Eşya', x: 7, y: 7, hidden: false };
  store.items.push(it);
  store.selectedItemId = it.id;
  saveItemsToFirestore();
  renderLeft();
}

function toggleItemHide(id) {
  const it = store.items.find(x => x.id === id);
  if (it) { it.hidden = !it.hidden; saveItemsToFirestore(); renderLeft(); }
}

function removeOfficeItem(id) {
  store.items = store.items.filter(x => x.id !== id);
  store.selectedItemId = null;
  saveItemsToFirestore();
  renderLeft();
}

function saveItemsToFirestore() {
  if (CONN && OWN) {
    db.doc('public/office').set({ updatedAt: FV().serverTimestamp(), items: store.items }, { merge: true });
  }
}

function openAgentModal(id) {
  const a = id ? store.staff.find(x => x.id === id) : null;
  store.editingAgentId = a ? a.id : null;
  $('#modalTitle').textContent = a ? `Personeli Düzenle: ${a.name}` : 'Yeni Yapay Zeka Personeli Ekle';
  $('#mName').value = a ? a.name : '';
  $('#mRole').value = a ? a.role : '';
  $('#mColor').value = a && a.c ? a.c : '#6366f1';
  $('#mSkills').value = a ? (a.skills || '') : '';

  $('#mRoom').innerHTML = STATIONS.map(st =>
    `<option value="${st.i}" ${a && Number(a.room) === st.i ? 'selected' : ''}>İstasyon ${st.i + 1}</option>`
  ).join('');

  const modelOpts = sel => MODELS.map(m => `<option value="${esc(m.n)}" ${m.n === sel ? 'selected' : ''}>${esc(m.n)} (${esc(m.desc)})</option>`).join('');
  $('#mModel').innerHTML = modelOpts(a ? a.model : 'Gemini 3.5 Flash Lite');
  $('#mBackup').innerHTML = modelOpts(a ? a.backup : 'Gemini 3.1 Flash Lite');

  $('#mDelBtn').style.display = a ? 'inline-block' : 'none';
  $('#mDelBtn').onclick = () => {
    if (!confirm(`${a.name} silinsin mi?`)) return;
    if (CONN && OWN) db.collection('staff').doc(a.id).delete();
    closeAgentModal();
  };

  $('#agentModal').classList.add('on');
}

function closeAgentModal() { $('#agentModal').classList.remove('on'); }

async function saveAgentModal() {
  const name = $('#mName').value.trim();
  const role = $('#mRole').value.trim();
  if (!name || !role) return alert('İsim ve unvan zorunludur.');
  const payload = {
    name, role,
    room: Number($('#mRoom').value || 0),
    color: $('#mColor').value,
    hair: '#1e293b',
    model: $('#mModel').value,
    backup: $('#mBackup').value,
    skills: $('#mSkills').value.trim(),
    active: true,
    status: 'Hazır',
    createdBy: 'owner'
  };
  const docId = store.editingAgentId || db.collection('staff').doc().id;
  await db.collection('staff').doc(docId).set(payload, { merge: true });
  closeAgentModal();
}

/* ============================================================================
   6. FIRESTORE GERÇEK ZAMANLI BAĞLANTILAR
   ============================================================================ */
const nm = id => {
  if (id === 'owner') return 'Sen (Burak Bey)';
  const s = store.staff.find(x => x.id === id || x.name === id);
  return s ? `${s.name} · ${s.role}` : id;
};
const tm = t => t && t.toDate ? t.toDate().toTimeString().slice(0, 5) : hhmm();

function syncStaffList(docs) {
  const ids = new Set(docs.map(x => x.id));
  store.staff = store.staff.filter(a => ids.has(a.id));
  docs.forEach(x => {
    const room = Number(x.room || 0) % STATIONS.length;
    const st = STATIONS[room];
    let a = store.staff.find(s => s.id === x.id);
    if (!a) {
      a = {
        id: x.id, name: x.name, role: x.role, room,
        model: x.model || 'Gemini 3.5 Flash Lite',
        backup: x.backup || 'Gemini 3.1 Flash Lite',
        skills: x.skills || '', used: x.usedToday || 0,
        c: x.color || st.color, ax: st.sx, ay: st.sy,
        path: [], mon: 0, act: false, bt: '', on: 0, st: x.status || 'Hazır', ph: Math.random() * 6
      };
      store.staff.push(a);
    } else {
      Object.assign(a, {
        name: x.name, role: x.role, room,
        model: x.model || a.model, backup: x.backup || a.backup,
        skills: x.skills || '', used: x.usedToday || a.used, c: x.color || a.c
      });
    }
  });

  const sel = $('#targetAgent');
  if (sel) {
    const cur = sel.value;
    sel.innerHTML = store.staff.map(a => `<option value="${esc(a.id)}">Alıcı: ${esc(a.name)} (${esc(a.role)})</option>`).join('');
    if (cur && store.staff.some(a => a.id === cur)) sel.value = cur;
  }
  renderLeft();
}

async function createInternalMail({ fromId, fromName, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  if (!CONN || !OWN) return;
  const ts = FV().serverTimestamp();
  await db.collection('mails').add({
    from: fromId, to: toId, subject, body, type: type || 'görev',
    threadId: threadId || ('th_' + Date.now()),
    processed: toId === 'owner',
    notBefore: firebase.firestore.Timestamp.fromMillis(notBeforeMs || Date.now()),
    createdAt: ts
  });
}

async function markMailProcessed(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  if (m) m.processed = true;
  if (CONN && OWN) {
    await db.collection('mails').doc(mailId).update({ processed: true, readAt: FV().serverTimestamp() }).catch(() => {});
  }
}

async function forceRunMail(mailId) {
  if (CONN && OWN) {
    await db.collection('mails').doc(mailId).update({
      notBefore: firebase.firestore.Timestamp.fromMillis(Date.now() - 1000)
    }).catch(() => {});
  }
  nextAllowedCallTime = 0;
  processNextPendingMail(true);
}

async function sendReply(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  const txt = $('#replyInput')?.value.trim();
  if (!m || !txt) return;
  const target = store.staff.find(s => s.id === m.fromId || s.id === m.toId) || store.staff[0];
  if (!target) return;
  await createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: `${target.name} · ${target.role}`,
    subject: 'RE: ' + m.subj, body: txt,
    type: 'görev', threadId: m.threadId, notBeforeMs: Date.now()
  });
  $('#replyInput').value = '';
  nextAllowedCallTime = 0;
  processNextPendingMail(true);
}

async function saveSharedFile(path, content, kind, ownerName) {
  if (!CONN || !OWN) return;
  const existing = store.files.find(f => f.path === path);
  const ts = FV().serverTimestamp();
  const docId = existing ? existing.id : db.collection('files').doc().id;
  const ver = existing ? (existing.version || 1) + 1 : 1;
  await db.collection('files').doc(docId).set({
    path, content, owner: ownerName, kind: kind || 'md',
    version: ver, createdAt: ts, updatedAt: ts
  }, { merge: true });
}

function downloadSharedFile(fileId) {
  const f = store.files.find(x => x.id === fileId);
  if (!f) return;
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.path;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function startOwnerSession() {
  un.forEach(f => f()); un = [];

  try {
    const sec = await db.doc('settings/secret').get();
    if (sec.exists && sec.data().apiKey) {
      store.geminiKey = sec.data().apiKey.trim();
      lg('🔑 Gemini API anahtarı Firestore gizli kasasından yüklendi.');
    }
  } catch (e) {}

  un.push(db.doc('public/office').onSnapshot(d => {
    if (d.exists && Array.isArray(d.data().items)) {
      store.items = d.data().items.map((it, idx) =>
        typeof it === 'string' ? { id: 'it_' + idx, type: 'table', name: it, x: 7, y: 7 } : it
      );
      renderLeft();
    }
  }));

  un.push(db.collection('staff').onSnapshot(q => {
    syncStaffList(q.docs.map(d => ({ id: d.id, ...d.data() })));
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id, fromId: m.from, toId: m.to,
        f: nm(m.from), t: nm(m.to),
        subj: m.subject, body: m.body, type: m.type || 'görev',
        threadId: m.threadId || d.id, processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    renderRight();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(50).onSnapshot(q => {
    store.files = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.updatedAt) }));
    renderRight();
  }));

  un.push(db.collection('usage').doc(todayKey()).onSnapshot(d => {
    if (d.exists && d.data().pools) {
      const p = d.data().pools;
      MODELS.forEach(m => { if (p[m.n] != null) m.u = p[m.n]; });
      renderRight();
    }
  }));
}

function setOwnerUI(isOwn) {
  OWN = isOwn;
  $('#cmdBar').style.display = isOwn ? 'flex' : 'none';
  $('#resetProj').style.display = isOwn ? 'inline-block' : 'none';
  $('#stop').style.display = isOwn ? 'inline-block' : 'none';
  $('#bl').textContent = isOwn ? 'Çıkış Yap' : 'Yönetici Girişi';
  $('#bl').className = isOwn ? '' : 'p';
  $('#engBadge').className = isOwn ? 'badge ok' : 'badge';
  $('#engBadge').textContent = isOwn ? '🟢 Komuta Merkezi Aktif' : 'Vitrin Modu';
  renderLeft();
  renderRight();
}

$('#bl').onclick = () => {
  if (CONN && !OWN) return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  if (CONN && OWN) return auth.signOut();
};

$('#go').onclick = async () => {
  const txt = $('#ti').value.trim();
  if (!txt) return alert('Lütfen görev emrini yazın.');
  const target = store.staff.find(s => s.id === $('#targetAgent').value) || store.staff[0];
  if (!target) return alert('Önce sol panelden personel ekleyin.');
  $('#ti').value = '';
  const subj = txt.length > 52 ? txt.slice(0, 52) + '...' : txt;
  await createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: `${target.name} · ${target.role}`,
    subject: subj, body: txt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  nextAllowedCallTime = 0;
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => { nextAllowedCallTime = 0; processNextPendingMail(true); };

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? '▶️ Devam Et' : '⏸ Duraklat';
  $('#engBadge').textContent = halt ? '⏸ Duraklatıldı' : '🟢 Komuta Merkezi Aktif';
};

$('#resetProj').onclick = async () => {
  if (!confirm('Tüm yazışmalar ve ortak klasör dosyaları silinip yeni proje başlatılsın mı?')) return;
  const batch = db.batch();
  const [mSnap, tSnap, fSnap] = await Promise.all([
    db.collection('mails').get(),
    db.collection('tasks').get(),
    db.collection('files').get()
  ]);
  mSnap.forEach(d => batch.delete(d.ref));
  tSnap.forEach(d => batch.delete(d.ref));
  fSnap.forEach(d => batch.delete(d.ref));
  await batch.commit();
  store.blockedModelsUntil = {};
  store.failCountByMail = {};
  lg('🗑️ Tüm mesajlar ve dosyalar temizlendi, yeni projeye hazır!');
};

async function initFirebase() {
  for (const u of ['app', 'auth', 'firestore']) {
    await new Promise((r, j) => {
      const s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
      s.onload = r; s.onerror = j; document.head.appendChild(s);
    });
  }
  firebase.initializeApp(FB);
  db = firebase.firestore(); auth = firebase.auth(); CONN = true;
  auth.onAuthStateChanged(async u => {
    if (!u) {
      setOwnerUI(false);
      const pub = await db.doc('public/office').get();
      if (pub.exists && pub.data().staff) syncStaffList(pub.data().staff);
      return;
    }
    setOwnerUI(true);
    startOwnerSession();
  });
}
initFirebase();
