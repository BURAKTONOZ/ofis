  cx.beginPath();

  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(255,255,255,.55)');

function bfs(s, t) {
  const q = [s], pr = {}; pr[s] = 1;
  while (q.length) {
    const c = q.shift();
    if (c[0] == t[0] && c[1] == t[1]) break;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

  let c = t;
  while (!(c[0] == s[0] && c[1] == s[1])) { p.unshift([c[0] + .5, c[1] + .5]); c = pr[c]; }
  return p;

// Ajanlara iş yokken ofiste doğal dolaşma / kahve molası hareketi
async function life(a) {
  await sleep(rnd(800, 3500));
  while (a.alive) {
    if (busy || halt || a.act) { await sleep(600); continue; }
    a.act = true;
    const r = Math.random();
    if (r < .58) {
      a.st = 'Masasında'; a.mon = 1; say(a, 'type', 'İnceleme yapıyor');
      await sleep(rnd(6000, 11000)); a.mon = 0;
    } else if (r < .82) {
      const k = ['yemek', 'mola', 'toplanti'][Math.floor(Math.random() * 3)];
      const sp = SP[k][Math.floor(Math.random() * 3)];
      a.st = k == 'yemek' ? 'Yemekhanede' : k == 'mola' ? 'Kahve Molasında' : 'Toplantı Alanında';
      hush(a); await walk(a, sp[0], sp[1]);
      say(a, k == 'toplanti' ? 'type' : 'cup', a.st);
      await sleep(rnd(5000, 9000)); hush(a);
    } else {
      a.st = 'Ortak Klasörde'; hush(a);
      const sp = SP.arsiv[Math.floor(Math.random() * 2)];
      await walk(a, sp[0], sp[1]); say(a, 'doc', 'Arşivi kontrol ediyor');
      await sleep(3000);
    }
    hush(a); a.st = 'Odasına dönüyor'; await goHome(a); a.st = 'Odasında'; a.act = false;
    await sleep(rnd(3000, 6000));
  }
}

  list.forEach(x => {
    const room = x.room != null && x.room >= 0 && x.room < RM.length ? x.room : 0;
    let a = store.staff.find(s => s.id === x.id);
    if (!a) a = mkAgent({ ...x, room });

// Kota kontrolü ve otomatik Yedek Model (Fallback) seçimi (Sıfır Token Harcar)
function selectAvailableModel(agent) {
  const primary = mdl(agent.model);
  if (primary.u < primary.l) return primary;
  const backup = mdl(agent.backup || 'Gemma 4 31B');
  if (backup.u < backup.l) {
    lg(`⚠️ ${agent.name} ana model kotasını (${primary.n}: ${primary.u}/${primary.l}) doldurdu. Yedek modele (${backup.n}) geçildi.`);
    return backup;
  }
  return null;
}

async function incrementModelQuota(modelObj, agent) {
  modelObj.u++;
  agent.used = (agent.used || 0) + 1;
  if (CONN && OWN) {
    const dayRef = db.collection('usage').doc(todayKey());
    const poolsUpdate = {};
    MODELS.forEach(m => { poolsUpdate[m.n] = m.u; });

    await db.collection('staff').doc(agent.id).set({ usedToday: agent.used, lastActionAt: FV().serverTimestamp() }, { merge: true }).catch(() => {});
  }
}

// Kuyruktaki tek bir mesajı işleyen ana fonksiyon
async function processNextPendingMail(forceNow = false) {
  if (busy || halt) return;
  if (!store.geminiKey) return;

  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  // İşlenmemiş ve alıcısı bir ajan olan en eski mesajı bul
  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) return;

  const agent = store.staff.find(s => s.id === pending.toId || s.name === pending.t);
  if (!agent) {
    await markMailProcessed(pending.id);
    return;
  }

  // Sonsuz döngü koruması (Max Chain Depth)
  const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
  if (threadMails.length >= store.maxChainDepth) {
    lg(`🛑 Görev zinciri maksimum adım sınırına (${store.maxChainDepth}) ulaştı. Otomatik durduruldu.`);
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  updateEngineBadges('Çalışıyor: ' + agent.name);

  try {
    // 1. Ajanı odasına/bilgisayar başına geçir
    agent.act = true;
    await goHome(agent);
    agent.mon = 1;
    agent.st = 'Görev üzerinde çalışıyor';
    say(agent, 'think', 'Mesajı analiz ediyor...');
    render();

    // 2. Gemini API ile ajanın kararını ve üretimini al
    const decision = await callGeminiAgent(agent, pending, threadMails, store.files);

    if (decision.canvasBubble) {
      say(agent, 'type', decision.canvasBubble);
    }

    // 3. Ajan bir dosya ürettiyse Ortak Klasöre yürüsün ve kaydettirsin
    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      const sp = SP.arsiv[0];
      agent.st = 'Ortak Klasöre dosya yüklüyor';
      await walk(agent, sp[0], sp[1]);
      say(agent, 'doc', decision.fileToSave.path + ' kaydedildi');
      await saveSharedFile(decision.fileToSave.path, decision.fileToSave.content, decision.fileToSave.kind || 'md', agent.name);
      lg(`📁 ${agent.name} ortak klasöre dosya bıraktı: ${decision.fileToSave.path}`);
      await sleep(1600);
    }

    // 4. Gönderilecek mailleri sırayla ilgili ajanların odasına yürüyerek teslim et
    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = out.toAgentId === 'owner'
        ? { id: 'owner', name: 'Sen (Burak Bey)' }
        : (store.staff.find(s => s.id === out.toAgentId || s.name === out.toAgentId) || null);

      if (!target) continue;

      if (target.id !== 'owner') {
        const d = door(target);
        agent.st = target.name + ' odasına gidiyor';
        await walk(agent, d[0], d[1]);
        say(agent, 'mail', target.name + ' ile görüşüyor');
      } else {
        say(agent, 'doc', 'Yöneticiye rapor sunuyor');
      }

      // Kota koruması için bir sonraki mesaja dinlenme zamanı (notBefore) ekle
      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id,
        fromName: agent.name,
        toId: target.id,
        toName: target.name,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });

      lg(`✉️ ${agent.name} → ${target.name}: ${out.subject}`);
      await sleep(1800);
    }

    // 5. Son onay kutusuna sunulduysa
    if (decision.submitFinalApproval && decision.submitFinalApproval.ready) {
      showApprovalBox(pending.subj, decision.submitFinalApproval.summary || 'Tüm departmanlar çalışmayı tamamladı.');
    }

    // 6. Mevcut maili işlendi olarak işaretle ve odaya dön
    await markMailProcessed(pending.id);
    agent.mon = 0;
    hush(agent);
    await goHome(agent);
    agent.st = 'Odasında (Dinleniyor)';
    agent.act = false;

    // Bir sonraki API çağrısı için dinlenme (cooldown) sayacını başlat
    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    lg(`❌ Hata (${agent.name}): ${err.message}`);
    agent.mon = 0; agent.act = false; hush(agent);
    nextAllowedCallTime = Date.now() + 15000;
  } finally {
    busy = false;
    render();
  }
}

let db = null, auth = null, CONN = false, vt = 0, un = [], pt = 0;
const FV = () => firebase.firestore.FieldValue;

const nm = id => id === 'owner' ? 'Sen (Burak Bey)' : (store.staff.find(s => s.id === id) || { name: id }).name;
const tm = t => t && t.toDate ? t.toDate().toTimeString().slice(0, 5) : hhmm();

async function createInternalMail({ fromId, fromName, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  const mailObj = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    fromId, toId, f: fromName, t: toName,
    subj: subject, body, type: type || 'görev',
    threadId: threadId || ('th_' + Date.now()),
    processed: toId === 'owner',
    notBeforeMs: notBeforeMs || Date.now(),
    time: hhmm()
  };

  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const tid = db.collection('tasks').doc().id;
    if (toId !== 'owner') {
      await db.collection('tasks').doc(tid).set({
        title: subject, description: body.slice(0, 1500),
        owner: toId, createdBy: fromId, status: 'bekliyor',
        priority: 1, createdAt: ts, updatedAt: ts
      }).catch(e => lg('Görev yazılamadı: ' + e.code));
    }
    await db.collection('mails').add({
      from: fromId, to: toId, subject, body, type: mailObj.type,
      taskId: tid, threadId: mailObj.threadId,
      processed: mailObj.processed,
      notBefore: firebase.firestore.Timestamp.fromMillis(mailObj.notBeforeMs),
      createdAt: ts
    });
  } else {
    store.mails.unshift(mailObj);
    if (toId !== 'owner') {
      const ag = store.staff.find(s => s.id === toId);
      if (ag) ag.tasks.unshift({ t: subject, s: 'bekliyor', by: fromName });
    }
    render();
  }
}

async function markMailProcessed(mailId) {
  const m = store.mails.find(x => x.id === mailId);
  if (m) m.processed = true;
  if (CONN && OWN && !String(mailId).startsWith('m_')) {
    await db.collection('mails').doc(mailId).update({
      processed: true,
      readAt: FV().serverTimestamp()
    }).catch(() => {});
  }
}

async function saveSharedFile(path, content, kind, ownerName) {
  const existing = store.files.find(f => f.path === path);
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const docId = existing ? existing.id : db.collection('files').doc().id;
    const ver = existing ? (existing.version || 1) + 1 : 1;
    await db.collection('files').doc(docId).set({
      path, content, owner: ownerName, kind: kind || 'md',
      version: ver, createdAt: ts, updatedAt: ts
    }, { merge: true });
  } else {
    if (existing) {
      existing.content = content; existing.version++; existing.owner = ownerName; existing.time = hhmm();
    } else {
      store.files.unshift({ id: 'f_' + Date.now(), path, content, kind, owner: ownerName, version: 1, time: hhmm() });
    }
  }
}

cv.addEventListener('click', e => {
  if (!OWN) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 800, y = (e.clientY - r.top) / r.height * 530;
  let best = null, bd = 26;
  store.staff.forEach(a => {
    const q = P(a.ax, a.ay, 0), d = Math.hypot(q[0] - x, q[1] - 24 - y);
    if (d < bd) { bd = d; best = a; }
  });
  if (best) form(best.id);
});

function fbDelStaff(id) {
  if (!CONN || !OWN) return;
  db.collection('staff').doc(id).delete().then(pub).catch(e => lg('Silme hatası: ' + e.code));
}

function pub() {
  if (!CONN || !OWN) return;
  clearTimeout(pt);
  pt = setTimeout(() => db.doc('public/office').set({
    updatedAt: FV().serverTimestamp(),
    paused: halt,
    items: tbOn ? ['yemek-masasi'] : [],
    staff: store.staff.map(a => ({ id: a.id, name: a.name, role: a.role, room: a.room, color: a.c, hair: a.h, state: 'work' }))
  }).catch(() => {}), 1000);
}

function stopOwnerListeners() { un.forEach(f => f()); un = []; }

function startOwnerListeners() {
  clearInterval(vt); stopOwnerListeners();

  // Başlangıç budget belgesini garantiye al
  db.doc('settings/budget').set({
    allowedModels: MODELS.map(m => m.n),
    maxStaff: 16,
    dailyCallCap: 15000
  }, { merge: true }).catch(() => {});

  un.push(db.collection('staff').onSnapshot(q => {
    if (q.empty && store.staff.length === 0) {
      seedDefaultStaff();
      return;
    }
    syncStaff(q.docs.map(d => ({ id: d.id, ...d.data() })));
    render();
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id,
        fromId: m.from,
        toId: m.to,
        f: nm(m.from),
        t: nm(m.to),
        subj: m.subject,
        body: m.body,
        type: m.type || 'görev',
        threadId: m.threadId || d.id,
        processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    render();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(50).onSnapshot(q => {
    store.files = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.updatedAt) }));
    render();
  }));

  un.push(db.collection('usage').doc(todayKey()).onSnapshot(d => {
    if (d.exists && d.data().pools) {
      const p = d.data().pools;
      MODELS.forEach(m => { if (p[m.n] != null) m.u = p[m.n]; });
      render();
    }
  }));
}

async function pollPublic() {
  try {
    const d = await db.doc('public/office').get(), o = d.exists ? d.data() : {};
    if (o.staff && o.staff.length) syncStaff(o.staff);
    else if (!store.staff.length) seedDefaultStaff();
  } catch (e) {
    if (!store.staff.length) seedDefaultStaff();
  }
}

function setOwner(b) {
  OWN = b;
  $('#panel').classList.toggle('on', b);
  $('#bl').textContent = b ? 'Çıkış Yap' : 'Yönetici Girişi';
  $('#bl').className = b ? '' : 'p';
  updateEngineBadges();
  render();
}

$('#bl').onclick = () => {
  if (CONN && !OWN) return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('Giriş hatası: ' + e.message));
  if (CONN && OWN) return auth.signOut();
  setOwner(!OWN);
};

$('#go').onclick = async () => {
  const txt = $('#ti').value.trim();
  if (!txt) return alert('Lütfen departmana iletilecek görev konusunu yazın.');
  const targetId = $('#targetAgent').value;
  const target = store.staff.find(s => s.id === targetId) || store.staff[0];
  if (!target) return alert('Önce şirkete personel ekleyin.');

  $('#ti').value = '';
  const subj = txt.length > 55 ? txt.slice(0, 55) + '...' : txt;
  await createInternalMail({
    fromId: 'owner', fromName: 'Sen (Burak Bey)',
    toId: target.id, toName: target.name,
    subject: subj, body: txt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  lg(`Sen → ${target.name}: Yeni görev verildi (${subj})`);
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => processNextPendingMail(true);

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? 'Mesaiye Devam Et' : 'Acil Durdur';
  lg(halt ? '⏸ ACİL DURDUR: Tüm ajanlar beklemeye alındı.' : '▶️ Mesai devam ediyor.');
  updateEngineBadges();
};

async function fbLoad() {
  try {
    for (const u of ['app', 'auth', 'firestore']) {
      await new Promise((r, j) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
        s.onload = r; s.onerror = j; document.head.appendChild(s);
      });
    }
    firebase.initializeApp(FB);
    db = firebase.firestore(); auth = firebase.auth(); CONN = true;
    auth.onAuthStateChanged(async u => {
      if (!u) { setOwner(false); pollPublic(); vt = setInterval(pollPublic, 30000); return; }
      try {
        await db.doc('settings/guard').get();
        setOwner(true); startOwnerListeners();
      } catch (e) {
        setOwner(false); await auth.signOut();
        alert('Bu Google hesabı (buraktonoz@gmail.com dışındaki hesaplar) yönetici paneline erişemez.');
      }
    });
  } catch (e) {
    CONN = false; seedDefaultStaff(); setOwner(true);
  }
}
fbLoad();
</script>
