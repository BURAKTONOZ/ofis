/* ============================================================================

   ============================================================================ */
const cv = $('#cv'), cx = cv.getContext('2d');
cx.scale(2, 2);
const TW = 28, TH = 14, OX = 400, OY = 112, N = 14, WL = 92;
const P = (x, y, z = 0) => [OX + (x - y) * TW, OY + (x + y) * TH - z];
const hs = (c, d) => 'hsl(' + c[0] + ' ' + c[1] + '% ' + Math.max(4, Math.min(96, c[2] + d)) + '%)';

function poly(p, f, s, lw = 1) {
  cx.beginPath();
  p.forEach((q, i) => i ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]));
  cx.closePath();
  cx.fillStyle = f; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = lw; cx.stroke(); }
}
function box(x, y, w, d, h, z, c, g) {
  const t = z + h;
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], g || hs(c, -8));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], hs(c, -18));
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], hs(c, 8));
}
function glass(x, y, w, d, h) {
  const t = h;
  poly([P(x, y + d, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(148,163,184,.16)', 'rgba(148,163,184,.38)');
  poly([P(x + w, y, 0), P(x + w, y + d, 0), P(x + w, y + d, t), P(x + w, y, t)], 'rgba(148,163,184,.22)', 'rgba(148,163,184,.38)');
  poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], 'rgba(226,232,240,.35)');
}
const disc = (x, y, r, c) => { cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fillStyle = c; cx.fill(); };
const el = (x, y, a, b, c) => { cx.beginPath(); cx.ellipse(x, y, a, b, 0, 0, 7); cx.fillStyle = c; cx.fill(); };
const rr = (x, y, w, h, r, c, s) => {
  cx.beginPath(); cx.roundRect(x, y, w, h, r);
  cx.fillStyle = c; cx.fill();
  if (s) { cx.strokeStyle = s; cx.lineWidth = 1.2; cx.stroke(); }
};

const WOOD = [30, 52, 58], DK = [222, 28, 26], WT = [220, 30, 92], COR = [14, 78, 62],
      GRN = [145, 52, 42], BLU = [210, 75, 60], YEL = [42, 88, 62], PNK = [335, 60, 62], CH = [235, 45, 52];

const RM = [
  [0, 0, 3, 1], [4, 0, 3, 1], [8, 0, 3, 1],
  [0, 10, 3, 0], [4, 10, 3, 0], [8, 10, 3, 0],
  [12, 0, 2, 1], [12, 10, 2, 0]
].map((r, i) => ({
  i, x: r[0], y: r[1], w: r[2], top: r[3], wy: r[3] ? 3 : 9,
  hue: [235, 325, 195, 155, 38, 12, 275, 175][i],
  dx: r[2] == 3 ? r[0] + 1 : r[0], dy: r[3] ? 0 : 12,

}));

const BL = Array.from({ length: N }, () => Array(N).fill(0));
const blk = (x, y, w = 1, d = 1) => { for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) if (BL[y + j]) BL[y + j][x + i] = 1; };
RM.forEach(r => {
  blk(r.dx, r.dy, 2, 1);
  for (let x = r.x + 1; x < r.x + r.w; x++) blk(x, r.wy);
  blk(r.x + r.w - 1, r.top ? 2 : 10);
});
[3, 7, 11].forEach(x => { blk(x, 0, 1, 4); blk(x, 9, 1, 5); });
blk(1, 5, 3, 1); blk(1, 7, 3, 1); blk(6, 6, 3, 1); blk(11, 7, 2, 1); blk(13, 4); blk(13, 5, 1, 2);

const SP = {
  yemek: [[4, 6], [0, 6], [1, 6]],
  mola: [[10, 7], [12, 8], [10, 5]],
  toplanti: [[7, 5], [6, 7], [8, 7]],

};

let busy = false, halt = false, OWN = false, T = 0, tbOn = false;

function bfs(s, t) {
  const q = [s], pr = {}; pr[s] = 1;
  while (q.length) {
    const c = q.shift();
    if (c[0] == t[0] && c[1] == t[1]) break;
    for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c[0] + d[0], y = c[1] + d[1];
      if (x < 0 || y < 0 || x >= N || y >= N || BL[y][x] || pr[[x, y]]) continue;
      pr[[x, y]] = c; q.push([x, y]);
    }
  }
  const p = []; if (!pr[t]) return p;
  let c = t;
  while (!(c[0] == s[0] && c[1] == s[1])) { p.unshift([c[0] + .5, c[1] + .5]); c = pr[c]; }
  return p;
}
function walk(a, x, y) {
  a.path = bfs([Math.floor(a.ax), Math.floor(a.ay)], [x, y]);
  return new Promise(r => { a.res = r; if (!a.path.length) r(); });
}
const door = a => { const r = RM[a.room] || RM[0]; return [r.x, r.top ? 4 : 8]; };
const seat = a => { const r = RM[a.room] || RM[0]; return [r.sx, r.sy]; };
const goHome = a => walk(a, ...seat(a));
const say = (a, i, t) => { a.bi = i; a.bt = t; a.on = 1; };
const hush = a => { a.on = 0; };

function upd(dt) {
  store.staff.forEach(a => {
    a.mv = 0;
    if (a.path.length) {
      const p = a.path[0], dx = p[0] - a.ax, dy = p[1] - a.ay, d = Math.hypot(dx, dy), s = 2.6 * dt;
      a.mv = 1;
      if (d <= s) {
        a.ax = p[0]; a.ay = p[1]; a.path.shift();
        if (!a.path.length && a.res) { const r = a.res; a.res = 0; r(); }
      } else { a.ax += dx / d * s; a.ay += dy / d * s; }
    }
  });
}

function getActiveSceneMods() {
  const base = (store.officeMods && Array.isArray(store.officeMods.sceneMods)) ? store.officeMods.sceneMods : [];
  const prev = (store.previewMods && Array.isArray(store.previewMods.sceneMods)) ? store.previewMods.sceneMods : [];
  return [...base, ...prev];
}

const compiledDrawCache = new Map();
function collectDynamicSceneObjects() {
  const mods = getActiveSceneMods();
  const dyn = [];
  mods.forEach((m, idx) => {
    if (!m || !m.drawJs) return;
    const depth = Number(m.depth) || 12;
    let fn = compiledDrawCache.get(m.drawJs);
    if (!fn) {
      try {
        fn = new Function('api', `const {box,disc,el,rr,poly,glass,P,hs,RM,T,cx,drawSignboard25D,WOOD,DK,WT,COR,GRN,BLU,YEL,PNK,CH}=api;\n` + m.drawJs);
        compiledDrawCache.set(m.drawJs, fn);
      } catch (e) {
        console.warn('Sahne çizim derleme hatası:', e);
        return;
      }
    }
    dyn.push({
      k: depth + idx * 0.01,
      f: () => {
        try {
          fn({ box, disc, el, rr, poly, glass, P, hs, RM, T, cx, drawSignboard25D, WOOD, DK, WT, COR, GRN, BLU, YEL, PNK, CH });
        } catch (err) {}
      }
    });
  });
  return dyn;
}

function floor() {

  RM.forEach(r => poly([P(r.x, r.top ? 0 : 10), P(r.x + r.w, r.top ? 0 : 10), P(r.x + r.w, r.top ? 3 : 14), P(r.x, r.top ? 3 : 14)], 'hsla(' + r.hue + ',55%,22%,.35)'));
  poly([P(0.4, 4.4), P(4.6, 4.4), P(4.6, 8.6), P(0.4, 8.6)], 'rgba(245,158,11,.07)', 'rgba(245,158,11,.18)');

  poly([P(N, 0), P(N, N), P(N, N, -12), P(N, 0, -12)], '#111626');
}

function dAg(a) {
  const q = P(a.ax, a.ay, 0), sit = !a.mv && Math.hypot(a.ax - seat(a)[0] - .5, a.ay - seat(a)[1] - .5) < .06,
        b = a.mv ? Math.abs(Math.sin(T * 12 + a.ph)) * 2.5 : 0, x = q[0], y = q[1] + (sit ? -5 : 0) - b;
  el(q[0], q[1] + 1, 11, 5, 'rgba(0,0,0,.4)');
  if (!sit) { cx.fillStyle = '#1e293b'; cx.fillRect(x - 6, y - 9, 4, 9); cx.fillRect(x + 2, y - 9, 4, 9); }
  rr(x - 8, y - 26, 16, 19, 6, a.c); rr(x - 11, y - 24, 4, 12, 2, a.c); rr(x + 7, y - 24, 4, 12, 2, a.c);
  disc(x, y - 34, 10.5, '#fde68a'); cx.fillStyle = a.h; cx.beginPath(); cx.arc(x, y - 35, 11, Math.PI, 0); cx.fill();
  const bl = (T + a.ph) % 4 < .12 ? .5 : 2.2;
  el(x - 4, y - 33, 1.7, bl, '#0f172a'); el(x + 4, y - 33, 1.7, bl, '#0f172a');

function ic(t, x, y) {
  cx.strokeStyle = cx.fillStyle = '#818cf8'; cx.lineWidth = 1.4; cx.beginPath();
  if (t == 'mail') { cx.rect(x - 5, y - 3.5, 10, 7); cx.moveTo(x - 5, y - 3.5); cx.lineTo(x, y + 1); cx.lineTo(x + 5, y - 3.5); cx.stroke(); }
  else if (t == 'cup') { cx.rect(x - 4, y - 3, 7, 6); cx.moveTo(x + 3, y - 1); cx.arc(x + 3.5, y + 1, 1.8, -1.6, 1.6); cx.stroke(); }
  else if (t == 'doc') { cx.rect(x - 3.5, y - 4.5, 7, 9); cx.moveTo(x - 1.5, y - 1); cx.lineTo(x + 1.5, y - 1); cx.stroke(); }
  else for (let i = -1; i < 2; i++) { cx.beginPath(); cx.arc(x + i * 4, y, 1.4, 0, 7); cx.fill(); }
}

function draw() {
  cx.clearRect(0, 0, 800, 520);
  floor();
  walls();
  const dynObjs = collectDynamicSceneObjects();
  OB.concat(dynObjs)
    .concat(store.staff.map(a => ({ k: a.ax + a.ay + .02, f: () => dAg(a) })))
    .sort((p, q) => p.k - q.k)
    .forEach(o => o.f());
  over();
  drawAllAgentTagsAndBubbles();
}

let lt = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lt) / 1000 || 0); lt = ts; T = ts / 1000;
  upd(dt); draw(); requestAnimationFrame(frame);
}

function mkAgent(o) {
  const p = PAL[(sid++) % 8], r = RM[o.room] || RM[0];
  const a = {
    id: o.id || ('s' + sid),
    name: o.name,
    role: o.role,

    ay: r.sy + .5,
    path: [],
    mon: 0,

    ph: Math.random() * 6,

    by: o.createdBy || 'owner',

  };
  store.staff.push(a);

async function life(a) {
  await sleep(rnd(1200, 3800));
  while (a.alive) {
    if (busy || halt || a.act) { await sleep(900); continue; }
    a.act = true;
    const r = Math.random();
    if (r < .58) {
      a.st = 'Masasında'; a.mon = 1; say(a, 'type', 'Veri inceliyor');
      await sleep(rnd(6500, 11000)); a.mon = 0;
    } else if (r < .82) {
      const k = ['yemek', 'mola', 'toplanti'][Math.floor(Math.random() * 3)];
      const sp = SP[k][Math.floor(Math.random() * 3)];
      a.st = k == 'yemek' ? 'Yemekhanede' : k == 'mola' ? 'Kahve Molasında' : 'Toplantı Odasında';
      hush(a); await walk(a, sp[0], sp[1]);
      say(a, k == 'toplanti' ? 'type' : 'cup', a.st);
      await sleep(rnd(5500, 9000)); hush(a);
    } else {
      a.st = 'Ortak Arşivde'; hush(a);
      const sp = SP.arsiv[Math.floor(Math.random() * 2)];
      await walk(a, sp[0], sp[1]); say(a, 'doc', 'Arşivi tarıyor');
      await sleep(3200);
    }
    hush(a); a.st = 'Odasına dönüyor'; await goHome(a); a.st = 'Odasında'; a.act = false;
    await sleep(rnd(4000, 7000));
  }
}

function seedDefaultStaff() {
  DEF_STAFF.forEach((d, idx) => addStaff({ ...d, room: idx }));
  lg('Varsayılan 6 kişilik kurumsal departman kadrosu oluşturuldu.');

function addStaff(o) {
  const room = o.room != null ? o.room : RM.findIndex(r => !store.staff.some(s => s.room === r.i));
  if (room < 0) { alert('Ofiste boş oda kalmadı (Maksimum 8 Oda).'); return null; }
  const a = mkAgent({ ...o, room, id: (CONN && OWN) ? db.collection('staff').doc().id : undefined });
  fbSaveStaff(a);
  updateTargetSelect();
  return a;
}

function syncStaff(list) {
  const ids = new Set(list.map(x => x.id));
  store.staff.filter(a => !ids.has(a.id)).forEach(a => { a.alive = false; });
  store.staff = store.staff.filter(a => ids.has(a.id));
  list.forEach(x => {
    const room = x.room != null && x.room >= 0 && x.room < RM.length ? x.room : 0;
    let a = store.staff.find(s => s.id === x.id);
    if (!a) a = mkAgent({ ...x, room });
    else {
      const rc = a.room !== room;
      Object.assign(a, {
        name: x.name,
        role: x.role,
        model: normalizeModelName(x.model || a.model),
        backup: normalizeModelName(x.backup || a.backup),
        skills: x.skills || '',
        used: x.usedToday || a.used,
        room
      });
      if (rc) { a.act = true; goHome(a).then(() => a.act = false); }
    }
    a.saved = true;
  });
  updateTargetSelect();

let activeUIIntervals = [];
function renderActiveUIMods() {
  activeUIIntervals.forEach(id => clearInterval(id));
  activeUIIntervals = [];

  const topSlot = $('#ext-top-right');
  const menuSlot = $('#ext-header-menu');
  const floatSlot = $('#ext-floating-widget');
  const cssSlot = $('#ext-custom-css');
  if (!topSlot || !menuSlot || !floatSlot || !cssSlot) return;

  topSlot.innerHTML = '';
  menuSlot.innerHTML = '';
  floatSlot.innerHTML = '';
  cssSlot.textContent = '';

  const baseUI = (store.officeMods && Array.isArray(store.officeMods.uiMods)) ? store.officeMods.uiMods : [];
  const prevUI = (store.previewMods && Array.isArray(store.previewMods.uiMods)) ? store.previewMods.uiMods : [];
  const allUI = [...baseUI, ...prevUI];

  let combinedCSS = '';
  allUI.forEach((mod, i) => {
    if (mod.css) combinedCSS += `\n/* Mod: ${mod.title || i} */\n` + mod.css;
    const wrapper = document.createElement('div');
    wrapper.className = 'ext-widget-item';
    wrapper.style.display = 'inline-flex';
    wrapper.style.alignItems = 'center';
    wrapper.innerHTML = mod.html || '';

    const slot = String(mod.slot || 'top-right').toLowerCase();
    if (slot.includes('menu') || slot.includes('header')) menuSlot.appendChild(wrapper);
    else if (slot.includes('float')) floatSlot.appendChild(wrapper);
    else topSlot.appendChild(wrapper);

    if (mod.js) {
      try {
        const registerInterval = (fn, ms) => { const id = setInterval(fn, ms); activeUIIntervals.push(id); return id; };
        const fn = new Function('setInterval', mod.js);
        fn(registerInterval);
      } catch (err) {
        console.warn('UI Eklenti JS uyarısı:', err);
      }
    }
  });
  cssSlot.textContent = combinedCSS;

  const totalMods = getActiveSceneMods().length + allUI.length;
  const b = $('#activeModsBadge');
  if (b) {
    if (totalMods > 0) {
      b.style.display = 'block';
      b.innerHTML = `✨ <b>${totalMods} Canlı Güncelleme Aktif</b>${store.previewMods ? ' <span style="color:#fbbf24">(Önizleme Modu)</span>' : ''}`;
    } else {
      b.style.display = 'none';
    }
  }
}

async function applyApprovalToOffice(approvalId) {
  const ap = store.approvals.find(x => x.id === approvalId);
  if (!ap) return;

  const newScene = Array.isArray(ap.sceneMods) ? ap.sceneMods : [];
  const newUI = Array.isArray(ap.uiMods) ? ap.uiMods : [];

  const mergedScene = [...(store.officeMods.sceneMods || [])];
  newScene.forEach(ns => {
    if (!ns || !ns.drawJs) return;
    const id = ns.id || ('sc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5));
    const idx = mergedScene.findIndex(x => x.id === id);
    if (idx >= 0) mergedScene[idx] = { ...ns, id };
    else mergedScene.push({ ...ns, id });
  });

  const mergedUI = [...(store.officeMods.uiMods || [])];
  newUI.forEach(nu => {
    if (!nu || (!nu.html && !nu.css && !nu.js)) return;
    const id = nu.id || ('ui_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5));
    const idx = mergedUI.findIndex(x => x.id === id);
    if (idx >= 0) mergedUI[idx] = { ...nu, id };
    else mergedUI.push({ ...nu, id });
  });

  store.officeMods = {
    version: (store.officeMods.version || 1) + 1,
    sceneMods: mergedScene,
    uiMods: mergedUI
  };
  store.previewMods = null;
  ap.status = 'approved';

  renderActiveUIMods();

  if (CONN && OWN) {
    await db.doc('settings/office_mods').set({
      ...store.officeMods,
      updatedAt: FV().serverTimestamp()
    }, { merge: true }).catch(() => {});

    if (!String(ap.id).startsWith('ap_')) {
      await db.collection('approvals').doc(ap.id).set({
        status: 'approved',
        approvedAt: FV().serverTimestamp()
      }, { merge: true }).catch(() => {});
    }
    pub();
  }

  lg(`✅ Onaylandı ve Firestore'a kaydedildi: ${ap.title}`);
  renderApprovalBanner();
  render();
}

let nextAllowedCallTime = 0;

function getCandidateModelsForAgent(agent) {
  const p = mdl(agent.model);
  const b = mdl(agent.backup || 'Gemma 3 27B');
  const pool = [p, b, mdl('Gemini 2.5 Flash Lite'), mdl('Gemini 2.0 Flash Lite'), mdl('Gemma 3 27B')];
  const unique = [];
  pool.forEach(m => {
    if (m && m.u < m.l && !unique.some(u => u.n === m.n)) unique.push(m);
  });
  return unique;
}

async function callGeminiAgent(agent, incomingMail, threadMails, relatedFiles) {
  const apiKey = store.geminiKey;
  if (!apiKey) throw new Error('Gemini API Anahtarı tanımlı değil! Sağ üstteki "⚙️ API & Mola Ayarları" butonundan anahtarınızı kaydedin.');

  const candidates = getCandidateModelsForAgent(agent);
  if (!candidates.length) throw new Error(`${agent.name} için tüm günlük model kotaları doldu!`);

  const companyDirectory = store.staff.map(s =>
    `- ID: "${s.id}" | İsim: ${s.name} (${s.role}) | Uzmanlık: ${s.skills || ''}`
  ).join('\n');

  const historyText = threadMails.slice(-5).map(m =>
    `[${m.f} (${m.fRole || ''}) -> ${m.t} (${m.type})]: ${m.subj}\n${m.body}`
  ).join('\n---\n');

  const filesOverview = relatedFiles.slice(0, 4).map(f =>
    `Dosya: ${f.path} (Yazan: ${f.owner})\nİçerik:\n${(f.content || '').slice(0, 2800)}`
  ).join('\n===\n') || 'Ortak klasör boş.';

  const systemInstruction = `Sen "TONOZ AI COMPANY" şirketinde çalışan "${agent.name}", unvanın "${agent.role}".
Uzmanlığın: ${agent.skills || ''}

ŞİRKET VE İŞLEYİŞ KURALLARI:
1. Kurumsal İstanbul Türkçesi (Bey/Hanım) kullan.
2. İş bölümü yaparken SADECE aşağıdaki personel listesindeki ID'leri ("toAgentId") kullan:
${companyDirectory}
- Şirket Sahibi ID: "owner" (Burak Bey). Sadece çalışma veya yama tamamlandığında "owner"a rapor/onay gönder.
3. SERBEST 2.5D OFİS TASARIMI VE SİTE ÖZELLİK/MENÜ GELİŞTİRME YETENEĞİ (MEVCUT KODU BOZMADAN):
   - Burak Bey 2.5D ofise herhangi bir şey eklenmesini/değiştirilmesini (örn: odalara ağaç, koridora kedi, toplantı odasına ekran, araba, heykel, halı, yeni eşya vb.) VEYA site arayüzüne yeni bir özellik (örn: sağ üst köşeye saat, sayaç, döviz, yeni menü, hesaplama aracı vb.) istediğinde:
   - Planlama Yöneticisi isen: İşi Tasarım ve Kod uzmanlarına devret.
   - Kod, Tasarım veya Kalite Uzmanı isen: İşi tamamla, "officePatch.hasPatch": true yap ve Burak Bey'e ("owner") sun!
   - 2.5D Sahne Çizim API'si ("sceneMods[].drawJs" içinde doğrudan kullanabileceğin fonksiyonlar):
     * Koordinat sistemi: x (0..14), y (0..14), z (yükseklik: 0..90). Odalar dizisi: RM (her oda r için r.x, r.y, r.w, r.top). Zaman (animasyon için): T (saniye).
     * box(x, y, w, d, h, z, [Hue, Sat, Light], optFrontHex): 3 boyutlu izometrik prizma/kutu çizer.
     * P(x, y, z): İzometrik (x,y,z) noktasını 2D ekran koordinatı [px, py] olarak döndürür.
     * disc(px, py, r, colorStr): Ekran koordinatında daire/küre çizer.
     * el(px, py, rx, ry, colorStr): Elips çizer.
     * rr(px, py, w, h, radius, fillStr, strokeStr): Yuvarlatılmış kutu çizer.
     * drawSignboard25D(x, y, z, title, sub, icon, accentHex): Asılı 2.5D tabela çizer.
     * Örnek drawJs (tüm odalara sallanan ağaç çizimi):
       "RM.forEach((r,i)=>{ const x=r.x+0.4, y=r.top?2.3:10.3; box(x-0.2,y-0.2,0.4,0.4,10,0,[25,55,45]); box(x-0.05,y-0.05,0.1,0.1,14,10,[30,45,30]); const q=P(x,y,26), sw=Math.sin(T*2+i)*1.5; disc(q[0]+sw,q[1]-8,11,'#10b981'); disc(q[0]-6+sw,q[1]-3,8,'#059669'); disc(q[0]+6+sw,q[1]-3,8,'#047857'); });"
   - Site Arayüzü Eklenti API'si ("uiMods"):
     * "slot": "top-right" (sağ üst köşe), "header-menu" (üst menü), "floating-widget" (sol alt yüzen araç).
     * "html": Eklenecek HTML kodu, "css": Ek CSS kuralları, "js": Çalışacak JS kodu (periyodik işlemler için setInterval(fn, ms) kullanabilirsin).
4. Yanıtını SADECE aşağıdaki geçerli JSON formatında ver:
{
  "canvasBubble": "Kısa eylem (Örn: Tasarımı kodluyor)",
  "fileToSave": {
    "path": "Dosya adı - yoksa ''",
    "kind": "md | code | svg | json",
    "content": "Dosya içeriği"
  },
  "outgoingMails": [
    {
      "toAgentId": "Alıcı ID (veya owner)",
      "subject": "Konu",
      "body": "Detaylı mesaj",
      "type": "görev | rapor | onay"
    }
  ],
  "officePatch": {
    "hasPatch": false,
    "title": "Güncelleme Başlığı",
    "summary": "Burak Bey için özet",
    "sceneMods": [
      { "id": "benzersiz_id", "label": "Kısa İsim", "depth": 12, "drawJs": "// 2.5D JS çizim kodu" }
    ],
    "uiMods": [
      { "id": "benzersiz_ui_id", "slot": "top-right", "title": "Özellik Adı", "html": "", "css": "", "js": "" }
    ]
  },
  "submitFinalApproval": {
    "ready": false,
    "summary": "Proje tamamlandıysa yönetici özeti"
  }
}`;

  const userPrompt = `GELEN GÖREV / MESAJ:
Gönderen: ${incomingMail.f} (${incomingMail.fRole || 'Yönetici'})
Konu: ${incomingMail.subj}
İçerik: ${incomingMail.body}

ÖNCEKİ YAZIŞMALAR:
${historyText}

ORTAK KLASÖR DOSYALARI:
${filesOverview}`;

  let lastErr = null;
  for (let i = 0; i < candidates.length; i++) {
    const modelObj = candidates[i];
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelObj.api}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemInstruction }] },
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          generationConfig: { temperature: 0.35, responseMimeType: 'application/json' }
        })
      });

      if (!res.ok) {
        const errTxt = await res.text();
        lastErr = new Error(`${modelObj.n} (${res.status}): ${errTxt.slice(0, 180)}`);
        lg(`🔄 ${shortName(agent.name)}: ${modelObj.n} kotası dolu/meşgul (${res.status}), yedek modele geçiliyor...`);
        continue;
      }

      await incrementModelQuota(modelObj, agent);
      const data = await res.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      return JSON.parse(rawText);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Gemini API yanıt vermedi.');
}

async function processNextPendingMail(forceNow = false) {
  if (busy || halt) return;
  if (!store.geminiKey) return;

  const now = Date.now();
  if (!forceNow && now < nextAllowedCallTime) return;

  const pending = [...store.mails].reverse().find(m =>
    !m.processed && m.toId && m.toId !== 'owner' && (!m.notBeforeMs || m.notBeforeMs <= now || forceNow)
  );
  if (!pending) return;

  const agent = store.staff.find(s => s.id === pending.toId || s.name === pending.t);
  if (!agent) { await markMailProcessed(pending.id); return; }

  const threadMails = store.mails.filter(m => m.threadId === pending.threadId);
  if (threadMails.length >= store.maxChainDepth) {
    await markMailProcessed(pending.id);
    return;
  }

  busy = true;
  updateEngineBadges(`⚡ Çalışıyor: ${shortName(agent.name)}`);

  try {
    agent.act = true;
    await goHome(agent);
    agent.mon = 1;
    agent.st = 'Çalışıyor';
    say(agent, 'think', 'Analiz ediyor...');
    render();

    const decision = await callGeminiAgent(agent, pending, threadMails, store.files);
    if (decision.canvasBubble) say(agent, 'type', decision.canvasBubble);

    if (decision.fileToSave && decision.fileToSave.path && decision.fileToSave.content) {
      const sp = SP.arsiv[0];
      agent.st = 'Arşive dosya yüklüyor';
      await walk(agent, sp[0], sp[1]);
      say(agent, 'doc', decision.fileToSave.path);
      await saveSharedFile(
        decision.fileToSave.path,
        decision.fileToSave.content,
        decision.fileToSave.kind || 'md',
        `${agent.name} (${shortRole(agent.role)})`
      );
      lg(`📁 ${shortName(agent.name)} ortak arşive kaydetti: ${decision.fileToSave.path}`);
      await sleep(1100);
    }

    const outList = Array.isArray(decision.outgoingMails) ? decision.outgoingMails : [];
    for (let i = 0; i < outList.length; i++) {
      const out = outList[i];
      if (!out.toAgentId || !out.body) continue;

      const target = out.toAgentId === 'owner'
        ? { id: 'owner', name: 'Burak Bey (Yönetici)', role: 'Şirket Sahibi' }
        : (store.staff.find(s => s.id === out.toAgentId || s.name === out.toAgentId) || null);

      if (!target) continue;

      if (target.id !== 'owner') {
        const d = door(target);
        agent.st = shortName(target.name) + ' ile görüşüyor';
        await walk(agent, d[0], d[1]);
        say(agent, 'mail', shortName(target.name) + ' ile görüşüyor');
      } else {
        say(agent, 'doc', 'Onaya sunuyor');
      }

      const delayMs = (i + 1) * (store.cooldownSec * 1000);
      await createInternalMail({
        fromId: agent.id, fromName: agent.name, fromRole: agent.role,
        toId: target.id, toName: target.name,
        subject: out.subject || ('Görev: ' + pending.subj),
        body: out.body,
        type: ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(out.type) ? out.type : 'görev',
        threadId: pending.threadId || pending.id,
        notBeforeMs: Date.now() + delayMs
      });
      lg(`✉️ ${shortName(agent.name)} → ${shortName(target.name)}: ${out.subject}`);
      await sleep(1100);
    }

    const hasPatch = decision.officePatch && decision.officePatch.hasPatch;
    const isFinal = decision.submitFinalApproval && decision.submitFinalApproval.ready;
    if (hasPatch || isFinal) {
      await createApprovalItem({
        title: (decision.officePatch && decision.officePatch.title) || pending.subj,
        summary: (decision.officePatch && decision.officePatch.summary) || (decision.submitFinalApproval && decision.submitFinalApproval.summary) || 'Ekip çalışmayı tamamladı ve onayınıza sunar.',
        createdBy: `${agent.name} (${shortRole(agent.role)})`,
        hasPatch: !!hasPatch,
        sceneMods: (decision.officePatch && Array.isArray(decision.officePatch.sceneMods)) ? decision.officePatch.sceneMods : [],
        uiMods: (decision.officePatch && Array.isArray(decision.officePatch.uiMods)) ? decision.officePatch.uiMods : [],
        threadId: pending.threadId || pending.id
      });
    }

    await markMailProcessed(pending.id);
    agent.mon = 0; hush(agent);
    await goHome(agent);
    agent.st = 'Odasında';
    agent.act = false;

    nextAllowedCallTime = Date.now() + (store.cooldownSec * 1000);
  } catch (err) {
    console.error(err);
    lg(`❌ Hata (${shortName(agent.name)}): ${err.message}`);
    agent.mon = 0; agent.act = false; hush(agent);
    nextAllowedCallTime = Date.now() + 15000;
  } finally {
    busy = false;
    render();
  }
}

async function createInternalMail({ fromId, fromName, fromRole, toId, toName, subject, body, type, threadId, notBeforeMs }) {
  const cleanSubj = String(subject || 'Görev').slice(0, 290);
  const cleanBody = String(body || '').slice(0, 39000);
  const cleanType = ['görev', 'rapor', 'soru', 'bilgi', 'onay'].includes(type) ? type : 'görev';

  const mailObj = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    fromId, toId, f: fromName, fRole: fromRole || 'Uzman', t: toName,
    subj: cleanSubj, body: cleanBody, type: cleanType,
    threadId: threadId || ('th_' + Date.now()),
    processed: toId === 'owner',
    notBeforeMs: notBeforeMs || Date.now(),
    time: hhmm()
  };

  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const tid = db.collection('tasks').doc().id;
    if (toId !== 'owner') {
      await db.collection('tasks').doc(tid).set({
        title: cleanSubj,
        description: cleanBody.slice(0, 1500),
        owner: toId,
        createdBy: fromId,
        status: 'bekliyor',
        priority: 1,
        createdAt: ts,
        updatedAt: ts
      }).catch(() => {});
    }
    await db.collection('mails').add({
      from: fromId,
      to: toId,
      subject: cleanSubj,
      body: cleanBody,
      type: cleanType,
      taskId: tid,
      threadId: mailObj.threadId,
      processed: mailObj.processed,

async function saveSharedFile(path, content, kind, ownerName) {
  const cleanPath = String(path || 'dosya.md').slice(0, 240);
  const cleanContent = String(content || '').slice(0, 900000);
  const existing = store.files.find(f => f.path === cleanPath);
  if (CONN && OWN) {
    const ts = FV().serverTimestamp();
    const docId = existing ? existing.id : db.collection('files').doc().id;
    const ver = existing ? (existing.version || 1) + 1 : 1;
    await db.collection('files').doc(docId).set({
      path: cleanPath, content: cleanContent, owner: ownerName, kind: kind || 'md',
      version: ver, createdAt: ts, updatedAt: ts
    }, { merge: true });
  } else {
    if (existing) {
      existing.content = cleanContent; existing.version++; existing.owner = ownerName; existing.time = hhmm();
    } else {
      store.files.unshift({ id: 'f_' + Date.now(), path: cleanPath, content: cleanContent, kind, owner: ownerName, version: 1, time: hhmm() });
    }
  }
}

function downloadFile(fileId) {
  const f = store.files.find(x => x.id === fileId);
  if (!f) return;
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.path;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

}

async function resetProject() {
  if (!confirm('Mevcut yazışmalar, görevler ve ortak klasör dosyaları sıfırlanacak. Onaylıyor musunuz?')) return;
  if (CONN && OWN) {
    try {
      const batch = db.batch();
      const mSnap = await db.collection('mails').get();
      mSnap.forEach(d => batch.delete(d.ref));
      const tSnap = await db.collection('tasks').get();
      tSnap.forEach(d => batch.delete(d.ref));
      const fSnap = await db.collection('files').get();
      fSnap.forEach(d => batch.delete(d.ref));
      await batch.commit();
      lg('🗑️ Proje yazışma ve dosyaları temizlendi.');
    } catch (e) {
      alert('Sıfırlama hatası: ' + e.message);
    }
  } else {
    store.mails = []; store.tasks = []; store.files = []; store.log = [];
    render();
  }
}

  createInternalMail({
    fromId: 'owner', fromName: 'Burak Bey (Yönetici)', fromRole: 'Şirket Sahibi',
    toId: target.id, toName: target.name,
    subject: 'RE: ' + m.subj, body: txt,
    type: 'görev', threadId: m.threadId, notBeforeMs: Date.now()
  });
  lg(`Sen → ${shortName(target.name)}: ${txt}`);
  $('#replyTxt').value = '';
}

  c.innerHTML = `

    <p class="note">Bu bilgiler sadece yöneticinin okuyabildiği Firestore <code>settings/secret</code> ve <code>settings/guard</code> belgelerinde saklanır.</p>
    <label>Gemini API Anahtarı (AI Studio)</label>
    <input id="setGeminiKey" type="password" value="${esc(store.geminiKey)}" placeholder="AIzaSy...">
    <label>İstekler Arası Güvenli Mola Süresi (Saniye)</label>
    <input id="setCooldown" type="number" min="5" max="180" value="${store.cooldownSec}">
    <div class="row" style="margin-top:14px">
      <button class="p" onclick="saveSettingsModal()">💾 Firestore'a Kaydet</button>
      <button onclick="$('#card').style.display='none'">Kapat</button>
    </div>
  `;
}

async function saveSettingsModal() {
  store.geminiKey = $('#setGeminiKey').value.trim();
  store.cooldownSec = Math.max(5, parseInt($('#setCooldown').value, 10) || 18);

  if (CONN && OWN) {
    await db.doc('settings/secret').set({
      apiKey: store.geminiKey,
      updatedAt: FV().serverTimestamp()
    }, { merge: true }).catch(e => alert('Kayıt hatası: ' + e.message));

    await db.doc('settings/guard').set({
      cooldownSec: store.cooldownSec,
      paused: halt,
      updatedAt: FV().serverTimestamp()
    }, { merge: true }).catch(() => {});
  }
  $('#card').style.display = 'none';
  lg('⚙️ API ve mola ayarları Firestore\'a kaydedildi.');
  render();
}

function openAgentModal(id) {
  const a = id ? store.staff.find(s => s.id == id) : null, c = $('#card');
  c.style.display = 'block';
  const opt = sel => MODELS.map(m => `<option value="${esc(m.n)}" ${m.n === normalizeModelName(sel) ? 'selected' : ''}>${esc(m.n)} (${m.l} RPD)</option>`).join('');
  const free = RM.filter(r => !store.staff.some(s => s.room === r.i) || (a && a.room === r.i));
  c.innerHTML = `
    <h3>${a ? '👤 Personeli Düzenle' : '+ Yeni Ajan Ekle'}</h3>
    <label>İsim (Sahnede otomatik kısa görünür)</label>
    <input id="modalName" value="${esc(a ? a.name : '')}" placeholder="Selin Hanım">
    <label>Unvan / Departman</label>
    <input id="modalRole" value="${esc(a ? a.role : '')}" placeholder="SEO & Strateji Uzmanı">
    <label>Oda Numarası</label>
    <select id="modalRoom">${free.map(r => `<option value="${r.i}" ${a && a.room === r.i ? 'selected' : ''}>Oda 0${r.i + 1}</option>`).join('')}</select>
    <label>Ana Model (Birincil)</label>
    <select id="modalModel">${opt(a ? a.model : 'Gemini 2.5 Flash Lite')}</select>
    <label>Yedek Model (Kota Dolduğunda Otomatik Geçer)</label>
    <select id="modalBackup">${opt(a ? a.backup : 'Gemma 3 27B')}</select>
    <label>Uzmanlık ve Görev Tanımı (Skills)</label>
    <textarea id="modalSkills" rows="3">${esc(a ? a.skills : '')}</textarea>
    <div class="row" style="margin-top:14px">
      <button class="p" onclick="saveAgentData('${a ? a.id : ''}')">💾 Kaydet</button>
      ${a ? `<button class="danger" onclick="delAgent('${a.id}')">Sil</button>` : ''}
      <button onclick="$('#card').style.display='none'">Kapat</button>
    </div>`;
}

function saveAgentData(id) {
  const name = $('#modalName').value.trim().slice(0, 48);
  const role = $('#modalRole').value.trim().slice(0, 75);
  if (!name || !role) return alert('İsim ve unvan zorunludur.');
  const room = +$('#modalRoom').value;
  const model = $('#modalModel').value;
  const backup = $('#modalBackup').value;
  const skills = $('#modalSkills').value.trim();

  if (id) {
    const a = store.staff.find(s => s.id == id);
    Object.assign(a, { name, role, model, backup, skills });
    if (room !== a.room) { a.room = room; a.act = true; goHome(a).then(() => a.act = false); }
    fbSaveStaff(a);
  } else {
    const a = addStaff({ name, role, room, model, backup, skills });
    if (a) lg('Yeni personel kadroya katıldı: ' + name);
  }
  $('#card').style.display = 'none';
  updateTargetSelect();
  render();
}

function delAgent(id) {
  const a = store.staff.find(s => s.id == id);
  if (!a || !confirm(a.name + ' kadrodan çıkarılsın mı?')) return;
  a.alive = false;
  store.staff = store.staff.filter(s => s !== a);
  fbDelStaff(id);
  $('#card').style.display = 'none';
  updateTargetSelect();
  render();
}

/* ============================================================================
   7. FIREBASE AUTH & GERÇEK ZAMANLI (ONSNAPSHOT) SENKRONİZASYON
   ============================================================================ */
function stfData(a) {
  const o = {
    name: String(a.name || 'Ajan').slice(0, 48),
    role: String(a.role || 'Uzman').slice(0, 75),
    room: Number.isInteger(a.room) ? a.room : 0,
    model: a.model,
    backup: a.backup,
    skills: a.skills || '',
    color: a.c,
    hair: a.h,
    active: true,
    status: a.st || 'Odasında',
    usedToday: a.used || 0,
    createdBy: a.by || 'owner'
  };
  if (!a.saved) o.createdAt = FV().serverTimestamp();
  return o;
}

function fbSaveStaff(a) {
  if (!CONN || !OWN) return;
  db.collection('staff').doc(a.id).set(stfData(a), { merge: true }).then(() => { a.saved = true; pub(); }).catch(() => {});
}

function fbDelStaff(id) {
  if (!CONN || !OWN) return;
  db.collection('staff').doc(id).delete().then(pub).catch(() => {});
}

function pub() {
  if (!CONN || !OWN) return;
  clearTimeout(pt);
  pt = setTimeout(() => db.doc('public/office').set({
    updatedAt: FV().serverTimestamp(),
    paused: halt,
    officeMods: store.officeMods,
    staff: store.staff.map(a => ({ id: a.id, name: a.name, role: a.role, room: a.room, color: a.c, hair: a.h, state: 'work' }))
  }, { merge: true }).catch(() => {}), 1000);
}

function stopOwnerListeners() { un.forEach(f => f()); un = []; }

async function startOwnerListeners() {
  clearInterval(vt); stopOwnerListeners();

  try {
    const secretDoc = await db.doc('settings/secret').get();
    if (secretDoc.exists && secretDoc.data().apiKey) {
      store.geminiKey = secretDoc.data().apiKey;
      lg('🔐 Gemini API anahtarı Firestore kasasından yüklendi.');
    }
  } catch (e) {}

  try {
    const guardDoc = await db.doc('settings/guard').get();
    if (guardDoc.exists && guardDoc.data().cooldownSec) {
      store.cooldownSec = guardDoc.data().cooldownSec;
    }
  } catch (e) {}

  un.push(db.doc('settings/office_mods').onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      store.officeMods = {
        version: d.version || 1,
        sceneMods: Array.isArray(d.sceneMods) ? d.sceneMods : [],
        uiMods: Array.isArray(d.uiMods) ? d.uiMods : []
      };
      renderActiveUIMods();
      render();
    }
  }));

  un.push(db.collection('usage').doc(todayKey()).onSnapshot(doc => {
    if (doc.exists && doc.data().pools) {
      const pools = doc.data().pools;
      Object.keys(pools).forEach(k => {
        const m = mdl(k);
        if (m) m.u = pools[k] || 0;
      });
      render();
    }
  }));

  un.push(db.collection('staff').onSnapshot(q => {
    if (q.empty && store.staff.length === 0) { seedDefaultStaff(); return; }
    syncStaff(q.docs.map(d => ({ id: d.id, ...d.data() })));
    render();
  }));

  un.push(db.collection('mails').orderBy('createdAt', 'desc').limit(80).onSnapshot(q => {
    store.mails = q.docs.map(d => {
      const m = d.data();
      return {
        id: d.id, fromId: m.from, toId: m.to,
        f: nm(m.from), fRole: m.fromRole || 'Uzman', t: nm(m.to),
        subj: m.subject, body: m.body, type: m.type || 'görev',
        threadId: m.threadId || d.id, processed: !!m.processed,
        notBeforeMs: m.notBefore && m.notBefore.toMillis ? m.notBefore.toMillis() : 0,
        time: tm(m.createdAt)
      };
    });
    render();
  }));

  un.push(db.collection('files').orderBy('updatedAt', 'desc').limit(60).onSnapshot(q => {
    store.files = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.updatedAt) }));
    render();
  }));

  un.push(db.collection('approvals').orderBy('createdAt', 'desc').limit(30).onSnapshot(q => {
    store.approvals = q.docs.map(d => ({ id: d.id, ...d.data(), time: tm(d.createdAt) }));
    renderApprovalBanner();
    render();
  }));
}

async function pollPublic() {
  try {
    const d = await db.doc('public/office').get(), o = d.exists ? d.data() : {};
    if (o.staff && o.staff.length) syncStaff(o.staff);
    else if (!store.staff.length) seedDefaultStaff();
    if (o.officeMods) {
      store.officeMods = o.officeMods;
      renderActiveUIMods();
    }
  } catch (e) {
    if (!store.staff.length) seedDefaultStaff();
  }
}

function setOwner(b) {
  OWN = b;
  $('#panel').classList.toggle('on', b);
  $('#settingsBtn').style.display = b ? 'inline-flex' : 'none';
  $('#bl').textContent = b ? 'Çıkış Yap' : 'Yönetici Girişi';
  $('#bl').className = b ? '' : 'p';
  updateEngineBadges();
  renderApprovalBanner();
  render();
}

$('#bl').onclick = () => {
  if (CONN && !OWN) return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('Giriş hatası: ' + e.message));
  if (CONN && OWN) return auth.signOut();
  setOwner(!OWN);
};

$('#go').onclick = async () => {
  const rawTxt = $('#ti').value.trim();
  if (!rawTxt) return alert('Lütfen yapılacak görevi veya eklemek istediğiniz özelliği yazın.');
  const targetId = $('#targetAgent').value;
  const target = store.staff.find(s => s.id === targetId) || store.staff[0];
  if (!target) return alert('Önce personel ekleyin.');

  $('#ti').value = '';
  const subj = rawTxt.length > 56 ? rawTxt.slice(0, 56) + '...' : rawTxt;

  await createInternalMail({
    fromId: 'owner', fromName: 'Burak Bey (Yönetici)', fromRole: 'Şirket Sahibi',
    toId: target.id, toName: target.name,
    subject: subj, body: rawTxt,
    type: 'görev', threadId: 'th_' + Date.now(), notBeforeMs: Date.now()
  });
  lg(`🚀 Görev başlatıldı → ${shortName(target.name)}: ${subj}`);
  processNextPendingMail(true);
};

$('#stepBtn').onclick = () => processNextPendingMail(true);
$('#resetProj').onclick = resetProject;

$('#stop').onclick = () => {
  halt = !halt;
  $('#stop').textContent = halt ? '▶️ Devam Et' : '⏸ Duraklat';
  lg(halt ? '⏸ Ajanlar duraklatıldı.' : '▶️ Çalışma devam ediyor.');
  updateEngineBadges();
};

async function fbLoad() {
  try {
    for (const u of ['app', 'auth', 'firestore']) {
      await new Promise((r, j) => {
        const s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + u + '-compat.js';
        s.onload = r; s.onerror = j; document.head.appendChild(s);
      });
    }
    firebase.initializeApp(FB);
    db = firebase.firestore(); auth = firebase.auth(); CONN = true;
    auth.onAuthStateChanged(async u => {
      if (!u) { setOwner(false); pollPublic(); vt = setInterval(pollPublic, 30000); return; }
      try {
        await db.doc('settings/guard').get();
        setOwner(true); startOwnerListeners();
      } catch (e) {
        setOwner(false); await auth.signOut();
        alert('Bu hesap yönetici yetkisine sahip değil (buraktonoz@gmail.com gerekli).');
      }
    });
  } catch (e) {
    CONN = false; seedDefaultStaff(); setOwner(true);
  }
}
fbLoad();
</script>
