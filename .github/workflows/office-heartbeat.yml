name: Tonoz AI Ofisi 7-24 Otonom Mesai

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik uyanır ve kuyruğu kontrol eder
  workflow_dispatch:      # İstersen GitHub Actions sekmesinden tek tıkla anında çalıştırabilirsin

concurrency:
  group: tonoz-ai-office-worker
  cancel-in-progress: false # Aynı anda iki işçinin çakışıp kotayı harcamasını engeller

jobs:
  run-office-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase Admin SDK Kur
        run: npm install firebase-admin --no-save

      - name: Ofis Ajanlarını Çalıştır
        run: node agent-worker.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
